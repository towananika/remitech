  // ===== 取り消し（2026-10-15 Hibiki指定「すべての作業において、3回は取り戻せるように」）=====
  // 押す・選ぶ・入力する操作の直前に、予約・担当者・休日・リンク・返信・行・ラベル・枠の状態とコメント・タスクの印を写しておき、
  // 操作が落ち着いたら（0.9秒）写しと比べて、変わったところを「1回分」として覚える。最新の3回分まで。
  // 取り消すと、変わったところを前の値にしてサーバーにも送り直す
  var undoStack = [], undoSnap = null, undoTimer = 0, undoApplying = false;
  function undoTake() {
    if (!schedule) return null;
    var slots = {};
    (schedule.slots || []).forEach(function (x) {
      slots[slotKey(x)] = { scheduled: !!x.scheduled, reply: !!x.reply, replyAt: x.replyAt || "", status: x.status || "", skip: !!x.skip, memo: x.memo || "" };
    });
    return JSON.parse(JSON.stringify({
      h: schedule.holidays || {}, a: schedule.assignees || {}, t: schedule.telegram || {}, l: schedule.links || {},
      r: schedule.bkReply || {}, v: schedule.bkHideRows || [], w: schedule.bkAddRows || [], o: schedule.bkLabels || [],
      slots: slots, done: (chores && chores.done) || {},
    }));
  }
  function undoDiff(a, b) {
    var ops = [], same = function (x, y) { return JSON.stringify(x === undefined ? null : x) === JSON.stringify(y === undefined ? null : y); };
    ["h", "a", "t", "l", "r"].forEach(function (kind) {
      var keys = {}; Object.keys(a[kind]).concat(Object.keys(b[kind])).forEach(function (k) { keys[k] = 1; });
      Object.keys(keys).forEach(function (k) { if (!same(a[kind][k], b[kind][k])) ops.push({ kind: kind, key: k, old: a[kind][k] }); });
    });
    ["v", "w", "o"].forEach(function (kind) { if (!same(a[kind], b[kind])) ops.push({ kind: kind, old: a[kind] }); });
    Object.keys(b.slots).forEach(function (k) {
      var o = a.slots[k], n = b.slots[k];
      if (!o) return;   // 新しく作った枠は、状態だけ戻す対象にしない
      if (o.scheduled !== n.scheduled || o.status !== n.status || o.skip !== n.skip || o.reply !== n.reply || o.replyAt !== n.replyAt) ops.push({ kind: "s", key: k, old: o });
      if (o.memo !== n.memo) ops.push({ kind: "m", key: k, old: o.memo });
    });
    var dates = {}; Object.keys(a.done).concat(Object.keys(b.done)).forEach(function (d) { dates[d] = 1; });
    Object.keys(dates).forEach(function (d) {
      var x = a.done[d] || {}, y = b.done[d] || {}, ids = {};
      Object.keys(x).concat(Object.keys(y)).forEach(function (i) { ids[i] = 1; });
      Object.keys(ids).forEach(function (i) { if (!!x[i] !== !!y[i]) ops.push({ kind: "done", key: d, id: i, old: !!x[i] }); });
    });
    return ops;
  }
  function undoMark(e) {
    if (undoApplying || (e.target && e.target.closest && e.target.closest("#undoBtn"))) return;
    if (e.type === "keydown" && (e.ctrlKey || e.metaKey) && (e.key === "z" || e.key === "Z")) return;   // 取り消しのキーそのものは記録しない

  function undoSettle() {

    // 記録しかけの写しがあれば、先にそれを1回分として確定させてから戻す（取り消しの変更は記録しない）
    if (undoSnap) { clearTimeout(undoTimer); undoSettle(); }
    var step = undoStack.pop();
    if (!step) return;
    undoApplying = true;
    var bySlot = {};
    (schedule.slots || []).forEach(function (x) { bySlot[slotKey(x)] = x; });
    step.ops.forEach(function (op) {
      var o = op.old;
      if (op.kind === "h") { schedule.holidays = schedule.holidays || {}; schedule.holidays[op.key] = !!o; bookPush("h", op.key, !!o); }
      else if (op.kind === "a") { schedule.assignees = schedule.assignees || {}; schedule.assignees[op.key] = o || ""; bookPush("a", op.key, o || ""); }
      else if (op.kind === "t") { schedule.telegram = schedule.telegram || {}; schedule.telegram[op.key] = !!o; bookPush("t", op.key, !!o); }
      else if (op.kind === "l") { schedule.links = schedule.links || {}; if (o) schedule.links[op.key] = o; else delete schedule.links[op.key]; bookPush("l", op.key, o || ""); }
      else if (op.kind === "r") { schedule.bkReply = schedule.bkReply || {}; if (o) schedule.bkReply[op.key] = o; else delete schedule.bkReply[op.key]; bookPush("r", op.key, o || { st: "", memo: "" }); }
      else if (op.kind === "v") { schedule.bkHideRows = o; bookPush("v", "rows", o); }
      else if (op.kind === "w") { schedule.bkAddRows = o; bookPush("w", "rows", o); }
      else if (op.kind === "o") { schedule.bkLabels = o; bookPush("o", "labels", o); }
      else if (op.kind === "s") {
        var x = bySlot[op.key]; if (!x) return;

  // 2026-09-17 Hibiki指定:「入力することをちゃんと日時を保存して追跡できるように」
  // 手入力した数字は、確認した日時（時刻まで）と「手入力」の印を残す
  function kmSaveOne(key, v) {
    var p = key.split("|"), ch = p[0], pf = p[1], f = p[2], today = ymd(new Date());
    kpi = kpi || { rows: [] }; kpi.rows = kpi.rows || [];
    var row = kpi.rows.filter(function (r) { return r.date === today && r.channel === ch && r.platform === pf; })[0];
    if (!row) {
      var prev = kpi.rows.filter(function (r) { return r.channel === ch && r.platform === pf; })
        .sort(function (a, b) { return a.date < b.date ? -1 : 1; }).pop();
      row = { date: today, channel: ch, platform: pf };
      if (prev && typeof prev.followers === "number") row.followers = prev.followers;
      if (prev && typeof prev.following === "number") row.following = prev.following;
      kpi.rows.push(row);
    }
    row[f] = v;
    row.source = "manual";   // 自動取得（YouTube等）の値を手で直したときも、この印に上書きする
    row.checkedAt = row.checkedAt || {};
    row.checkedAt[f] = new Date().toISOString();   // 確認した日時（分単位まで）
    kpi.rows.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.channel + a.platform < b.channel + b.platform ? -1 : 1); });
    try { localStorage.setItem("remitech-kpi-local", JSON.stringify(kpi)); } catch (e2) {}

    var out = document.getElementById("kmOut"); if (out) out.textContent = t("saving");

      var o = document.getElementById("kmOut"); if (o) o.textContent = r.where === "repo" ? t("kmSaved") : t("kmLocal");

  }

      if (st.bkMon) bkMon = st.bkMon;
      if (st.tgDate) tgDate = st.tgDate;
      if (typeof st.lkWeek === "number") lkWeek = st.lkWeek;
      if (st.lkMode) lkMode = st.lkMode;
      if (st.hash && !location.hash) { try { history.replaceState(null, "", st.hash); } catch (e1) {} }
      restoreScrollY = st.scrollY || 0;
    } catch (e) {}
  })();

  renderLang();
  renderNav();
  syncWide();
  document.getElementById("loading").textContent = t("loading");

  // 開発・更新・メンテナンス中は、通常の画面の前にこれだけを出す
  function renderMaintenance(mnt) {
    navEl.hidden = true;
    chansEl.hidden = true;
    var note = mnt.note || "";
    var until = mnt.until || "";
    view.innerHTML = '<div class="mnt">' +
      '<p class="mnttitle">' + esc(t("mntTitle")) + '</p>' +
      (note ? '<p class="mntnote">' + esc(note) + '</p>' : "") +
      (until ? '<p class="mntuntil">' + esc(t("mntUntil")) + " " + esc(until) + '</p>' : "") +
      '</div>';
  }

  function bootApp() {
    fetch("./posts.json", { cache: "no-cache" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) {
        channels = j.channels || [];
        posts = j.posts || [];
        fetch("./recurring.json", { cache: "no-cache" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (rc) {
            var loc = null;
            try { loc = JSON.parse(localStorage.getItem("remitech-recurring") || "null"); } catch (e) {}
            recurring = loc || rc || { rules: [] };
            if (tab === "prep2") renderPrep2();
          }).catch(function () {});
        pcLoad(false);
        fetch("./book_rows.json", { cache: "no-cache" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (b) { bookRows = b || { groups: [] }; if (tab === "book") renderBook(); })
          .catch(function () { bookRows = { groups: [] }; });
        fetch("./chores.json", { cache: "no-cache" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (c) {
            chores = choreOverlay(c); if (tab === "kpi") renderKpi(); if (tab === "today") renderToday(); if (tab === "likes" || tab === "follow") renderLikes();
            // 今どのタブにいても、サーバーの印を一度取りに行く。描き直すのは、印を使うタブにいるときだけ
            fetch(CHORE_API, { cache: "no-store" })
              .then(function (r) { return r.ok ? r.json() : null; })
              .then(function (j) {
                if (!j || !j.done || !chores) return;
                chores.done = j.done; chores.at = j.at || {};
                chores = choreOverlay(chores);
                if (tab === "kpi") renderKpi(); if (tab === "today") renderToday(); if (tab === "likes" || tab === "follow") renderLikes();
              }).catch(function () {});
          })
          .catch(function () {});
        fetch("./kpi.json", { cache: "no-cache" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (k) {
            kpi = k;
            try {
              var loc = JSON.parse(localStorage.getItem("remitech-kpi-local") || "null");
              if (loc && loc.rows && !storeOn()) {
                var have = {};
                kpi.rows.forEach(function (r) { have[r.date + "|" + r.channel + "|" + r.platform] = 1; });
                loc.rows.forEach(function (r) { if (!have[r.date + "|" + r.channel + "|" + r.platform]) kpi.rows.push(r); });
              }
            } catch (e) {}
            if (tab === "kpi") renderKpi();
          })
          .catch(function () {});
        return fetch("./schedule.json", { cache: "no-cache" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; })
          .then(function (sc) {
            schedule = sc;
            try {
              var mine = JSON.parse(localStorage.getItem("remitech-schedule") || "null");
              if (mine && mine.slots && mine.slots.length) {
                if (!schedule || !schedule.slots || !schedule.slots.length) {
                  schedule = mine;   // 置き場が読めないときだけ、端末のものを使う
                } else {
                  // 置き場のほうを正とする。端末にしかない枠（まだ同期できていない分）だけ足す
                  var haveKey = {};
                  schedule.slots.forEach(function (x) { haveKey[slotKey(x)] = 1; });
                  mine.slots.forEach(function (x) {
                    if (!haveKey[slotKey(x)]) { schedule.slots.push(x); haveKey[slotKey(x)] = 1; }
                  });
                  if (mine.holidays) {
                    schedule.holidays = schedule.holidays || {};
                    for (var hk0 in mine.holidays) schedule.holidays[hk0] = mine.holidays[hk0];
                  }
                  if (mine.assignees) {
                    schedule.assignees = schedule.assignees || {};
                    for (var ak0 in mine.assignees) schedule.assignees[ak0] = mine.assignees[ak0];
                  }
                  try { localStorage.setItem("remitech-schedule", JSON.stringify(schedule)); } catch (e2) {}
                }
              }
            } catch (e) {}
            renderChans(); route();
            bookPull(true);
            hubConnect();
            if (restoreScrollY) setTimeout(function () { window.scrollTo(0, restoreScrollY); }, 60);
          });
      })
      .catch(function () { view.innerHTML = '<p class="empty">' + esc(t("fail")) + '</p>'; });
  }

  fetch("./maintenance.json", { cache: "no-cache" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .catch(function () { return null; })
    .then(function (mnt) {
      if (mnt && mnt.on) { renderMaintenance(mnt); return; }
      bootApp();
    });
})();
</script>
</body>
</html>
