  });
  // 画像の置き入れ（ブロックごと）
  view.addEventListener("dragover", function (e) {
    var col = e.target.closest && e.target.closest(".mcol");
    if (!col) return;
    e.preventDefault();
    col.setAttribute("data-drop", "true");
  });
  ["dragleave", "drop"].forEach(function (ev) {
    view.addEventListener(ev, function (e) {
      var col = e.target.closest && e.target.closest(".mcol");
      if (col) col.removeAttribute("data-drop");
    });
  });
  view.addEventListener("drop", function (e) {
    var col = e.target.closest && e.target.closest(".mcol");
    if (col) {
      e.preventDefault();
      var holder = col.querySelector(".mediabox[data-mk], .mfile[data-mk]");
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (holder && f) takeFile(holder.getAttribute("data-mk"), f);
      return;
    }
    if (tab !== "import") return;
    e.preventDefault();
    var ta = document.getElementById("impText");
    if (ta) ta.removeAttribute("data-drop");
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function () { if (ta) ta.value = fr.result; importRead(fr.result); };
    fr.readAsText(f);
  });

  view.addEventListener("keydown", function (e) {
    if (e.target.id === "impUrl" && e.key === "Enter") {
      e.preventDefault();
      if (e.target.value.trim()) importUrl(e.target.value.trim());
    }
  });
  view.addEventListener("paste", function (e) {
    if (e.target.id !== "impUrl") return;
    setTimeout(function () {
      var v = document.getElementById("impUrl");
      if (v && v.value.trim()) importUrl(v.value.trim());
    }, 0);
  });

  // 上へ戻る。scroll だけに頼ると取りこぼすので、短い間隔でも見る
  (function () {
    var btn = document.getElementById("toTop");
    var on = null;
    function top() {
      return window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0;
    }
    function sync() {
      var v = top() > 320;
      if (v === on) return;
      on = v;
      if (v) { btn.hidden = false; btn.setAttribute("data-in", "true"); }
      else { btn.setAttribute("data-in", "false"); setTimeout(function () {
        if (btn.getAttribute("data-in") !== "true") btn.hidden = true;
      }, 220); }
    }
    window.addEventListener("scroll", sync, { passive: true });
    document.addEventListener("scroll", sync, { passive: true });
    setInterval(sync, 250);
    btn.addEventListener("click", function () {
      var smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
      window.scrollTo({ top: 0, behavior: smooth ? "smooth" : "auto" });
      document.documentElement.scrollTop = 0;
    });
    sync();
  })();

  window.addEventListener("hashchange", route);

  // 置かれているファイル（画面のコードも含む）が差し替わったかを、たまに見に行く。
  // 2026-09-15 Hibiki指定: 気づいたら更新があると出し続ける（× で消しても、次の確認でまた出す）。
  // 更新するときは、今の入力・画面の場所をそのまま持って読み直す
  var bootStamp = {}, pendingUpdate = false;
  function stamp(res) {
    return (res.headers.get("etag") || "") + "|" + (res.headers.get("last-modified") || "");
  }
  function watchUpdates() {
    ["./index.html", "./posts.json", "./schedule.json", "./kpi.json", "./book_rows.json", "./chores.json"].forEach(function (u) {
      fetch(u, { method: "HEAD", cache: "no-store" }).then(function (r) {
        if (!r.ok) return;
        var st = stamp(r);
        if (!st) return;
        if (bootStamp[u] === undefined) { bootStamp[u] = st; return; }   // 読み込んだときの版を基準にする（以後は変えない）
        if (bootStamp[u] !== st) pendingUpdate = true;
      }).catch(function () {}).then(showUpdateToastIfPending);
    });
  }
  function showUpdateToastIfPending() {
    if (!pendingUpdate) return;
    var el = document.getElementById("toast");
    document.getElementById("toastText").textContent = t("updated");
    document.getElementById("toastGo").textContent = t("reload");
    el.hidden = false;
  }
  // 今の入力・画面の場所を残してから読み直す。保存中のもの（saveSoon で待たせてあるもの）は先に確定させる
  function updateNow() {
    var go = document.getElementById("toastGo");
    go.disabled = true; go.textContent = t("updating");
    Promise.resolve().then(flushSave).catch(function () {}).then(function () {
      try {
        sessionStorage.setItem("remitech-reload-state", JSON.stringify({
          tab: tab, filter: filter, bkMon: bkMon, tgDate: tgDate,
          lkWeek: lkWeek, lkMode: lkMode, lang: lang, scrollY: window.scrollY, hash: location.hash
        }));
      } catch (e) {}
      location.reload();
    });
  }
  document.getElementById("toastGo").addEventListener("click", updateNow);
  document.getElementById("toastX").addEventListener("click", function () {
    document.getElementById("toast").hidden = true;   // 消しても更新自体はまだ。次の確認でまた出す
  });
  watchUpdates();
  setInterval(watchUpdates, 60000);        // 1分ごと

  // いいね作業の印は、何人かが同時に押す。他の人の印も、開いたまま見えるようにする。
  // 鍵のある端末: GitHubから直接10秒ごと（公開ページの反映待ち1〜2分を飛ばせる）。
  //   変わっていなければ 304 が返り、GitHubの回数制限にも数えられない
  // 鍵のない端末: 公開ページを60秒ごと
  var choreEtag = null, choreBusy = false;
  function applyChores(c) {
    if (!c || !chores) return;
    c = choreOverlay(c);
    if (JSON.stringify(c.done || {}) === JSON.stringify(chores.done || {}) &&
        JSON.stringify(c.lists || []) === JSON.stringify(chores.lists || [])) return;
    chores = c;
    if (tab === "today" && (typing() || tdUndo)) return;
    var y2 = window.scrollY; if (tab === "today") renderToday(); else if (tab === "likes" || tab === "follow") renderLikes(); else renderKpi(); window.scrollTo(0, y2);
  }
  function pullChores() {
    if ((tab !== "kpi" && tab !== "today" && tab !== "likes" && tab !== "follow") || document.hidden || choreBusy || kmEdit || /^#\/prep\//.test(location.hash)) return Promise.resolve();
    return fetch(CHORE_API, { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || !j.done || !chores) return;
        applyChores({ lists: chores.lists, note: chores.note, done: j.done });
      }).catch(function () {});
  }
  (function loop() {
    pullChores().then(function () { setTimeout(loop, hubWsUp ? 30000 : 10000); });
  })();
  // 画面に戻ってきたら、すぐ読む
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { pullChores(); pullSchedule(); } });

  // 企画も同じように読み直す。入力中・保存待ち・保存中は触らない（書いている途中を上書きしない）
  var schedEtag = null;
  function typing() {
    var a = document.activeElement;
    return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && view.contains(a);
  }
  function applySchedule(remote) {
    if (!remote || !remote.slots || !schedule) return;
    if (savePending || saveBusy || typing() || editing) return;
    if (bkLast) bookApply(bkLast, remote);
    var before = JSON.stringify({ s: schedule.slots, m: schedule.media || {}, t: schedule.trash || [], h: schedule.holidays || {}, a: schedule.assignees || {} });
    var after = JSON.stringify({ s: remote.slots, m: remote.media || {}, t: remote.trash || [], h: remote.holidays || {}, a: remote.assignees || {} });
    if (before === after) return;
    schedule = remote;
    try { localStorage.setItem("remitech-schedule", JSON.stringify(remote)); } catch (e) {}
    var y3 = window.scrollY;
    route();
    window.scrollTo(0, y3);
  }
  function pullSchedule() {
    if (document.hidden) return Promise.resolve();
    if (storeOn()) {
      var c = storeGet();
      var h = { "Authorization": "Bearer " + c.token, "Accept": "application/vnd.github+json" };
      if (schedEtag) h["If-None-Match"] = schedEtag;
      return fetch("https://api.github.com/repos/" + c.url + "/contents/schedule.json", { headers: h, cache: "no-store" })
        .then(function (r) {
          if (r.status === 304 || !r.ok) return null;
          schedEtag = r.headers.get("ETag");
          return r.json();
        })
        .then(function (j) {
          if (!j) return;
          // 1MBを超えると content が空で返る。そのときは raw を読む
          if (!j.content && j.download_url) {
            return fetch(j.download_url, { headers: { "Authorization": "Bearer " + c.token }, cache: "no-store" })
              .then(function (r2) { return r2.ok ? r2.json() : null; }).then(applySchedule);
          }
          var bin = atob((j.content || "").replace(/\n/g, ""));
          var b0 = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) b0[i] = bin.charCodeAt(i);
          applySchedule(JSON.parse(new TextDecoder("utf-8").decode(b0)));
        }).catch(function () {});
    }
    return fetch("./schedule.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(applySchedule).catch(function () {});
  }
  (function loop2() {
    setTimeout(function () {
      pullSchedule().then(loop2, loop2);
    }, storeOn() ? 10000 : 60000);
  })();

  // 週表のときだけ枠を広げる
  function syncWide() {
    document.body.setAttribute("data-wide", (tab === "dash" || tab === "kpi" || tab === "prep2" || tab === "likes" || tab === "follow" || tab === "book") ? "true" : "false");
  }

  // 更新のために読み直したときは、直前にいた画面・入力の場所に戻す（updateNow が残したもの。一度使ったら消す）
  var restoreScrollY = 0;
  (function restoreReloadState() {
    try {
      var raw = sessionStorage.getItem("remitech-reload-state");
      if (!raw) return;
      sessionStorage.removeItem("remitech-reload-state");
      var st = JSON.parse(raw);
      if (st.lang && T[st.lang]) lang = st.lang;
      if (st.tab) tab = st.tab;
      if (typeof st.filter === "string") filter = st.filter;
      if (st.bkMon) bkMon = st.bkMon;
      if (st.tgDate) tgDate = st.tgDate;
      if (typeof st.lkWeek === "number") lkWeek = st.lkWeek;
      if (st.lkMode) lkMode = st.lkMode;
      if (st.hash && !location.hash) { try { history.replaceState(null, "", st.hash); } catch (e1) {} }
      restoreScrollY = st.scrollY || 0;
    } catch (e) {}
  })();

  renderLang();
  renderNav();
  syncWide();
  document.getElementById("loading").textContent = t("loading");

  // 開発・更新・メンテナンス中は、通常の画面の前にこれだけを出す
  function renderMaintenance(mnt) {
    navEl.hidden = true;
    chansEl.hidden = true;
    var note = mnt.note || "";
    var until = mnt.until || "";
    view.innerHTML = '<div class="mnt">' +
      '<p class="mnttitle">' + esc(t("mntTitle")) + '</p>' +
      (note ? '<p class="mntnote">' + esc(note) + '</p>' : "") +
      (until ? '<p class="mntuntil">' + esc(t("mntUntil")) + " " + esc(until) + '</p>' : "") +
      '</div>';
  }

  function bootApp() {
    fetch("./posts.json", { cache: "no-cache" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) {
        channels = j.channels || [];
        posts = j.posts || [];
        fetch("./recurring.json", { cache: "no-cache" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (rc) {
            var loc = null;
            try { loc = JSON.parse(localStorage.getItem("remitech-recurring") || "null"); } catch (e) {}
            recurring = loc || rc || { rules: [] };
            if (tab === "prep2") renderPrep2();
          }).catch(function () {});
        fetch("./book_rows.json", { cache: "no-cache" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (b) { bookRows = b || { groups: [] }; if (tab === "book") renderBook(); })
          .catch(function () { bookRows = { groups: [] }; });
        fetch("./chores.json", { cache: "no-cache" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (c) {
            chores = choreOverlay(c); if (tab === "kpi") renderKpi(); if (tab === "today") renderToday(); if (tab === "likes" || tab === "follow") renderLikes();
            // 今どのタブにいても、サーバーの印を一度取りに行く。描き直すのは、印を使うタブにいるときだけ
            fetch(CHORE_API, { cache: "no-store" })
              .then(function (r) { return r.ok ? r.json() : null; })
              .then(function (j) {
                if (!j || !j.done || !chores) return;
                chores.done = j.done;
                chores = choreOverlay(chores);
                if (tab === "kpi") renderKpi(); if (tab === "today") renderToday(); if (tab === "likes" || tab === "follow") renderLikes();
              }).catch(function () {});
          })
          .catch(function () {});
        fetch("./kpi.json", { cache: "no-cache" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (k) {
            kpi = k;
            try {
              var loc = JSON.parse(localStorage.getItem("remitech-kpi-local") || "null");
              if (loc && loc.rows && !storeOn()) {
                var have = {};
                kpi.rows.forEach(function (r) { have[r.date + "|" + r.channel + "|" + r.platform] = 1; });
                loc.rows.forEach(function (r) { if (!have[r.date + "|" + r.channel + "|" + r.platform]) kpi.rows.push(r); });
              }
            } catch (e) {}
            if (tab === "kpi") renderKpi();
          })
          .catch(function () {});
        return fetch("./schedule.json", { cache: "no-cache" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; })
          .then(function (sc) {
            schedule = sc;
            try {
              var mine = JSON.parse(localStorage.getItem("remitech-schedule") || "null");
              if (mine && mine.slots && mine.slots.length) {
                if (!schedule || !schedule.slots || !schedule.slots.length) {
                  schedule = mine;   // 置き場が読めないときだけ、端末のものを使う
                } else {
                  // 置き場のほうを正とする。端末にしかない枠（まだ同期できていない分）だけ足す
                  var haveKey = {};
                  schedule.slots.forEach(function (x) { haveKey[slotKey(x)] = 1; });
                  mine.slots.forEach(function (x) {
                    if (!haveKey[slotKey(x)]) { schedule.slots.push(x); haveKey[slotKey(x)] = 1; }
                  });
                  if (mine.holidays) {
                    schedule.holidays = schedule.holidays || {};
                    for (var hk0 in mine.holidays) schedule.holidays[hk0] = mine.holidays[hk0];
                  }
                  if (mine.assignees) {
                    schedule.assignees = schedule.assignees || {};
                    for (var ak0 in mine.assignees) schedule.assignees[ak0] = mine.assignees[ak0];
                  }
                  try { localStorage.setItem("remitech-schedule", JSON.stringify(schedule)); } catch (e2) {}
                }
              }
            } catch (e) {}
            renderChans(); route();
            bookPull(true);
            hubConnect();
            if (restoreScrollY) setTimeout(function () { window.scrollTo(0, restoreScrollY); }, 60);
          });
      })
      .catch(function () { view.innerHTML = '<p class="empty">' + esc(t("fail")) + '</p>'; });
  }

  fetch("./maintenance.json", { cache: "no-cache" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .catch(function () { return null; })
    .then(function (mnt) {
      if (mnt && mnt.on) { renderMaintenance(mnt); return; }
      bootApp();
    });
})();
</script>
</body>
</html>
