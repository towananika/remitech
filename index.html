<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REMITECH HUB</title>
<meta name="description" content="Source of truth for everything we post.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500&family=Shippori+Mincho:wght@500&display=swap">
<style>
  :root{
    --bg:#f5f1e9; --surface:#fbf9f4; --line:#e2dac8;
    --ink:#231f1a; --muted:#645c4e; --wood:#93704b; --wood-soft:#ece1d0; --sage:#7d8c6a;
    --mincho:"Shippori Mincho","Hiragino Mincho ProN",serif;
    --gothic:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#1c1a16; --surface:#242119; --line:#38332a;
    --ink:#f2eee5; --muted:#b6ad99; --wood:#c99f74; --wood-soft:#382d20; --sage:#9aab84;
  }}
  :root[data-theme="dark"]{
    --bg:#1c1a16; --surface:#242119; --line:#38332a;
    --ink:#f2eee5; --muted:#b6ad99; --wood:#c99f74; --wood-soft:#382d20; --sage:#9aab84;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--gothic); font-weight:400; line-height:1.8;
    -webkit-font-smoothing:antialiased;
  }
  .page{ width:100%; max-width:660px; margin:0 auto; padding:40px 20px 72px; }
  /* 週表は横に長いので、広い画面では枠を広げる。読みものは狭いままにする */
  body[data-wide="true"] .page{ max-width:1180px; }
  body[data-wide="true"] .sum,
  body[data-wide="true"] .rem{ max-width:none; }
  .list, .post, .imp{ max-width:660px; }

  /* ---- header ---- */
  .top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  h1{ margin:0; font-family:var(--mincho); font-weight:500;
      font-size:20px; letter-spacing:.4em; text-indent:.4em; }
  .tagline{ margin:6px 0 0; font-size:13px; color:var(--muted); letter-spacing:.04em; }
  .lang{ display:flex; gap:4px; flex:0 0 auto; }
  .lang{ align-items:center; }
  .pill{
    background:var(--surface); border:1px solid var(--line); border-radius:999px;
    color:var(--ink); font:inherit; font-size:12px; letter-spacing:.06em;
    padding:5px 12px; cursor:pointer; min-width:52px;
  }
  .pill:hover{ border-color:var(--wood); }
  .theme{
    background:var(--surface); border:1px solid var(--line); border-radius:999px;
    color:var(--ink); font:inherit; font-size:13px; line-height:1;
    width:32px; height:28px; cursor:pointer; padding:0;
  }
  .theme:hover{ border-color:var(--wood); }

  /* 状態は色と形の両方で示す。英語が読めなくても区別がつくように */
  .dot{ width:6px; height:6px; border-radius:50%; flex:0 0 auto; }
  .dot[data-status="draft"]{ background:var(--wood); }
  .dot[data-status="live"]{ background:var(--sage, #7d8c6a); }

  /* 更新のお知らせ。作業中に邪魔しないよう、上に細く出すだけ */
  .toast{
    position:fixed; top:10px; right:12px;
    display:flex; align-items:center; gap:12px; z-index:50;
    background:var(--surface); border:1px solid var(--wood); border-radius:999px;
    padding:6px 6px 6px 14px; font-size:12px; color:var(--ink); opacity:.96;
    box-shadow:0 2px 12px rgba(0,0,0,.10); max-width:calc(100vw - 24px);
  }
  .toast[hidden]{ display:none; }
  .toast button{
    background:var(--wood); border:0; border-radius:999px; color:var(--surface);
    font:inherit; font-size:12px; padding:5px 12px; cursor:pointer;
  }
  .toast .x{ background:none; color:var(--muted); padding:5px 8px; }

  /* ---- nav ---- */
  .nav{ display:flex; gap:4px; margin:24px 0 4px; }
  .nav button{
    background:none; border:0; border-bottom:2px solid transparent;
    color:var(--muted); font:inherit; font-size:14px; padding:6px 2px; margin-right:16px;
    cursor:pointer;
  }
  .nav button[aria-pressed="true"]{ color:var(--ink); border-bottom-color:var(--wood); }

  /* ---- KPI ---- */
  .kpi{ max-width:620px; }
  .kcard{
    border:1px solid var(--line); border-left:3px solid var(--chc, var(--wood));
    border-radius:14px; background:var(--surface); padding:14px 16px; margin-bottom:10px;
  }
  .khead{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .khead .who{ font-weight:500; font-size:14px; color:var(--chc, var(--ink)); }
  .knums{ display:flex; gap:20px; flex-wrap:wrap; }
  .knum{ min-width:92px; }
  .knum .lbl{ display:block; font-size:11.5px; color:var(--muted); letter-spacing:.04em; }
  .knum .val{ font-size:20px; font-weight:500; font-variant-numeric:tabular-nums; }
  .knum .dif{ font-size:11.5px; margin-left:6px; font-variant-numeric:tabular-nums; }
  .knum .dif[data-up="true"]{ color:var(--sage); }
  .knum .dif[data-up="false"]{ color:#b4553f; }
  .kwhen{ font-size:11.5px; color:var(--muted); margin:10px 0 0; }

  /* ---- booking board ---- */
  .book{ max-width:560px; }
  .bday{
    border:1px solid var(--line); border-radius:14px; background:var(--surface);
    padding:14px 16px; margin-bottom:10px;
  }
  .bday.today{ border-color:var(--wood); }
  .bday.past{ opacity:.62; }
  .bhead{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .bhead .d{ font-size:15px; font-weight:500; font-variant-numeric:tabular-nums; }
  .bhead .w{ font-size:12px; color:var(--muted); }
  .bhead .v{ font-size:12px; }
  .bhead .v[data-ok="true"]{ color:var(--sage); }
  .bhead .v[data-ok="false"]{ color:var(--wood); }
  .bhead .v[data-ok="late"]{ color:#b4553f; }
  .brow{ display:flex; align-items:center; gap:8px; margin-top:9px; }
  .brow .nm{ font-size:12.5px; color:var(--chc, var(--ink)); flex:0 0 84px;
             overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pips{ display:flex; gap:4px; flex-wrap:wrap; }
  .pip{
    display:inline-flex; align-items:center; gap:3px;
    font-size:10.5px; border:1px solid var(--line); border-radius:999px;
    padding:2px 7px; color:var(--muted); white-space:nowrap;
  }
  .pip b{ font-weight:500; font-variant-numeric:tabular-nums; }
  .pip[data-s="sched"]{ color:var(--ink); border-color:var(--ink); }
  .pip[data-s="done"]{ color:var(--surface); background:var(--sage); border-color:var(--sage); }
  .pip[data-s="late"]{ color:var(--surface); background:#b4553f; border-color:#b4553f; }
  .pip[data-s="ready"]{ color:var(--surface); background:var(--wood); border-color:var(--wood); }
  .pip[data-s="text"]{ color:var(--wood); border-color:var(--wood); }

  /* ---- prep board ---- */
  .prep{ max-width:760px; }
  .pcard{
    border:1px solid var(--line); border-left:3px solid var(--chc, var(--wood));
    border-radius:14px; background:var(--surface); padding:16px 18px; margin-bottom:12px;
  }
  .phead{ display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .phead .who{ font-weight:500; font-size:14px; color:var(--chc, var(--ink)); }
  .phead .when{ font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .ptext{
    white-space:pre-wrap; font-size:13.5px; line-height:1.85;
    background:var(--bg); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; margin:0;
  }
  .ptext.empty2{ color:var(--muted); font-style:normal; }
  .plabel{ font-size:11.5px; color:var(--muted); margin:12px 0 5px; letter-spacing:.06em; }
  .pbar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .copybtn{
    background:var(--surface); border:1px solid var(--line); border-radius:999px;
    color:var(--ink); font:inherit; font-size:12px; padding:5px 14px; cursor:pointer;
  }
  .copybtn:hover{ border-color:var(--wood); }
  .copybtn[data-done="true"]{ color:var(--surface); background:var(--sage); border-color:var(--sage); }
  .passet{ font-size:12.5px; color:var(--muted); margin:10px 0 0; }
  .done-bar{ border-top:1px solid var(--line); padding-top:12px; margin-top:14px; }
  .donebtn{
    background:none; border:1px solid var(--line); border-radius:999px;
    color:var(--muted); font:inherit; font-size:12px; padding:6px 14px; cursor:pointer;
  }
  .donebtn:hover{ border-color:var(--wood); color:var(--ink); }
  .donebtn[data-mark="posted"][data-on="true"]{
    color:var(--surface); background:var(--sage); border-color:var(--sage); }
  .donebtn[data-mark="checked"][data-on="true"]{
    color:var(--surface); background:var(--wood); border-color:var(--wood); }

  /* ---- week grid ---- */
  .gridwrap{ overflow-x:auto; border:1px solid var(--line); border-radius:14px;
             background:var(--surface); }
  .grid{ border-collapse:collapse; width:100%; min-width:620px; table-layout:fixed; }
  .grid th, .grid td{ border-bottom:1px solid var(--line); padding:8px 10px; text-align:center; }
  .grid th.rowhead{ width:150px; border-left:3px solid var(--chc, var(--wood)); }
  .grid tbody tr th.rowhead b{ color:var(--chc, var(--ink)); }
  .grid tbody tr.chstart th.rowhead{ border-top:2px solid var(--line); }
  /* 広い画面では7日ぶんを必ず収める。横スクロールは出さない */
  @media (min-width:820px){
    .grid{ min-width:0; }
    .grid th, .grid td{ padding:10px 6px; }
    .grid thead th .dnum{ font-size:16px; }
    .cell{ min-width:0; width:100%; }
    .cell .lb2{ max-width:100%; font-size:11.5px; }
    .matbtn{ font-size:11px; padding:3px 8px; }
    .mk{ font-size:11.5px; padding:3px 6px; }
    .gridwrap{ overflow-x:hidden; }
    .grid th.rowhead{ width:140px; }
  }
  .grid tr:last-child td{ border-bottom:0; }
  .grid thead th{ font-weight:500; font-size:12.5px; color:var(--muted); letter-spacing:.02em; }
  .grid thead th .dnum{ display:block; color:var(--ink); font-size:15px; font-variant-numeric:tabular-nums; }
  .grid thead th.today .dnum{ color:var(--wood); }
  .grid thead th.today{ background:var(--wood-soft); }
  .grid th.rowhead{
    position:sticky; left:0; z-index:2; background:var(--surface);
    text-align:left; white-space:nowrap; border-right:1px solid var(--line);
  }
  .grid th.rowhead b{ display:block; font-size:13px; font-weight:500; color:var(--ink); }
  .grid th.rowhead span{ font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .cell{ display:inline-flex; flex-direction:column; align-items:center; gap:4px; min-width:56px; }
  .cell .lb2{ font-size:11px; color:var(--muted); max-width:96px;
              overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mk{ width:100%; font-size:11px; font-weight:500; border-radius:999px;
       border:1px solid var(--line); padding:2px 6px; color:var(--muted); }
  .mk[data-s="text"]{ color:var(--wood); border-color:var(--wood); }
  .mk[data-s="ready"]{ color:var(--surface); background:var(--wood); border-color:var(--wood); }
  .mk[data-s="sched"]{ color:var(--ink); border-color:var(--ink); }
  .mk[data-s="done"]{ color:var(--surface); background:var(--sage); border-color:var(--sage); }
  .mk[data-s="late"]{ color:var(--surface); background:#b4553f; border-color:#b4553f; }
  .cellmats{ display:flex; gap:4px; justify-content:center; flex-wrap:wrap; }
  .matbtn{
    background:none; border:1px solid var(--line); border-radius:999px;
    color:var(--muted); font:inherit; font-size:10.5px; padding:2px 8px; cursor:pointer;
    white-space:nowrap;
  }
  .matbtn:hover{ border-color:var(--wood); color:var(--ink); }
  .matbtn[data-on="true"]{ color:var(--surface); background:var(--sage); border-color:var(--sage); }
  .pf{
    display:inline-block; font-style:normal; font-size:9.5px; letter-spacing:.08em;
    border:1px solid var(--line); border-radius:4px; padding:0 4px; margin-right:6px;
    color:var(--muted); vertical-align:1px;
  }
  .pf[data-p="IG"]{ color:var(--wood); border-color:var(--wood); }
  .pf[data-p="FB"]{ color:#5b7bb4; border-color:#5b7bb4; }
  .pf[data-p="TT"]{ color:#9a7fb8; border-color:#9a7fb8; }
  .pf[data-p="YT"]{ color:#b4553f; border-color:#b4553f; }
  /* チャンネルが変わる行に区切りを入れる */
  .grid tbody tr.chstart td, .grid tbody tr.chstart th{ border-top:2px solid var(--line); }

  /* ---- dashboard ---- */
  .sum{ background:var(--surface); border:1px solid var(--line); border-radius:14px;
        padding:16px 18px; margin:18px 0 14px; }
  .sum .big{ font-size:16px; font-weight:500; margin:0 0 4px; }
  .sum .rng{ font-size:12.5px; color:var(--muted); letter-spacing:.02em; line-height:2; }
  .day{ border:1px solid var(--line); border-radius:14px; background:var(--surface);
        padding:12px 14px; margin-bottom:8px; }
  .day.today{ border-color:var(--wood); }
  .dhead{ display:flex; justify-content:space-between; align-items:baseline;
          font-size:12.5px; color:var(--muted); letter-spacing:.04em; margin-bottom:6px; }
  .dhead .n{ color:var(--ink); font-size:15px; font-weight:500; }
  .row{ display:flex; align-items:center; gap:10px; padding:8px 0; font-size:13.5px; }
  .row + .row{ border-top:1px solid var(--line); }
  .row .t{ color:var(--ink); font-size:12.5px; font-variant-numeric:tabular-nums; flex:0 0 48px; }
  .row .lb{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .st{ flex:0 0 auto; font-size:11.5px; font-weight:500; border-radius:999px; padding:2px 9px; border:1px solid var(--line); }
  .st[data-s="none"]{ color:var(--muted); }
  .st[data-s="text"]{ color:var(--wood); border-color:var(--wood); }
  .st[data-s="sched"]{ color:var(--ink); border-color:var(--ink); }
  .st[data-s="done"]{ color:var(--surface); background:var(--sage); border-color:var(--sage); }
  .st[data-s="late"]{ color:var(--surface); background:#b4553f; border-color:#b4553f; }

  .mats{ display:flex; gap:10px; align-items:center; flex:0 0 auto; }
  .mat{ display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--muted);
        cursor:pointer; user-select:none; }
  .mat input{ accent-color:var(--wood); width:14px; height:14px; margin:0; }
  .mat[data-on="true"]{ color:var(--ink); }
  .st[data-s="ready"]{ color:var(--surface); background:var(--wood); border-color:var(--wood); }
  .rem{ display:flex; align-items:center; gap:10px; flex-wrap:wrap;
        font-size:12px; color:var(--muted); margin:0 0 14px; }
  .rem select{ font:inherit; font-size:12px; background:var(--surface); color:var(--ink);
               border:1px solid var(--line); border-radius:999px; padding:4px 10px; }
  .chk{ font-size:11px; color:var(--muted); }
  .chk[data-m="true"]{ color:var(--sage); }
  .chk[data-m="false"]{ color:#b4553f; }

  .imp textarea{
    width:100%; min-height:220px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12.5px; line-height:1.7; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:12px; padding:14px; resize:vertical;
  }
  .imp textarea:focus{ outline:none; border-color:var(--wood); }
  .imp textarea[data-drop="true"]{ border-color:var(--wood); background:var(--wood-soft); }
  .filebtn{
    display:inline-block; background:none; border:1px dashed var(--line); border-radius:999px;
    color:var(--muted); font-size:12.5px; padding:8px 16px; cursor:pointer;
  }
  .filebtn:hover{ border-color:var(--wood); color:var(--ink); }
  .filebtn input{ display:none; }
  .imp .out{ font-weight:500; }
  .imp .hint{ font-size:12.5px; color:var(--muted); margin:0 0 10px; }
  .imp .cols{ font-size:12px; color:var(--muted); margin:8px 0 0;
              font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .imp .bar{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:center; }
  .imp input[type=url]{
    flex:1 1 240px; min-width:0; font:inherit; font-size:13px;
    background:var(--surface); color:var(--ink);
    border:1px solid var(--line); border-radius:999px; padding:8px 16px;
  }
  .imp input[type=url]:focus{ outline:none; border-color:var(--wood); }
  .imp .cols{ margin-top:20px; opacity:.75; }
  .imp textarea{ min-height:260px; }
  .imp button{
    background:var(--surface); border:1px solid var(--line); border-radius:999px;
    color:var(--ink); font:inherit; font-size:13px; padding:8px 16px; cursor:pointer;
  }
  .imp button:hover{ border-color:var(--wood); }
  .imp .out{ margin-top:12px; font-size:13px; }

  /* ---- channels ---- */
  .chans{ display:flex; flex-wrap:wrap; gap:6px; margin:26px 0 22px; }
  .chans[hidden]{ display:none; }
  .chan{
    background:var(--surface); border:1px solid var(--line); border-radius:999px;
    color:var(--muted); font:inherit; font-size:12px; padding:5px 13px; cursor:pointer;
    transition:border-color .16s ease, color .16s ease;
  }
  .chan[aria-pressed="true"]{ color:var(--surface); background:var(--chc, var(--wood));
                              border-color:var(--chc, var(--wood)); }
  .chan:hover{ border-color:var(--chc, var(--wood)); }

  /* ---- list ---- */
  .list{ list-style:none; margin:0; padding:0; }
  .list li + li{ margin-top:12px; }
  .card{
    display:block; width:100%; text-align:left; cursor:pointer;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:18px 20px; color:inherit; font:inherit;
    transition:border-color .18s ease, transform .18s ease;
  }
  .card:hover,.card:focus-visible{ border-color:var(--wood); transform:translateY(-1px); }
  .card:focus-visible{ outline:2px solid var(--wood); outline-offset:3px; }
  .meta{ display:flex; align-items:center; flex-wrap:wrap; gap:8px;
         font-size:12px; color:var(--muted); letter-spacing:.06em; }
  .flag{ border:1px solid var(--line); border-radius:999px; padding:1px 8px; }
  .flag[data-status="draft"]{ color:var(--wood); border-color:var(--wood); }
  .card b{ display:block; margin:6px 0 4px; font-weight:500; font-size:16px; line-height:1.6; }
  .card p{ margin:0; font-size:13.5px; color:var(--muted); }
  .tags{ margin-top:10px; font-size:11px; color:var(--muted); }

  /* ---- post ---- */
  .back{ background:none; border:0; color:var(--muted); font:inherit; font-size:13px;
         cursor:pointer; padding:6px 0; margin-bottom:10px; }
  .back:hover{ color:var(--ink); }
  .post h2{ margin:6px 0; font-size:20px; font-weight:500; line-height:1.6; }
  .post .lead{ margin:0 0 26px; font-size:14px; color:var(--muted); }
  .sheet{ background:var(--surface); border:1px solid var(--line); border-radius:14px;
          padding:20px 22px; margin-bottom:12px; }
  .sheet .no{ font-family:var(--mincho); font-size:12px; color:var(--wood); }
  .sheet h3{ margin:4px 0 8px; font-size:15px; font-weight:500; line-height:1.7; }
  .sheet p{ margin:0; font-size:14px; }
  .links{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .goto{
    display:inline-block; font-size:12px; color:var(--wood); text-decoration:none;
    border:1px solid var(--line); border-radius:999px; padding:5px 12px;
  }
  .goto:hover{ border-color:var(--wood); }
  .chanbox{
    background:var(--wood-soft); border-radius:14px; padding:16px 18px; margin-bottom:16px;
  }
  .chanbox b{ display:block; font-weight:500; font-size:15px; letter-spacing:.06em; }
  .chanbox p{ margin:4px 0 0; font-size:13px; color:var(--muted); }

  .empty{ text-align:center; color:var(--muted); font-size:13px; padding:44px 0; }
  footer{ margin-top:52px; text-align:center; font-size:11px;
          letter-spacing:.22em; color:var(--muted); opacity:.7; }
  /* スマホ: 指で押せる大きさに。折り返して全部見せる */
  @media (max-width:520px){
    .page{ padding:24px 16px 56px; }
    .top{ flex-direction:column; align-items:stretch; gap:14px; }
    .lang{ justify-content:flex-end; }
    .pill{ font-size:13px; padding:8px 14px; }
    .theme{ width:38px; height:32px; }
    .chans{ gap:7px; margin:18px 0; }
    .chan{ padding:8px 15px; font-size:13px; }
    .card{ padding:16px 17px; }
    .card b{ font-size:15.5px; }
    .sheet{ padding:17px 18px; }
    .post h2{ font-size:18.5px; }
    .back{ padding:10px 0; font-size:14px; }
  }

  @media (prefers-reduced-motion:reduce){ .card{ transition:none } }
</style>
</head>
<body>
  <div class="toast" id="toast" hidden>
    <span id="toastText"></span>
    <button id="toastGo"></button>
    <button class="x" id="toastX" aria-label="close">×</button>
  </div>

  <div class="page">
    <div class="top">
      <div>
        <h1>HUB</h1>
        <p class="tagline" id="tagline"></p>
      </div>
      <div class="lang" id="langPick"></div>

    <div class="nav" id="nav"></div>
    <div class="chans" id="chans"></div>
    <div id="view"><p class="empty" id="loading"></p></div>
    <footer>REMITECH HUB</footer>
  </div>

<script>
(function () {
  // 表示の言葉。既定は英語。投稿の本文は書かれたままの言語で出す
  var T = {
    en: { tagline:"Source of truth for everything we post.",
          all:"All", loading:"Loading…", none:"Nothing here yet.",
          fail:"Could not load the source.", back:"← All posts",
          draft:"Draft", live:"Posted", open:"Open channel",
          navDash:"This week", navBook:"Booking", navPrep:"Prep", navKpi:"KPI", navPosts:"Posts",
          followers:"Followers", following:"Following", measuredOn:"Measured", noKpi:"No numbers yet.",
          allBooked:"All booked", leftToDo:"left", nothingToday:"Nothing scheduled",
          markPosted:"Posted", markChecked:"Checked", undo:"Undo",
          copy:"Copy", copied:"Copied", noText:"No text yet", comment:"Comment",
          visual:"Visual", today:"Today", tomorrow:"Tomorrow", prepEmpty:"Nothing coming up.",
          stNone:"No text", stText:"Text ready", stSched:"Scheduled", stDone:"Posted",
          stLate:"Missed", stReady:"Ready", weekOf:"Week of", ok:"All set", todo:"Needs action",
          matText:"Text", matImage:"Image", remind:"Remind before posting", remindOff:"Off",
          notMatched:"Not checked", matched:"Matches the plan", mismatched:"Differs from the plan",
          navImport:"Import", impHelp:"Paste the plan from your spreadsheet (tab-separated, header row first).",
          impCols:"Columns: date (or day), time, platform, type, label, ja, en, ko, asset",
          impApply:"Apply on this device", impDownload:"Download schedule.json",
          impMonth:"Month", impMerge:"Keep what is already there",
          impPaste:"Paste the plan here", impFile:"Choose a file", impUrl:"Paste a link",
          impUrlNo:"This address cannot be read from the browser. Give it to Claude instead.",
          impRead:"Read", impResult:"slots read", impBad:"Could not read it. Check the header row.",
          updated:"New content", reload:"Reload", close:"Close",
          weekStart:"Week starts on", noSlots:"No regular slots yet." },
    ko: { tagline:"올리는 모든 글의 원본.",
          all:"전체", loading:"불러오는 중…", none:"아직 없습니다.",
          fail:"원본을 불러오지 못했습니다.", back:"← 목록으로",
          draft:"초안", live:"게시함", open:"채널 열기",
          navDash:"이번 주", navBook:"예약", navPrep:"준비", navKpi:"KPI", navPosts:"글",
          followers:"팔로워", following:"팔로잉", measuredOn:"측정일", noKpi:"아직 숫자가 없어.",
          allBooked:"모두 예약됨", leftToDo:"남음", nothingToday:"예정 없음",
          markPosted:"게시 완료", markChecked:"확인 완료", undo:"취소",
          copy:"복사", copied:"복사됨", noText:"원고 없음", comment:"댓글",
          visual:"비주얼", today:"오늘", tomorrow:"내일", prepEmpty:"예정된 게 없어.",
          stNone:"원고 없음", stText:"원고 있음", stSched:"예약됨", stDone:"게시됨",
          stLate:"놓침", stReady:"준비 완료", weekOf:"주간", ok:"모두 준비됨", todo:"조치 필요",
          matText:"텍스트", matImage:"이미지", remind:"게시 전 알림", remindOff:"끄기",
          notMatched:"미확인", matched:"기획과 일치", mismatched:"기획과 다름",
          navImport:"불러오기", impHelp:"기획표를 붙여넣어. 탭으로 구분된 표(첫 줄은 제목).",
          impCols:"열: date (또는 day), time, platform, type, label, ja, en, ko, asset",
          impApply:"이 기기에 적용", impDownload:"schedule.json 내려받기",
          impMonth:"월", impMerge:"기존 것 유지",
          impPaste:"기획 내용을 여기에 붙여넣기", impFile:"파일 선택", impUrl:"링크 붙여넣기",
          impUrlNo:"이 주소는 브라우저에서 읽을 수 없어. Claude에게 주면 돼.",
          impRead:"읽기", impResult:"개 읽음", impBad:"읽지 못했어. 첫 줄의 제목을 확인해줘.",
          updated:"새 내용", reload:"새로고침", close:"닫기",
          weekStart:"주 시작", noSlots:"정기 업로드 시간이 없어." },
    ja: { tagline:"投稿するものの原本。",
          all:"すべて", loading:"読み込んでいます…", none:"まだ何もありません。",
          fail:"原本を読み込めませんでした。", back:"← 一覧へ",
          draft:"下書き", live:"公開ずみ", open:"チャンネルを開く",
          navDash:"今週", navBook:"予約", navPrep:"準備", navKpi:"KPI", navPosts:"投稿",
          followers:"フォロワー", following:"フォロー", measuredOn:"計測日", noKpi:"まだ数字がない。",
          allBooked:"すべて予約ずみ", leftToDo:"残り", nothingToday:"予定なし",
          markPosted:"投稿完了", markChecked:"確認完了", undo:"戻す",
          copy:"写す", copied:"写した", noText:"原稿なし", comment:"コメント",
          visual:"ビジュアル", today:"今日", tomorrow:"明日", prepEmpty:"先の予定がない。",
          stNone:"原稿なし", stText:"原稿あり", stSched:"予約ずみ", stDone:"投稿ずみ",
          stLate:"抜け", stReady:"投稿準備完了", weekOf:"の週", ok:"すべて整っている", todo:"手が要る",
          matText:"テキスト", matImage:"画像", remind:"投稿前にリマインド", remindOff:"切",
          notMatched:"未確認", matched:"企画どおり", mismatched:"企画と違う",
          navImport:"取り込み", impHelp:"表計算からコピーして貼る（タブ区切り・1行目は見出し）。",
          impCols:"列: date（または day）, time, platform, type, label, ja, en, ko, asset",
          impApply:"この端末に反映", impDownload:"schedule.json を保存",
          impMonth:"月", impMerge:"いまの内容を残す",
          impPaste:"企画の内容をここに貼る", impFile:"ファイルを選ぶ", impUrl:"リンクを貼る",
          impUrlNo:"この住所はブラウザからは読めない。Claudeに渡してください。",
          impRead:"読む", impResult:"件 読めた", impBad:"読めなかった。1行目の見出しを確かめて。",
          updated:"新しい内容", reload:"読み直す", close:"閉じる",
          weekStart:"週の始まり", noSlots:"定期の枠がまだない。" }
  };
  var LANGS = [["en","EN"], ["ko","한국어"], ["ja","日本語"]];

  // 明るさ。既定は端末に合わせる。押すたびに 端末 → 明るい → 暗い と回る
  var THEMES = [["auto","◐"], ["light","☀"], ["dark","☾"]];
  var theme = "auto";
  try { var tv = localStorage.getItem("remitech-theme"); if (tv) theme = tv; } catch (e) {}
  function applyTheme() {
    if (theme === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", theme);
    var b = document.getElementById("themeBtn");
    if (b) {
      var cur = THEMES.filter(function (x) { return x[0] === theme; })[0];
      b.textContent = cur[1];
      b.setAttribute("aria-label", "theme: " + theme);
      b.title = "theme: " + theme;
    }
  }

  var lang = "en";
  try { var sv = localStorage.getItem("remitech-lang"); if (T[sv]) lang = sv; } catch (e) {}

  var view = document.getElementById("view");
  var navEl = document.getElementById("nav");
  var schedule = null, tab = "dash";
  var chansEl = document.getElementById("chans");
  var langEl = document.getElementById("langPick");
  var posts = [], channels = [], filter = "";

  function t(k) { return T[lang][k]; }
  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
  function chanOf(id) { return channels.filter(function (c) { return c.id === id; })[0]; }
  function chanNames(ids) {
    return (ids || []).map(function (id) { var c = chanOf(id); return c ? c.name : id; }).join(" · ");
  }

  function renderLang() {
    var cur = LANGS.filter(function (l) { return l[0] === lang; })[0] || LANGS[0];
    langEl.innerHTML =
      '<button class="pill" id="langBtn" title="language">' + cur[1] + '</button>' +
      '<button class="theme" id="themeBtn"></button>';
    applyTheme();
    document.documentElement.lang = lang;
    document.getElementById("tagline").textContent = t("tagline");
  }

  function renderChans() {
    if (!channels.length) { chansEl.innerHTML = ""; return; }
    var html = '<button class="chan" data-chan="" aria-pressed="' + (filter === "") + '">' + esc(t("all")) + '</button>';
    channels.forEach(function (c) {
      html += '<button class="chan" data-chan="' + esc(c.id) + '" aria-pressed="' + (filter === c.id) +
              '" style="--chc:' + esc(c.color || "var(--wood)") + '">' + esc(c.name) + '</button>';
    });
    chansEl.innerHTML = html;
  }

  function visible() {
    return filter ? posts.filter(function (p) { return (p.channels || []).indexOf(filter) >= 0; }) : posts;
  }

  function chanCard(c) {
    var links = (c.links || []).map(function (l) {
      return '<a class="goto" href="' + esc(l.url) + '" target="_blank" rel="noopener">' +
             esc(l.kind) + ' ' + esc(l.handle) + ' ↗</a>';
    }).join("");
    return '<div class="chanbox"><b>' + esc(c.name) + '</b>' +
           (c.tagline ? '<p>' + esc(c.tagline) + '</p>' : "") +
           '<div class="links">' + links + '</div></div>';
  }

  function renderList() {
    chansEl.hidden = false;
    var head = filter ? chanCard(chanOf(filter) || {}) : "";
    var rows = visible();
    if (!rows.length) { view.innerHTML = head + '<p class="empty">' + esc(t("none")) + '</p>'; return; }
    view.innerHTML = head + '<ul class="list">' + rows.map(function (p) {
      return '<li><button class="card" data-id="' + esc(p.id) + '">' +
        '<span class="meta"><span>' + esc(p.date) + '</span>' +
        '<span class="dot" data-status="' + (p.status === "draft" ? "draft" : "live") + '"></span>' +
        '<span class="flag" data-status="' + esc(p.status) + '">' +
          esc(p.status === "draft" ? t("draft") : t("live")) + '</span>' +
        '<span>' + esc(chanNames(p.channels)) + '</span></span>' +
        '<b>' + esc(p.title) + '</b><p>' + esc(p.lead) + '</p>' +
        ((p.tags && p.tags.length) ? '<p class="tags">' + esc(p.tags.join(" · ")) + '</p>' : '') +
      '</button></li>';
    }).join("") + '</ul>';
  }

  // ---- ダッシュボード ----
  // 今日を含む月曜〜日曜。予約できているかを1枚で見る
  function two(n) { return n < 10 ? "0" + n : "" + n; }
  function ymd(d) { return d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate()); }

  function weekStart() {
    try { var v = localStorage.getItem("remitech-weekstart"); if (v !== null) return +v; } catch (e) {}
    return 1;                                   // 既定は月曜
  }
  function weekRange(now) {
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var back = (d.getDay() - weekStart() + 7) % 7;
    var mon = new Date(d); mon.setDate(d.getDate() - back);
    var days = [];
    for (var i = 0; i < 7; i++) { var x = new Date(mon); x.setDate(mon.getDate() + i); days.push(x); }
    return days;
  }

  // 材料の印は端末に残す。書き換えが頻繁で、記録として残すものではないため。
  // 「投稿ずみ」「一致確認」は schedule.json 側に残す（みんなで見る記録）
  // 投稿したか、確認したか。schedule.json に書ければ一番よいが、
  // 置いてあるファイルは書き換えられないので、まず端末に残す
  function stKey(sl) { return "remitech-st-" + sl.date + "-" + (sl.platform || "X") + "-" + sl.time; }
  function stGet(sl) {
    try { return JSON.parse(localStorage.getItem(stKey(sl)) || "{}") || {}; } catch (e) { return {}; }
  }
  function stSet(sl, k, v) {
    var o = stGet(sl); o[k] = v;
    try { localStorage.setItem(stKey(sl), JSON.stringify(o)); } catch (e) {}
  }
  function isPosted(sl) { return !!(sl.posted || stGet(sl).posted); }
  function isChecked(sl) { return !!((sl.check && sl.check.done) || stGet(sl).checked); }

  function matKey(sl) { return "remitech-mat-" + sl.date + "-" + (sl.platform || "X") + "-" + sl.time; }
  function matGet(sl) {
    var m = {};
    try { m = JSON.parse(localStorage.getItem(matKey(sl)) || "{}") || {}; } catch (e) {}
    // 原稿が入っていれば、テキストは用意できたものとして扱う。
    // 取り込んだ直後に押し直す手間をなくすため。外したいときは押せば消える
    if (m.text === undefined && sl.text && (sl.text.ja || sl.text.en || sl.text.ko)) m.text = true;
    return m;
  }
  function matSet(sl, kind, on) {
    var m = matGet(sl); m[kind] = on;
    try { localStorage.setItem(matKey(sl), JSON.stringify(m)); } catch (e) {}
  }
  function matReady(sl) {
    var m = matGet(sl), need = sl.need || ["text"];
    for (var i = 0; i < need.length; i++) { if (!m[need[i]]) return false; }
    return true;
  }

  function remindPrefs() {
    try { return JSON.parse(localStorage.getItem("remitech-remind") || "null") || { on:false, min:30 }; }
    catch (e) { return { on:false, min:30 }; }
  }
  function saveRemind(p) { try { localStorage.setItem("remitech-remind", JSON.stringify(p)); } catch (e) {} }

  var remindTimers = [];
  function armReminders(days) {
    remindTimers.forEach(clearTimeout); remindTimers = [];
    var p = remindPrefs();
    if (!p.on || !("Notification" in window) || Notification.permission !== "granted") return;
    var now = Date.now();
    days.forEach(function (d) {
      (schedule.slots || []).forEach(function (sl) {
        if (sl.date !== ymd(d) || sl.time.indexOf(":") < 0 || isPosted(sl)) return;
        var hh = sl.time.split(":");
        var at = new Date(d.getFullYear(), d.getMonth(), d.getDate(), +hh[0], +hh[1]).getTime()
                 - p.min * 60000;
        var wait = at - now;
        if (wait <= 0 || wait > 86400000) return;      // 24時間より先は張らない
        remindTimers.push(setTimeout(function () {
          try { new Notification("REMITECH", { body: sl.time + "  " + (sl.label || "") }); } catch (e) {}
        }, wait));
      });
    });
  }

  function slotState(sl, when, now) {
    if (isPosted(sl)) return "done";
    var hasText = sl.text && (sl.text.ja || sl.text.en || sl.text.ko);
    // 予約してあれば、時刻を過ぎても抜けではない（自動で出ているはず）。
    // 実際に出たかは照らしてから posted にする
    if (sl.scheduled) return "sched";
    if (when < now) return "late";              // 予約もされないまま時刻が過ぎた
    if (hasText && matReady(sl)) return "ready";  // 材料が揃った
    return hasText ? "text" : "none";
  }

  var DOW = { en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
              ko:["일","월","화","수","목","금","토"],
              ja:["日","月","火","水","木","金","土"] };

  function renderDash() {
    chansEl.hidden = true;
    if (!schedule) { view.innerHTML = '<p class="empty">' + esc(t("none")) + '</p>'; return; }

    var now = new Date();
    var days = weekRange(now);
    var counts = { none:0, text:0, ready:0, sched:0, done:0, late:0 };

    // 行 = チャンネル × 定期の時刻
    var rows = [];
    channels.forEach(function (c) {
      (c.postTimes || []).forEach(function (pt) {
        rows.push({ ch:c, time: pt.time || pt, platform: pt.platform || "", label: pt.label || "" });
      });
    });
    if (!rows.length) { view.innerHTML = '<p class="empty">' + esc(t("noSlots")) + '</p>'; return; }

    var head = '<tr><th class="rowhead"></th>';
    days.forEach(function (d) {
      var isToday = d.toDateString() === now.toDateString();
      head += '<th class="' + (isToday ? "today" : "") + '">' +
        (DOW[lang] || DOW.en)[d.getDay()] +
        '<span class="dnum">' + (d.getMonth() + 1) + "/" + d.getDate() + '</span></th>';
    });
    head += "</tr>";

    var body = "";
    rows.forEach(function (row, ri) {
      var pf = row.platform ? '<i class="pf" data-p="' + esc(row.platform) + '">' + esc(row.platform) + '</i>' : "";
      var first = (ri === 0) || (rows[ri - 1].ch.id !== row.ch.id);
      var col = row.ch.color || "var(--wood)";
      body += '<tr class="' + (first ? "chstart" : "") + '" data-ch="' + esc(row.ch.id) +
              '" style="--chc:' + esc(col) + '"><th class="rowhead">' +
              '<b>' + pf + esc(row.ch.name) + '</b>' +
              '<span>' + esc(row.time) + (row.label ? " \u00b7 " + esc(row.label) : "") + '</span></th>';
      days.forEach(function (d) {
        var mine = row.ch.id === (schedule.channel || "hiyoko");
        var sl = mine ? (schedule.slots || []).filter(function (x) {
          return x.date === ymd(d) && x.time === row.time &&
                 (x.platform || "X") === (row.platform || "X");
        })[0] : null;
        if (!sl) { body += "<td></td>"; return; }

        var hh = row.time.split(":");
        var when = new Date(d.getFullYear(), d.getMonth(), d.getDate(), +hh[0], +hh[1]);
        var st = slotState(sl, when, now);
        counts[st]++;
        var label = sl.label || ((sl.text && (sl.text[lang] || sl.text.en || sl.text.ja)) || "").split(NLC)[0];
        var mm = matGet(sl);
        var mats = (sl.need || ["text"]).map(function (k) {
          var on = !!mm[k];
          return '<button class="matbtn" data-on="' + on + '"' +
                 ' data-date="' + esc(sl.date) + '" data-pf="' + esc(sl.platform || "X") +
                 '" data-time="' + esc(sl.time) + '" data-kind="' + k + '"' +
                 ' title="' + esc(t(k === "text" ? "matText" : "matImage")) + '">' +
                 (on ? "\u2713 " : "") + esc(t(k === "text" ? "matText" : "matImage")) + '</button>';
        }).join("");
        var ck = isChecked(sl) ? ' ✓' : "";
        body += '<td><span class="cell">' +
                '<span class="mk" data-s="' + st + '">' + ck +
                esc(t("st" + st.charAt(0).toUpperCase() + st.slice(1))) + '</span>' +
                '<span class="lb2">' + esc(label || "\u2014") + '</span>' +
                '<span class="cellmats">' + mats + '</span></span></td>';
      });
      body += "</tr>";
    });

    var need = counts.late + counts.none + counts.text;
    var rp = remindPrefs();
    var opts = [15, 30, 60, 120].map(function (v) {
      return '<option value="' + v + '"' + (rp.min === v ? " selected" : "") + '>' + v + "m</option>";
    }).join("");
    var ws = weekStart();
    var wsOpts = [1, 0, 6].map(function (v) {
      return '<option value="' + v + '"' + (ws === v ? " selected" : "") + '>' +
             (DOW[lang] || DOW.en)[v] + "</option>";
    }).join("");

    var sum = '<div class="sum"><p class="big">' +
      (need === 0 ? esc(t("ok")) : esc(t("todo")) + " \u00b7 " + need) + '</p>' +
      '<p class="rng">' + (days[0].getMonth()+1) + "/" + days[0].getDate() + " \u2013 " +
      (days[6].getMonth()+1) + "/" + days[6].getDate() +
      '\u3000' + esc(t("stLate")) + " " + counts.late +
      '\u3000' + esc(t("stNone")) + " " + counts.none +
      '\u3000' + esc(t("stText")) + " " + counts.text +
      '\u3000' + esc(t("stReady")) + " " + counts.ready +
      '\u3000' + esc(t("stSched")) + " " + counts.sched +
      '\u3000' + esc(t("stDone")) + " " + counts.done + '</p></div>';

    var bar = '<div class="rem">' +
      '<label class="mat" data-on="' + rp.on + '"><input type="checkbox" id="remOn"' +
      (rp.on ? " checked" : "") + '>' + esc(t("remind")) + '</label>' +
      '<select id="remMin">' + opts + '</select>' +
      '<span>' + esc(t("weekStart")) + '</span><select id="wsPick">' + wsOpts + '</select></div>';

    view.innerHTML = sum + bar +
      '<div class="gridwrap"><table class="grid"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
    armReminders(days);
  }

  // ---- 企画表の取り込み ----
  // サイトはファイルを書けないので、読み取って(1)この端末に反映し
  // (2)schedule.json として保存できるようにする
  var NLC = String.fromCharCode(10), TABC = String.fromCharCode(9);
  var CRC = String.fromCharCode(13), BSN = "\\" + "n";
  function thisMonth() {
    var d = new Date();
    return d.getFullYear() + "-" + two(d.getMonth() + 1);
  }

  var imported = null;

  function parseTSV(txt) {
    var lines = txt.split(CRC).join("").split(NLC).filter(function (l) { return l.trim(); });
    if (lines.length < 2) return null;
    var sep = (lines[0].indexOf(TABC) >= 0) ? TABC : ",";
    var head = lines[0].split(sep).map(function (h) { return h.trim().toLowerCase().replace(/^"|"$/g, ""); });
    if ((head.indexOf("day") < 0 && head.indexOf("date") < 0) || head.indexOf("time") < 0) return null;
    function col(r, name) { var i = head.indexOf(name); return i < 0 ? "" : (r[i] || "").trim(); }
    function un(v) { return v.split(BSN).join(NLC); }
    var out = [];
    for (var i = 1; i < lines.length; i++) {
      var r = lines[i].split(sep).map(function (v) { return v.replace(/^"|"$/g, ""); });
      var dt = col(r, "date");
      var tm = col(r, "time");
      if (!dt) {
        var dnum = parseInt(col(r, "day"), 10);
        if (dnum) dt = thisMonth() + "-" + (dnum < 10 ? "0" + dnum : dnum);
      }
      if (!dt || !tm) continue;
      var type = col(r, "type") || "text";
      var asset = col(r, "asset");
      out.push({
        date: dt, time: tm, platform: (col(r, "platform") || "X").toUpperCase(),
        type: type, label: col(r, "label"),
        text: { ja: un(col(r, "ja")), en: un(col(r, "en")), ko: un(col(r, "ko")) },
        asset: asset, note: "",
        need: (type === "image" || type === "video" || asset) ? ["text", "image"] : ["text"],
        scheduled: false, posted: false, url: "",
        check: { done: false, at: "", match: null, note: "" }
      });
    }
    return out.length ? out : null;
  }

  function renderImport() {
    chansEl.hidden = true;
    view.innerHTML = '<div class="imp">' +
      '<textarea id="impText" spellcheck="false" placeholder="' + esc(t("impPaste")) + '"></textarea>' +
      '<div class="bar">' +
        '<input type="url" id="impUrl" placeholder="' + esc(t("impUrl")) + '">' +
        '<label class="filebtn">' + esc(t("impFile")) +
        '<input type="file" id="impFile" accept=".tsv,.csv,.txt,.json,text/plain,application/json"></label>' +
      '</div>' +
      '<p class="out" id="impOut"></p>' +
      '<div class="bar" id="impActions" hidden>' +
        '<button id="impApply">' + esc(t("impApply")) + '</button>' +
        '<button id="impDl">' + esc(t("impDownload")) + '</button>' +
      '</div>' +
      '<p class="cols">' + esc(t("impCols")) + '</p></div>';
  }

  // 貼った時点で読む。押す手間をなくす
  function importRead(txt) {
    var out = document.getElementById("impOut");
    if (!txt || !txt.trim()) { imported = null; out.textContent = ""; return; }
    if (txt.trim().charAt(0) === "{") {           // schedule.json をそのまま受ける
      try {
        var j = JSON.parse(txt);
        imported = (j.slots || []).filter(function (x) { return x.date && x.time; });
      } catch (err) { imported = null; }
    } else {
      imported = parseTSV(txt);
    }
    out.textContent = imported && imported.length
      ? (imported.length + " " + t("impResult"))
      : t("impBad");
    var acts = document.getElementById("impActions");
    if (acts) acts.hidden = !(imported && imported.length);
  }

  // リンクから読む。ブラウザは他所のページを読めないことが多いので、
  // 読めなかったときは Claude に渡すよう伝える
  function importUrl(u) {
    var out = document.getElementById("impOut");
    out.textContent = t("loading");
    fetch(u, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (txt) {
        var ta = document.getElementById("impText");
        if (ta) ta.value = txt;
        importRead(txt);
      })
      .catch(function () { out.textContent = t("impUrlNo"); });
  }

  function importClick(e) {
    var out = document.getElementById("impOut");
    if (!imported || !imported.length) { out.textContent = t("impBad"); return; }
    var keep = [];
    if (schedule && schedule.slots) {          // いまの内容は必ず残す
      keep = schedule.slots.filter(function (x) {
        return !imported.some(function (y) {
          return y.date === x.date && y.time === x.time &&
                 (y.platform || "X") === (x.platform || "X");
        });
      });
    }
    var all = keep.concat(imported).sort(function (a, b) {
      return (a.date + a.time) < (b.date + b.time) ? -1 : 1;
    });
    var months = [];
    all.forEach(function (x) { var m = x.date.slice(0, 7); if (months.indexOf(m) < 0) months.push(m); });
    var body = { channel: schedule ? schedule.channel : "hiyoko",
                 months: months.sort(), timezone: "Asia/Seoul", note: "", slots: all };
    if (e.target.id === "impApply") {
      schedule = body;
      try { localStorage.setItem("remitech-schedule", JSON.stringify(body)); } catch (err) {}
      tab = "dash"; renderNav(); syncWide(); route();
      return;
    }
    if (e.target.id === "impDl") {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(body, null, 2)], { type: "application/json" }));
      a.download = "schedule.json";
      document.body.appendChild(a); a.click(); a.remove();
    }
  }

  // ---- 準備ボード ----
  // 投稿に使うものを1枚にまとめる。文面はそのまま写せる
  function chanOfSlot(sl) {
    var chId = schedule.channel || "hiyoko";
    return chanOf(chId) || { name: chId, color: "var(--wood)" };
  }

  function whenLabel(dt) {
    var today = ymd(new Date());
    var tm = new Date(); tm.setDate(tm.getDate() + 1);
    if (dt === today) return t("today");
    if (dt === ymd(tm)) return t("tomorrow");
    var d = new Date(dt + "T00:00:00");
    return (d.getMonth() + 1) + "/" + d.getDate() + " " + (DOW[lang] || DOW.en)[d.getDay()];
  }

  function renderPrep() {
    chansEl.hidden = false;
    if (!schedule) { view.innerHTML = '<p class="empty">' + esc(t("none")) + '</p>'; return; }

    var now = new Date();
    var from = ymd(now);
    var till = new Date(now); till.setDate(till.getDate() + 6);
    var to = ymd(till);

    var chId = schedule.channel || "hiyoko";
    var list = (filter && filter !== chId) ? [] : (schedule.slots || []).filter(function (x) {
      return x.date >= from && x.date <= to && !isPosted(x);
    }).sort(function (a, b) {
      return (a.date + a.time) < (b.date + b.time) ? -1 : 1;
    });

    if (!list.length) { view.innerHTML = '<p class="empty">' + esc(t("prepEmpty")) + '</p>'; return; }

    var html = '<div class="prep">';
    list.forEach(function (sl, i) {
      var ch = chanOfSlot(sl);
      var body = (sl.text && (sl.text[lang] || sl.text.en || sl.text.ja || sl.text.ko)) || "";
      var mm = matGet(sl);
      var mats = (sl.need || ["text"]).map(function (k) {
        var on = !!mm[k];
        return '<button class="matbtn" data-on="' + on + '"' +
               ' data-date="' + esc(sl.date) + '" data-pf="' + esc(sl.platform || "X") +
               '" data-time="' + esc(sl.time) + '" data-kind="' + k + '">' +
               (on ? "\u2713 " : "") + esc(t(k === "text" ? "matText" : "matImage")) + '</button>';
      }).join("");

      var parts = sl.parts && sl.parts.length ? sl.parts : null;
      html += '<div class="pcard" style="--chc:' + esc(ch.color || "var(--wood)") + '">' +
        '<div class="phead">' +
          '<i class="pf" data-p="' + esc(sl.platform || "X") + '">' + esc(sl.platform || "X") + '</i>' +
          '<span class="who">' + esc(ch.name) + '</span>' +
          '<span class="when">' + esc(whenLabel(sl.date)) + " \u00b7 " + esc(sl.time) + '</span>' +
          (sl.label ? '<span class="when">\u00b7 ' + esc(sl.label) + '</span>' : "") +
        '</div>' +
        (parts
          ? parts.map(function (pt, k) {
              var b2 = pt[lang] || pt.en || pt.ja || "";
              return '<p class="plabel">' + esc(pt.no || "") + " \u00b7 " + esc(pt.time) + '</p>' +
                     '<pre class="ptext" id="pp' + i + "_" + k + '">' + esc(b2) + '</pre>' +
                     '<div class="pbar"><button class="copybtn" data-copy="pp' + i + "_" + k + '">' +
                     esc(t("copy")) + '</button></div>';
            }).join("") + '<div class="pbar">' + mats + '</div>'
          : (body
            ? '<pre class="ptext" id="pt' + i + '">' + esc(body) + '</pre>' +
              '<div class="pbar"><button class="copybtn" data-copy="pt' + i + '">' + esc(t("copy")) + '</button>' + mats + '</div>'
            : '<p class="ptext empty2">' + esc(t("noText")) + '</p>' +
              '<div class="pbar">' + mats + '</div>'));

      if (sl.comment) {
        html += '<p class="plabel">' + esc(t("comment")) + '</p>' +
                '<pre class="ptext" id="pc' + i + '">' + esc(sl.comment) + '</pre>' +
                '<div class="pbar"><button class="copybtn" data-copy="pc' + i + '">' + esc(t("copy")) + '</button></div>';
      }
      if (sl.asset) {
        html += '<p class="passet">' + esc(t("visual")) + " \u00b7 " + esc(sl.asset) + '</p>';
      }
      var st = stGet(sl);
      html += '<div class="pbar done-bar">' +
        '<button class="donebtn" data-mark="posted" data-on="' + (!!st.posted) + '"' +
        ' data-date="' + esc(sl.date) + '" data-pf="' + esc(sl.platform || "X") +
        '" data-time="' + esc(sl.time) + '">' +
        (st.posted ? "\u2713 " : "") + esc(t("markPosted")) + '</button>' +
        '<button class="donebtn" data-mark="checked" data-on="' + (!!st.checked) + '"' +
        ' data-date="' + esc(sl.date) + '" data-pf="' + esc(sl.platform || "X") +
        '" data-time="' + esc(sl.time) + '">' +
        (st.checked ? "\u2713 " : "") + esc(t("markChecked")) + '</button></div>';
      html += '</div>';
    });
    view.innerHTML = html + '</div>';
  }

  // ---- 予約状況 ----
  // その日、全部のチャンネルが用意できているかを1目で見る。
  // 表にせず、日ごとの札にしてスマホでも縦に読めるようにする
  function renderBook() {
    chansEl.hidden = true;
    if (!schedule) { view.innerHTML = '<p class="empty">' + esc(t("none")) + '</p>'; return; }

    var now = new Date();
    var days = weekRange(now);
    var chId = schedule.channel || "hiyoko";

    var html = '<div class="book">';
    days.forEach(function (d) {
      var dt = ymd(d);
      var isToday = dt === ymd(now);
      var isPast = dt < ymd(now);
      var byCh = {};

      channels.forEach(function (c) {
        (c.postTimes || []).forEach(function (pt) {
          if (c.id !== chId) return;
          var sl = (schedule.slots || []).filter(function (x) {
            return x.date === dt && x.time === pt.time &&
                   (x.platform || "X") === (pt.platform || "X");
          })[0];
          if (!sl) return;
          var hh = pt.time.split(":");
          var when = new Date(d.getFullYear(), d.getMonth(), d.getDate(), +hh[0], +hh[1]);
          var st = slotState(sl, when, now);
          (byCh[c.id] = byCh[c.id] || { ch: c, items: [] }).items.push({
            pt: pt, st: st
          });
        });
      });

      var all = [], late = 0;
      Object.keys(byCh).forEach(function (k) {
        byCh[k].items.forEach(function (it) {
          all.push(it.st);
          if (it.st === "late") late++;
        });
      });
      var todo = all.filter(function (x) { return x !== "sched" && x !== "done"; }).length;
      var verdict = !all.length ? esc(t("nothingToday"))
        : (todo === 0 ? esc(t("allBooked")) : esc(t("leftToDo")) + " " + todo);
      var ok = !all.length ? "" : (late ? "late" : (todo === 0 ? "true" : "false"));

      html += '<div class="bday' + (isToday ? " today" : "") + (isPast ? " past" : "") + '">' +
        '<div class="bhead"><span class="d">' + (d.getMonth() + 1) + "/" + d.getDate() +
        ' <span class="w">' + (DOW[lang] || DOW.en)[d.getDay()] + '</span></span>' +
        '<span class="v" data-ok="' + ok + '">' + verdict + '</span></div>';

      Object.keys(byCh).forEach(function (k) {
        var g = byCh[k];
        html += '<div class="brow" style="--chc:' + esc(g.ch.color || "var(--wood)") + '">' +
          '<span class="nm">' + esc(g.ch.name) + '</span><span class="pips">' +
          g.items.map(function (it) {
            return '<span class="pip" data-s="' + it.st + '">' +
                   esc(it.pt.platform || "X") + ' <b>' + esc(it.pt.time) + '</b></span>';
          }).join("") + '</span></div>';
      });
      html += '</div>';
    });
    view.innerHTML = html + '</div>';
  }

  // ---- KPI ----
  // 各チャンネルのフォロワーとフォロー。前回計測との差を出す
  var kpi = null;

  function renderKpi() {
    chansEl.hidden = false;
    if (!kpi || !kpi.rows || !kpi.rows.length) {
      view.innerHTML = '<p class="empty">' + esc(t("noKpi")) + '</p>';
      return;
    }
    var rows = kpi.rows.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });

    // チャンネル×媒体ごとに、最新と1つ前を取る
    var byKey = {};
    rows.forEach(function (r) {
      var k = r.channel + "|" + r.platform;
      (byKey[k] = byKey[k] || []).push(r);
    });

    var html = '<div class="kpi">';
    var shown = 0;
    channels.forEach(function (c) {
      if (filter && filter !== c.id) return;
      ["X", "IG", "FB", "TT", "YT"].forEach(function (pf) {
        var arr = byKey[c.id + "|" + pf];
        if (!arr || !arr.length) return;
        shown++;
        var cur = arr[arr.length - 1], prev = arr.length > 1 ? arr[arr.length - 2] : null;
        function num(lbl, key) {
          var v = cur[key];
          if (v === undefined) return "";
          var dif = prev && prev[key] !== undefined ? v - prev[key] : null;
          var d = dif === null || dif === 0 ? "" :
            '<span class="dif" data-up="' + (dif > 0) + '">' + (dif > 0 ? "+" : "") + dif + '</span>';
          return '<span class="knum"><span class="lbl">' + esc(lbl) + '</span>' +
                 '<span class="val">' + v.toLocaleString() + '</span>' + d + '</span>';
        }
        html += '<div class="kcard" style="--chc:' + esc(c.color || "var(--wood)") + '">' +
          '<div class="khead"><i class="pf" data-p="' + pf + '">' + pf + '</i>' +
          '<span class="who">' + esc(c.name) + '</span></div>' +
          '<div class="knums">' + num(t("followers"), "followers") + num(t("following"), "following") + '</div>' +
          '<p class="kwhen">' + esc(t("measuredOn")) + " " + esc(cur.date) + '</p></div>';
      });
    });
    view.innerHTML = (shown ? html + '</div>' : '<p class="empty">' + esc(t("noKpi")) + '</p>');
  }

  function renderNav() {
    navEl.innerHTML =
      '<button data-tab="dash" aria-pressed="' + (tab === "dash") + '">' + esc(t("navDash")) + '</button>' +
      '<button data-tab="book" aria-pressed="' + (tab === "book") + '">' + esc(t("navBook")) + '</button>' +
      '<button data-tab="prep" aria-pressed="' + (tab === "prep") + '">' + esc(t("navPrep")) + '</button>' +
      '<button data-tab="kpi" aria-pressed="' + (tab === "kpi") + '">' + esc(t("navKpi")) + '</button>' +
      '<button data-tab="posts" aria-pressed="' + (tab === "posts") + '">' + esc(t("navPosts")) + '</button>' +
      '<button data-tab="import" aria-pressed="' + (tab === "import") + '">' + esc(t("navImport")) + '</button>';
  }

  navEl.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-tab]");
    if (!b) return;
    tab = b.getAttribute("data-tab");
    location.hash = "";
    renderNav(); syncWide(); route();
  });

  var NO = ["一","二","三","四","五","六","七","八","九","十"];

  function renderPost(p) {
    chansEl.hidden = true;
    var links = (p.channels || []).map(function (id) {
      var c = chanOf(id);
      if (!c) return "";
      return (c.links || []).map(function (l) {
        return '<a class="goto" href="' + esc(l.url) + '" target="_blank" rel="noopener">' +
               esc(l.kind) + ' ' + esc(l.handle) + ' ↗</a>';
      }).join("");
    }).join("");
    view.innerHTML = '<button class="back" id="backBtn">' + esc(t("back")) + '</button><div class="post">' +
      '<span class="meta"><span>' + esc(p.date) + '</span>' +
      '<span class="flag" data-status="' + esc(p.status) + '">' +
        esc(p.status === "draft" ? t("draft") : t("live")) + '</span></span>' +
      '<h2>' + esc(p.title) + '</h2><p class="lead">' + esc(p.lead) + '</p>' +
      (p.pages || []).map(function (pg, i) {
        return '<section class="sheet"><span class="no">' + (NO[i] || (i + 1)) + '</span>' +
               '<h3>' + esc(pg.head) + '</h3><p>' + esc(pg.body) + '</p></section>';
      }).join("") + (links ? '<div class="links">' + links + '</div>' : '') + '</div>';
  }

  function route() {
    var id = location.hash.replace(/^#\/?/, "");
    var p = id && posts.filter(function (x) { return x.id === id; })[0];
    if (p) { renderPost(p); window.scrollTo(0, 0); return; }
    if (tab === "dash") { renderDash(); return; }
    if (tab === "kpi") { renderKpi(); return; }
    if (tab === "book") { renderBook(); return; }
    if (tab === "prep") { renderPrep(); return; }
    if (tab === "import") { renderImport(); return; }
    renderList();
  }

  langEl.addEventListener("click", function (e) {
    if (e.target.closest("#themeBtn")) {
      var i = THEMES.map(function (x) { return x[0]; }).indexOf(theme);
      theme = THEMES[(i + 1) % THEMES.length][0];
      try { localStorage.setItem("remitech-theme", theme); } catch (err) {}
      applyTheme();
      return;
    }
    if (!e.target.closest("#langBtn")) return;
    var i = LANGS.map(function (x) { return x[0]; }).indexOf(lang);
    lang = LANGS[(i + 1) % LANGS.length][0];
    try { localStorage.setItem("remitech-lang", lang); } catch (err) {}
    renderLang(); renderNav(); renderChans(); route();
  });

  chansEl.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-chan]");
    if (!b) return;
    filter = b.getAttribute("data-chan");
    renderChans();
    if (tab === "prep") { renderPrep(); }
    else if (tab === "kpi") { renderKpi(); }
    else { renderList(); }
  });

  view.addEventListener("click", function (e) {
    var cp = e.target.closest(".copybtn");
    if (cp) {
      var src = document.getElementById(cp.getAttribute("data-copy"));
      if (src && navigator.clipboard) {
        navigator.clipboard.writeText(src.textContent).then(function () {
          cp.setAttribute("data-done", "true");
          cp.textContent = t("copied");
          setTimeout(function () {
            cp.removeAttribute("data-done");
            cp.textContent = t("copy");
          }, 1600);
        });
      }
      return;
    }
    var db = e.target.closest(".donebtn");
    if (db) {
      var dd = db.getAttribute("data-date"), dt2 = db.getAttribute("data-time");
      var dp = db.getAttribute("data-pf") || "X";
      var slx = (schedule.slots || []).filter(function (x) {
        return x.date === dd && x.time === dt2 && (x.platform || "X") === dp;
      })[0];
      if (!slx) return;
      stSet(slx, db.getAttribute("data-mark"), db.getAttribute("data-on") !== "true");
      renderPrep();
      return;
    }
    var mb = e.target.closest(".matbtn");
    if (!mb) return;
    var dt = mb.getAttribute("data-date"), tm = mb.getAttribute("data-time");
    var pf = mb.getAttribute("data-pf") || "X";
    var sl = (schedule.slots || []).filter(function (x) {
      return x.date === dt && x.time === tm && (x.platform || "X") === pf;
    })[0];
    if (!sl) return;
    matSet(sl, mb.getAttribute("data-kind"), mb.getAttribute("data-on") !== "true");
    if (tab === "prep") { renderPrep(); } else { renderDash(); }
  });

  view.addEventListener("change", function (e) {
    if (e.target.id === "impFile") {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        var ta = document.getElementById("impText");
        if (ta) ta.value = fr.result;
        importRead(fr.result);
      };
      fr.readAsText(f);
      return;
    }
    var cb = e.target.closest("input[type=checkbox]");
    if (!cb) return;
    if (cb.id === "remOn") {
      var p = remindPrefs(); p.on = cb.checked; saveRemind(p);
      if (p.on && "Notification" in window && Notification.permission === "default") {
        Notification.requestPermission().then(function () { renderDash(); });
        return;
      }
      renderDash(); return;
    }
  });

  view.addEventListener("input", function (e) {
    if (e.target.id === "impText") { importRead(e.target.value); return; }
    if (e.target.id === "impUrl") { return; }
    if (e.target.id === "remMin") {
      var p = remindPrefs(); p.min = +e.target.value; saveRemind(p);
      renderDash(); return;
    }
    if (e.target.id === "wsPick") {
      try { localStorage.setItem("remitech-weekstart", e.target.value); } catch (err) {}
      renderDash();
    }
  });

  view.addEventListener("click", function (e) {
    if (tab === "import" && e.target.tagName === "BUTTON") { importClick(e); return; }
    var card = e.target.closest(".card");
    if (card) { location.hash = "/" + card.getAttribute("data-id"); return; }
    if (e.target.closest("#backBtn")) { location.hash = ""; }
  });
  // 貼り付け欄にファイルを置いても読む
  view.addEventListener("dragover", function (e) {
    if (tab !== "import") return;
    e.preventDefault();
    var ta = document.getElementById("impText");
    if (ta) ta.setAttribute("data-drop", "true");
  });
  view.addEventListener("dragleave", function () {
    var ta = document.getElementById("impText");
    if (ta) ta.removeAttribute("data-drop");
  });
  view.addEventListener("drop", function (e) {
    if (tab !== "import") return;
    e.preventDefault();
    var ta = document.getElementById("impText");
    if (ta) ta.removeAttribute("data-drop");
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function () { if (ta) ta.value = fr.result; importRead(fr.result); };
    fr.readAsText(f);
  });

  view.addEventListener("keydown", function (e) {
    if (e.target.id === "impUrl" && e.key === "Enter") {
      e.preventDefault();
      if (e.target.value.trim()) importUrl(e.target.value.trim());
    }
  });
  view.addEventListener("paste", function (e) {
    if (e.target.id !== "impUrl") return;
    setTimeout(function () {
      var v = document.getElementById("impUrl");
      if (v && v.value.trim()) importUrl(v.value.trim());
    }, 0);
  });

  window.addEventListener("hashchange", route);

  // 置かれているファイルが差し替わったかを、たまに見に行く。
  // 作業中に画面を作り直すと入力が消えるので、帯を出すだけにする
  var seen = {};
  function stamp(res) {
    return (res.headers.get("etag") || "") + "|" + (res.headers.get("last-modified") || "");
  }
  function watchUpdates() {
    ["./posts.json", "./schedule.json", "./kpi.json"].forEach(function (u) {
      fetch(u, { method: "HEAD", cache: "no-store" }).then(function (r) {
        if (!r.ok) return;
        var st = stamp(r);
        if (!st) return;
        if (seen[u] === undefined) { seen[u] = st; return; }
        if (seen[u] !== st) {
          seen[u] = st;
          var el = document.getElementById("toast");
          document.getElementById("toastText").textContent = t("updated");
          document.getElementById("toastGo").textContent = t("reload");
          el.hidden = false;
          clearTimeout(window.__toastT);
          window.__toastT = setTimeout(function () { el.hidden = true; }, 20000);  // 放っておけば消える
        }
      }).catch(function () {});
    });
  }
  document.getElementById("toastGo").addEventListener("click", function () { location.reload(); });
  document.getElementById("toastX").addEventListener("click", function () {
    document.getElementById("toast").hidden = true;
  });
  watchUpdates();
  setInterval(watchUpdates, 300000);        // 5分ごと

  // 週表のときだけ枠を広げる
  function syncWide() {
    document.body.setAttribute("data-wide", tab === "dash" ? "true" : "false");
  }

  renderLang();
  renderNav();
  syncWide();
  document.getElementById("loading").textContent = t("loading");

  fetch("./posts.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) {
      channels = j.channels || [];
      posts = j.posts || [];
      fetch("./kpi.json", { cache: "no-cache" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (k) { kpi = k; if (tab === "kpi") renderKpi(); })
        .catch(function () {});
      return fetch("./schedule.json", { cache: "no-cache" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; })
        .then(function (sc) {
          schedule = sc;
          try {
            var mine = JSON.parse(localStorage.getItem("remitech-schedule") || "null");
            if (mine && mine.slots && mine.slots.length) schedule = mine;   // 取り込んだものが優先
          } catch (e) {}
          renderChans(); route();
        });
    })
    .catch(function () { view.innerHTML = '<p class="empty">' + esc(t("fail")) + '</p>'; });
})();
</script>
</body>
</html>
