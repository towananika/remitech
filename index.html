<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REMITECH HUB</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Source of truth for everything we post.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500&family=Shippori+Mincho:wght@500&display=swap">
<link rel="stylesheet" href="./reel-editor.css?v=20261027-auto-next">
<style>
  :root{
    --neon:#2bff88; --neon-ink:#07361b;
    --bg:#f5f1e9; --surface:#fbf9f4; --line:#e2dac8;
    --ink:#231f1a; --muted:#645c4e; --wood:#93704b; --wood-soft:#ece1d0; --sage:#7d8c6a; --todaybg:#f3ebdd; --wkndbg:#f2efe7;
    --mincho:"Shippori Mincho","Hiragino Mincho ProN",serif;
    --gothic:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#1c1a16; --surface:#242119; --line:#38332a;
    --ink:#f2eee5; --muted:#b6ad99; --wood:#c99f74; --wood-soft:#382d20; --sage:#9aab84; --todaybg:#2b2318; --wkndbg:#221f19;
  }}
  :root[data-theme="dark"]{
    --bg:#1c1a16; --surface:#242119; --line:#38332a;
    --ink:#f2eee5; --muted:#b6ad99; --wood:#c99f74; --wood-soft:#382d20; --sage:#9aab84; --todaybg:#2b2318; --wkndbg:#221f19;
  }
  *{box-sizing:border-box}
  /* 2026-09-17: 押したときに一瞬ボタンの大きさが変わる問題を消す。
     端末側の既定の押下効果（灰色の重ね・ダブルタップ拡大・OS純正のボタン装飾）が原因だった */
  button{ -webkit-tap-highlight-color:transparent; -webkit-appearance:none; appearance:none; touch-action:manipulation; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--gothic); font-weight:400; line-height:1.8;
    -webkit-font-smoothing:antialiased;
  }
  .page{ width:100%; max-width:660px; margin:0 auto; padding:40px 20px 72px; }
  /* 週表は横に長いので、広い画面では枠を広げる。読みものは狭いままにする */
  body[data-wide="true"] .page{ max-width:1180px; }
  body[data-wide="true"] .sum,
  body[data-wide="true"] .rem{ max-width:none; }
  .list, .post, .imp{ max-width:660px; }

  /* ---- header ---- */
  .top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .brand{ margin:0 0 2px; font-size:10px; letter-spacing:.34em; text-indent:.34em;
          color:var(--muted); }
  h1{ margin:0; font-family:var(--mincho); font-weight:500;
      font-size:22px; letter-spacing:.4em; text-indent:.4em; }
  .tagline{ margin:6px 0 0; font-size:13px; color:var(--muted); letter-spacing:.04em; }
  .lang{ display:flex; gap:4px; flex:0 0 auto; }
  .lang{ align-items:center; }
  .pill{
    background:var(--surface); border:1px solid var(--line); border-radius:999px;
    color:var(--ink); font:inherit; font-size:12px; letter-spacing:.06em;
    padding:5px 12px; cursor:pointer; min-width:52px;
  }
  .pill:hover{ border-color:var(--wood); }
  .theme{
    background:var(--surface); border:1px solid var(--line); border-radius:999px;
    color:var(--ink); font:inherit; font-size:13px; line-height:1;
    width:32px; height:28px; cursor:pointer; padding:0;
  }
  .theme:hover{ border-color:var(--wood); }

  /* 状態は色と形の両方で示す。英語が読めなくても区別がつくように */
  .dot{ width:6px; height:6px; border-radius:50%; flex:0 0 auto; }
  .dot[data-status="draft"]{ background:var(--wood); }
  .dot[data-status="live"]{ background:var(--sage, #7d8c6a); }

  /* 更新のお知らせ。作業中に邪魔しないよう、上に細く出すだけ */
  .toast{
    position:fixed; top:10px; right:12px;
    display:flex; align-items:center; gap:12px; z-index:50;
    background:var(--surface); border:1px solid var(--wood); border-radius:999px;
    padding:6px 6px 6px 14px; font-size:12px; color:var(--ink); opacity:.96;
    box-shadow:0 2px 12px rgba(0,0,0,.10); max-width:calc(100vw - 24px);
  }
  .toast[hidden]{ display:none; }
  .toast button{
    background:var(--wood); border:0; border-radius:999px; color:var(--surface);
    font:inherit; font-size:12px; padding:5px 12px; cursor:pointer;
  }
  .toast .x{ background:none; color:var(--muted); padding:5px 8px; }

  /* 上へ戻る。長い週表や準備ボードで下まで行くと出る */
  .totop{
    position:fixed; right:16px; bottom:16px; z-index:40;
    width:40px; height:40px; border-radius:50%;
    background:var(--surface); border:1px solid var(--line); color:var(--ink);
    font:inherit; font-size:16px; line-height:1; cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.10);
    opacity:0; transform:translateY(6px); transition:opacity .18s ease, transform .18s ease;
  }
  .totop[hidden]{ display:none; }
  .totop[data-in="true"]{ opacity:.95; transform:translateY(0); }
  .totop:hover{ border-color:var(--wood); color:var(--wood); }
  @media (prefers-reduced-motion:reduce){ .totop{ transition:none } }

  /* ---- nav ---- */
  /* タブが増えて、スマホでは一列に収まらない。ページごと横に揺れないよう、
     タブの列だけを横に流す */
  .nav{ display:flex; gap:4px; margin:24px 0 4px; overflow-x:auto; scrollbar-width:none;
        -webkit-overflow-scrolling:touch; }
  .nav::-webkit-scrollbar{ display:none; }
  .nav button{
    background:none; border:0; border-bottom:2px solid transparent;
    color:var(--muted); font:inherit; font-size:14px; padding:6px 2px; margin-right:16px;
    cursor:pointer; flex:0 0 auto; white-space:nowrap;
  }
  .nav button[aria-pressed="true"]{ color:var(--ink); border-bottom-color:var(--wood); }
  /* いいねタブ＝日々の作業タブ。押していなくても少し目立たせる（2026-09-21） */
  .nav button.navhot{ color:var(--wood); font-weight:700; }
  .nav button.navhot[aria-pressed="true"]{ color:var(--ink); }

  /* ---- KPI ---- */
  .kpi{ max-width:none; }
  .ksumbar{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  .ksum{
    display:flex; flex-direction:column; gap:2px; border:1px solid var(--line);
    border-top:3px solid var(--chc, var(--wood)); border-radius:10px; padding:8px 14px;
  }
  .ksumall{ border-top-color:var(--ink); }
  .ksumname{ font-size:10.5px; color:var(--muted); letter-spacing:.05em; }
  .ksumval{ font-size:18px; font-weight:500; font-variant-numeric:tabular-nums; color:var(--ink); }
  .kgroup{ margin-bottom:18px; display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:10px; }
  .kgroup .kgtitle{ grid-column:1 / -1; margin-bottom:0; }
  .kgroup .kcard{ margin-bottom:0; }

  .chores{ margin-top:30px; border-top:1px solid var(--line); padding-top:18px; }
  .chwrap{ border:1px solid var(--line); border-radius:14px; background:var(--surface); overflow:hidden; }
  .chtab{ width:100%; border-collapse:collapse; table-layout:fixed; }
  .chtab th, .chtab td{ padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .chtab tbody tr:last-child th, .chtab tbody tr:last-child td{ border-bottom:0; }
  .chtab thead th{ font-size:13px; font-weight:500; color:var(--muted); text-align:left;
    font-variant-numeric:tabular-nums; }
  .chtab thead th:first-child{ width:150px; }
  .chtab th.now, .chtab td.now{ background:var(--wood-soft); }
  .chtab thead th.now{ color:var(--wood); }
  .chacc2{ text-align:left; border-left:3px solid var(--chc, var(--wood)); }
  .chacc2 b{ display:block; font-size:13px; font-weight:500; color:var(--chc, var(--ink)); }
  .chacc2 i{ font-style:normal; font-size:11.5px; color:var(--muted); }
  .chtab td{ display:table-cell; }
  .chtab td .chchip{ margin:2px 4px 2px 0; }
  .chchip{ font:inherit; font-size:12.5px; color:var(--ink); background:var(--bg);
    border:1px solid var(--line); border-radius:999px; padding:5px 12px; cursor:pointer; }
  .chchip:hover{ border-color:var(--wood); }
  .chchip[data-on="true"]{ color:var(--surface); background:var(--sage); border-color:var(--sage); }
  @media (max-width:640px){
    .chtab thead th:first-child{ width:86px; }
    .chtab th, .chtab td{ padding:7px 4px; }
    .chacc2 b{ font-size:12px; }
    .chtab td .chchip{ display:block; width:100%; margin:3px 0; padding:6px 2px; font-size:11.5px; }
  }
  .kgtitle{
    margin:0 0 8px; font-size:11.5px; color:var(--chc, var(--wood)); letter-spacing:.06em;
    font-weight:500; border-left:3px solid var(--chc, var(--wood)); padding-left:8px;
  }
  .kcard{
    border:1px solid var(--line); border-left:3px solid var(--chc, var(--wood));
    border-radius:14px; background:var(--surface); padding:14px 16px; margin-bottom:10px;
  }
  .khead{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .khead .who{ font-weight:500; font-size:13.5px; color:var(--chc, var(--ink)); }
  .khead .kdate{ margin-left:auto; font-size:11px; color:var(--muted);
                 font-variant-numeric:tabular-nums; }
  .kbody{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; }
  .kmain{ flex:0 0 auto; }
  .kmain .lbl{ display:block; font-size:11.5px; color:var(--muted); letter-spacing:.04em; }
  .kmain .val{ font-size:26px; font-weight:500; font-variant-numeric:tabular-nums; line-height:1.2; }
  .kmain .dif{ font-size:12px; margin-left:7px; font-variant-numeric:tabular-nums; }
  .kmain .dif[data-up="true"]{ color:var(--sage); }
  .kmain .dif[data-up="false"]{ color:#b4553f; }
  button.ksum{ font:inherit; text-align:left; background:var(--surface); color:inherit; cursor:pointer; }
  button.ksum:hover{ border-color:var(--chc, var(--wood)); }
  button.ksum[aria-pressed="true"]{ background:var(--wood-soft); }
  .ktoggle{ display:block; width:100%; font:inherit; color:inherit; text-align:left; background:none; border:0; padding:0; cursor:pointer; }
  .kbody{ align-items:center; }
  .kchev{ font-size:13px; color:var(--muted); }
  .kman{ margin:0 0 20px; padding:14px 16px; border:1px solid var(--line); border-radius:14px; background:var(--surface); }
  .kmhead{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .kmhead .kgtitle{ margin:0; }
  .kmyt{ margin:6px 0 0; font-size:12.5px; color:var(--muted); }
  .kmgrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px; margin-top:10px; }
  .kmcell{ display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted); box-shadow:inset 3px 0 0 var(--chc); padding-left:8px; }
  .kmcell b{ color:var(--ink); font-weight:600; }
  .kmin{ min-height:44px; font:inherit; font-size:16px; font-variant-numeric:tabular-nums; padding:6px 10px;
    border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); }
  .kmbar{ display:flex; align-items:center; gap:10px; margin-top:12px; }
  .kmwho{ display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; }
  .kmdt{ font-style:normal; font-size:11px; color:var(--muted); }
  .kmdt[data-old="true"]{ color:#b4553f; }
  .kmrow{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .kmrow i{ font-style:normal; font-size:11.5px; color:var(--muted); }
  .kmnum{ font:inherit; font-variant-numeric:tabular-nums; color:var(--ink); background:none; border:0; border-bottom:1px dashed var(--line);
    padding:2px 2px; min-height:32px; cursor:pointer; font-size:17px; }
  .kmnum.kmbig{ font-size:26px; font-weight:600; line-height:1.15; }
  .kmnum:hover{ border-bottom-color:var(--chc, var(--ink)); }
  .kmedit{ width:100%; max-width:130px; }
  .kmgrid .kmcell{ padding:8px 10px 8px 12px; gap:4px; }
  .kmnumwrap{ display:flex; flex-direction:column; align-items:flex-end; }
  .kmstamp{ font-style:normal; font-size:9.5px; color:var(--muted); margin-top:-2px; }
  .kmbar button{ min-height:44px; padding:0 22px; font:inherit; font-weight:700; border:0; border-radius:10px;
    background:var(--ink); color:var(--surface); cursor:pointer; }
  .kdetail{ margin-top:12px; border-top:1px solid var(--line); padding-top:8px; overflow-x:auto; }
  .kdetail table{ width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  .kdetail th{ font-size:11.5px; font-weight:500; color:var(--muted); text-align:right; padding:4px 6px; }
  .kdetail td{ text-align:right; padding:5px 6px; border-top:1px solid var(--line); }
  .kdetail th:first-child, .kdetail td:first-child{ text-align:left; }
  .kdetail .kd[data-up="true"]{ color:var(--sage); }
  .kdetail .kd[data-up="false"][data-zero="false"]{ color:#b4553f; }
  .kmore{ margin-top:8px; font:inherit; font-size:12.5px; background:none; border:1px dashed var(--line); border-radius:8px;
    padding:6px 10px; color:var(--muted); cursor:pointer; width:100%; }
  .spark{ width:100%; height:40px; display:block; overflow:visible; }
  .spark .sl{ fill:none; stroke:var(--chc, var(--wood)); stroke-width:1.5;
              stroke-linecap:round; stroke-linejoin:round; }
  .spark .sa{ fill:var(--chc, var(--wood)); opacity:.10; stroke:none; }
  .spark .sd{ fill:var(--chc, var(--wood)); }
  .ksub{ margin:10px 0 0; font-size:12px; color:var(--muted); }

  /* ---- booking board ---- */
  .book{ max-width:560px; }
  .bday{
    border:1px solid var(--line); border-radius:14px; background:var(--surface);
    padding:14px 16px; margin-bottom:10px;
  }
  .bday.today{ border-color:var(--wood); }
  .bday.past{ opacity:.62; }
  .bhead{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .bhead .d{ font-size:15px; font-weight:500; font-variant-numeric:tabular-nums; }
  .bhead .w{ font-size:12px; color:var(--muted); }
  .bhead .v{ font-size:12px; }
  .bhead .v[data-ok="true"]{ color:var(--sage); }
  .bhead .v[data-ok="false"]{ color:var(--wood); }
  .bhead .v[data-ok="late"]{ color:#b4553f; }
  .brow{ display:flex; align-items:center; gap:8px; margin-top:9px; }
  .brow .nm{ font-size:12.5px; color:var(--chc, var(--ink)); flex:0 0 84px;
             overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pips{ display:flex; gap:4px; flex-wrap:wrap; }
  .pip{
    display:inline-flex; align-items:center; gap:3px;
    font-size:10.5px; border:1px solid var(--line); border-radius:999px;
    padding:2px 7px; color:var(--muted); white-space:nowrap;
  }
  .pip b{ font-weight:500; font-variant-numeric:tabular-nums; }
  .pip[data-s="sched"]{ color:var(--neon-ink); background:var(--neon); border-color:var(--neon); }
  .pip[data-s="done"]{ color:var(--surface); background:var(--sage); border-color:var(--sage); }
  .pip[data-s="late"]{ color:var(--surface); background:#b4553f; border-color:#b4553f; }
  .pip[data-s="ready"]{ color:var(--surface); background:var(--wood); border-color:var(--wood); }
  .pip[data-s="text"]{ color:var(--wood); border-color:var(--wood); }

  /* ---- prep board ---- */
  .prep{ max-width:760px; }
  .snip{
    border:1px solid var(--line); border-left:3px solid var(--chc, var(--wood));
    border-radius:14px; background:var(--surface); padding:14px 16px; margin-bottom:12px;
  }
  .snhead{ cursor:default; margin-bottom:10px; }
  .snurl{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .snurl code{
    flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-size:12.5px; color:var(--ink);
    background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 10px;
  }
  /* ---- ログイン（2026-10-08）と社内資料 ---- */
  /* ---- 投稿タブ（2026-10-08）---- */
  .pchow{ margin:0 0 10px; color:var(--muted); }
  .pcwrap{ overflow:auto; border:1px solid var(--line); border-radius:12px; background:var(--surface); }
  .pctab{ min-width:820px; }
  .pcc{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; width:100%; min-height:44px; padding:4px 2px; box-sizing:border-box;
    font:inherit; font-size:11px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--muted); }
  button.pcc{ cursor:pointer; }
  .pcc[data-st="ok"]{ background:color-mix(in srgb, var(--sage) 16%, var(--surface)); border-color:var(--sage); color:var(--ink); }
  .pcc[data-sel="true"]{ box-shadow:0 0 0 2px var(--ink) inset; }
  .pcc[data-st="none"]{ background:color-mix(in srgb, #e5534b 12%, var(--surface)); border-color:#e5534b; color:#b4553f; font-weight:700; }
  .pcc[data-st="wait"], .pcc[data-st="old"]{ border-style:dashed; }
  .pcc[data-st="nodata"]{ background:color-mix(in srgb, var(--muted) 14%, var(--surface)); }
  .pcm{ font-variant-numeric:tabular-nums; white-space:nowrap; }
  .pctag{ font-size:10.5px; padding:0 6px; border-radius:999px; border:1px solid var(--line); }
  .pctag[data-t="same"]{ color:var(--sage); border-color:var(--sage); }
  .pctag[data-t="near"]{ color:#b8862e; border-color:#e0a53a; }
  .pctag[data-t="diff"]{ color:#b4553f; border-color:#e5534b; }
  .pcdetail{ margin-top:12px; padding:12px 14px; border:1px solid var(--line); border-left:3px solid var(--chc, var(--wood)); border-radius:12px; background:var(--surface); }
  .pcdh{ margin:0 0 4px; font-size:14px; }
  .pcdh a{ margin-left:6px; }
  .pccmp{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px; }
  .pccmp pre{ margin:0; white-space:pre-wrap; word-break:break-word; font:inherit; font-size:13px; line-height:1.5; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  @media (max-width:640px){ .pccmp{ grid-template-columns:1fr; } }
  .tgsnsrow{ margin-left:auto; display:inline-flex; flex-wrap:wrap; gap:4px; align-items:center; }
  .tgsns{ display:inline-flex; align-items:center; gap:3px; padding:2px 7px; font-size:11.5px; border-radius:999px; border:1px solid var(--line); color:var(--muted); background:var(--bg); white-space:nowrap; }
  a.tgsns{ text-decoration:none; min-height:30px; cursor:pointer; transition:background .15s,box-shadow .15s; }
  a.tgsns:hover{ background:color-mix(in srgb,var(--sage) 18%,var(--surface)); box-shadow:0 1px 5px #0002; }
  a.tgsns:focus-visible{ outline:2px solid var(--sage); outline-offset:3px; }
  a.tgsns[data-fixed="true"]{ text-decoration:none; opacity:1; }
  .tgsns .pfi{ width:16px; height:16px; margin:0; }
  .tgsns{ justify-content:center; min-width:30px; min-height:30px; padding:4px; box-sizing:border-box; }
  .tgsns[data-ok="true"]{ color:var(--sage); border-color:var(--sage); font-weight:700; background:color-mix(in srgb, var(--sage) 10%, var(--surface)); }
  .tgsns[data-ok="false"]{ text-decoration:line-through; opacity:.75; }
  .tgshares .tghead{ flex-wrap:wrap; }
  @media (max-width:560px){ .tgsnsrow{ order:9; flex-basis:100%; margin-left:0; } .tgsc{ margin-left:auto; } }
  .bkfetch:disabled{ opacity:.55; cursor:wait; }
  .undobtn{ position:fixed; left:16px; bottom:16px; z-index:50; min-height:44px; padding:0 16px; font:inherit; font-size:14px; font-weight:700;
    border:1px solid var(--ink); border-radius:999px; background:var(--surface); color:var(--ink); box-shadow:0 4px 14px rgba(0,0,0,.15); cursor:pointer; }
  .undobtn:disabled{ opacity:.8; cursor:default; }
  .bkkpi{ display:flex; justify-content:center; flex-wrap:wrap; gap:0 5px; margin-top:3px; font-size:10.5px; line-height:1.4; color:var(--muted);
    text-decoration:none; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .bkkpi:hover{ color:var(--ink); }
  .bkkpil{ color:var(--wood); }

  .manage{max-width:960px;margin:0 auto;padding:12px 0 36px;}
  .manage h2{margin:0 0 6px;font-size:23px;}
  .managebar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0;}

  /* ---- 予約（行＝中身、列＝日） ---- */
  .bkhead{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:4px 0 12px; }

  .bkjump input{ min-height:40px; font:inherit; font-size:14px; padding:4px 8px; border:1px solid var(--line); border-radius:10px;
    background:var(--surface); color:var(--ink); }
  /* 日付の見出しも、下に送ったとき上に残す（2026-09-23 Hibiki指定）。
     見出しを画面に留めるには、表そのものが縦にも動く箱でないといけないので、
     高さを画面に合わせて、表の中で縦にも送る形にする */
  /* 高さは画面に合わせてJSで入れる（bkFitHeight）。表の外（ページ）が長く動くと、
     箱ごと上に流れて見出しも消えるため、表の中だけが動くようにする */
  .bkwrap{ overflow:auto; max-height:calc(100dvh - 160px); overscroll-behavior:contain;
    border:1px solid var(--line); border-radius:12px; background:var(--surface); }
  .bktab thead th{ position:sticky; top:0; z-index:2; background-color:var(--surface); }
  .bktab thead th.bkacc{ z-index:3; }   /* 左上の角。縦と横の両方で残る */
  .bktab thead th[data-wknd="true"]{ background-color:var(--wkndbg); }
  .bktab thead th[data-today="true"]{ background-color:var(--todaybg); }
  .bktab thead th[data-hol="true"]{ background-color:color-mix(in srgb, #e5534b 13%, var(--surface)); }
  /* 見出しの下の線は、送っても消えないように影で描く（枠線は一緒に動かない） */
  .bktab thead th::after{ content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px; background:var(--line); }
  .bktab{ border-collapse:collapse; width:100%; min-width:760px; table-layout:fixed; }
  /* 直近2週: 15日ぶん。昨日と今日のあいだに太い線を引いて、左右を分ける */
  .bktab.bkrecent{ min-width:1360px; }
  .bktab.bkrecent tr > :nth-child(3){ border-left:3px solid var(--ink); }
  .bkrange{ font-size:14px; font-variant-numeric:tabular-nums; }
  .bktab th, .bktab td{ border-bottom:1px solid var(--line); border-left:1px solid var(--line); padding:4px; text-align:center; }
  .bktab .bkacc{ position:sticky; left:0; z-index:1; width:150px; text-align:left; padding:6px 10px; background:var(--surface);
    border-left:0; box-shadow:inset 3px 0 0 var(--chc, transparent); }
  .bkacc b{ display:block; font-size:13px; line-height:1.3; font-weight:500; }
  .bkacc i{ display:block; font-style:normal; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .bkowner{ margin-top:2px; font-size:10.5px; color:var(--muted); text-align:center; }
  /* 予約ボタンの操作（タップ・長押し＋ドラッグ）*/
  .bktab .bkc.bkbig{ touch-action:pan-y; position:relative; }   /* 縦スクロールは邪魔しない。横は長押し成立後だけ奪う */
  .bktab .bkc.bkbig[data-video]{ background:color-mix(in srgb, var(--neon) 35%, var(--surface)); border-color:var(--neon); color:var(--ink); font-weight:600; font-size:11.5px; }
  .bktab .bkc.bkbig.bklong{ box-shadow:0 0 0 2px var(--ink) inset; }
  .bktab .bkc.bkbig[data-drag="left"]{ transform:translateX(-3px); }
  .bktab .bkc.bkbig[data-drag="right"]{ transform:translateX(3px); }
  .bktab .bkc.bkbig[data-drag="down"]{ transform:translateY(3px); }
  .bktab .bkc.bkbig[data-drag="up"]{ transform:translateY(-3px); }
  .bkmemodot{ position:absolute; top:2px; right:3px; font-size:9px; opacity:.7; }
  .bklinkdot{ position:absolute; top:2px; left:3px; font-size:9px; opacity:.7; }
  /* 長押しの案内（コンパス）。2026-09-17 */
  .bkhint{ position:absolute; z-index:65; display:grid; grid-template-columns:60px 60px 60px; grid-template-rows:30px 30px 30px;
    gap:3px; width:189px; height:96px; pointer-events:none; }
  .bkhint span{ display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.15;

  /* 予約ボタンのドロップダウン。ラベルを選んだボタンはその色（文字は黒） */
  .bktab .bkc.bkbig[data-cust]{ background:var(--cc); border:1px solid var(--cc); border-style:solid; color:#1b1b1b; font-weight:600; font-size:11.5px; }

    border-bottom:1px solid var(--line); border-left:1px solid var(--line);

  .grid thead th:first-child{ border-left:0; }
  .grid thead th .dow{ display:block; font-size:11px; color:var(--muted); letter-spacing:.08em; }

  .grid th.rowhead .rt{ display:block; margin-top:3px; font-size:13px;
                        color:var(--ink); font-variant-numeric:tabular-nums; }

  .cell{ display:block; padding:8px 6px; }
  .mk{
    display:block; font-size:11px; font-weight:500; line-height:1.5;

    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .mk .ok{ font-style:normal; margin-left:4px; }
  .mk[data-s="text"]{ color:var(--wood); border-color:var(--wood); }

  .mk[data-s="sched"]{ color:var(--neon-ink); background:var(--neon); border-color:var(--neon); }
  .mk[data-s="done"]{ color:var(--surface); background:var(--sage); border-color:var(--sage); }
  .mk[data-s="late"]{ color:var(--surface); background:#b4553f; border-color:#b4553f; }

    border:1px dashed var(--line); text-decoration:line-through; }

    text-decoration:line-through; opacity:.7; }
  .gev[data-s="skip"] b{ color:var(--muted); }
  .pskip{ width:100%; margin-top:8px; min-height:40px; font-size:13px !important; color:var(--muted) !important;
    border-style:dashed !important; }
  .pskip[data-on="true"]{ color:var(--ink) !important; background:var(--bg) !important; border-style:solid !important;
    border-color:var(--ink) !important; text-decoration:line-through; }

  .cellfoot{ display:flex; align-items:center; gap:5px; margin-top:5px; }
  .lb2{ flex:1 1 auto; min-width:0; font-size:10.5px; color:var(--muted); text-align:left;
        overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cellmats{ display:flex; gap:3px; flex:0 0 auto; }
  .mt{
    width:17px; height:17px; padding:0; line-height:15px; cursor:pointer;
    background:none; border:1px solid var(--line); border-radius:5px;
    color:var(--muted); font:inherit; font-size:9.5px; font-weight:500;

  .mt:hover{ border-color:var(--wood); color:var(--ink); }
  .mt[data-on="true"]{ color:var(--surface); background:var(--sage); border-color:var(--sage); }
  .none{ display:block; padding:14px 0; color:var(--line); font-size:14px; }

    .grid thead th .dnum{ font-size:16px; }

  /* ---- dashboard ---- */
  .sum{ background:var(--surface); border:1px solid var(--line); border-radius:14px;
        padding:16px 18px; margin:18px 0 14px; }

  .sum .rng{ font-size:12.5px; color:var(--muted); letter-spacing:.02em; line-height:2; }

        padding:12px 14px; margin-bottom:8px; }

          font-size:12.5px; color:var(--muted); letter-spacing:.04em; margin-bottom:6px; }

  .mats{ display:flex; gap:10px; align-items:center; flex:0 0 auto; }

        cursor:pointer; user-select:none; }

  .mat[data-on="true"]{ color:var(--ink); }
  .st[data-s="ready"]{ color:var(--surface); background:var(--wood); border-color:var(--wood); }

        font-size:12px; color:var(--muted); margin:0 0 14px; }

  .imp textarea{
    width:100%; min-height:220px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12.5px; line-height:1.7; color:var(--ink); background:var(--surface);

    // 予約・空欄はサーバーにも送る（どの画面から変えても、更新で戻らないように。2026-09-21）
    if (k === "scheduled" || k === "skip") bookPushSlotSoon(sl);
  }

  function isPosted(sl) { return !!(sl.posted || stGet(sl).posted); }
  // サーバーに状態がある枠は、サーバーの予約済みだけを見る。
  // 端末の印（stGet）は日付・SNS・時刻だけの鍵で、プロジェクトを区別しない（HIYOKOとREELの同じ時刻が混ざる）。
  // 古い印がサーバーの「準備中」を上書きして、変えても戻って見えていた（2026-09-21）
  var bkSrv = {};
  function isSched(sl) { return bkSrv[slotKey(sl)] ? !!sl.scheduled : !!(sl.scheduled || stGet(sl).scheduled); }
  function isChecked(sl) { return !!((sl.check && sl.check.done) || stGet(sl).checked); }

  function matKey(sl) { return "remitech-mat-" + slotCh(sl) + "-" + sl.date + "-" + (sl.platform || "X") + "-" + sl.time; }
  function matKeyOld(sl) { return "remitech-mat-" + sl.date + "-" + (sl.platform || "X") + "-" + sl.time; }
  // 材料の印は企画（schedule.json）の中に持つ。誰が押しても全員に見える。
  // 以前この端末にだけ残した印も、読むときは拾う
  function matGet(sl) {
    var m = {};
    try { m = JSON.parse(localStorage.getItem(matKey(sl)) || localStorage.getItem(matKeyOld(sl)) || "{}") || {}; } catch (e) {}
    if (sl.mat) { for (var mk0 in sl.mat) m[mk0] = sl.mat[mk0]; }
    // 原稿が入っていれば、テキストは用意できたものとして扱う。
    // 取り込んだ直後に押し直す手間をなくすため。外したいときは押せば消える
    if (m.text === undefined && sl.text && (sl.text.ja || sl.text.en || sl.text.ko)) m.text = true;
    return m;
  }
  function matSet(sl, kind, on) {
    sl.mat = sl.mat || {};
    sl.mat[kind] = on;
    saveSoon(function () { return saveSchedule("schedule: mat " + slotKey(sl)); }, 700);
  }
  function matReady(sl) {
    var m = matGet(sl), need = sl.need || ["text"];
    for (var i = 0; i < need.length; i++) { if (!m[need[i]]) return false; }
    return true;
  }

  function remindPrefs() {
    try { return JSON.parse(localStorage.getItem("remitech-remind") || "null") || { on:false, min:30 }; }
    catch (e) { return { on:false, min:30 }; }
  }
  function saveRemind(p) { try { localStorage.setItem("remitech-remind", JSON.stringify(p)); } catch (e) {} }

  var remindTimers = [];
  function armReminders(days) {
    remindTimers.forEach(clearTimeout); remindTimers = [];
    var p = remindPrefs();
    if (!p.on || !("Notification" in window) || Notification.permission !== "granted") return;
    var now = Date.now();
    days.forEach(function (d) {
      (schedule.slots || []).forEach(function (sl) {
        if (sl.date !== ymd(d) || sl.time.indexOf(":") < 0 || isPosted(sl)) return;
        var hh = sl.time.split(":");
        var at = new Date(d.getFullYear(), d.getMonth(), d.getDate(), +hh[0], +hh[1]).getTime()
                 - p.min * 60000;
        var wait = at - now;
        if (wait <= 0 || wait > 86400000) return;      // 24時間より先は張らない
        remindTimers.push(setTimeout(function () {
          try { new Notification("REMITECH", { body: sl.time + "  " + (sl.label || "") }); } catch (e) {}
        }, wait));
      });
    });
  }

  function slotState(sl, when, now) {
    if (sl.skip) return "skip";          // 投稿しないと決めた枠は、抜けにも未準備にも数えない
    if (isPosted(sl)) return "done";
    var hasText = sl.text && (sl.text.ja || sl.text.en || sl.text.ko);
    // 予約してあれば、時刻を過ぎても抜けではない（自動で出ているはず）。
    // 実際に出たかは照らしてから posted にする
    if (isSched(sl)) return "sched";
    if (when < now) return "late";              // 予約もされないまま時刻が過ぎた
    if (hasText && matReady(sl)) return "ready";  // 材料が揃った
    return hasText ? "text" : "none";
  }

  var DOW = { en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
              ko:["일","월","화","수","목","금","토"],
              ja:["日","月","火","水","木","金","土"] };

  function renderDash() {
    chansEl.hidden = true;
    if (!schedule) { view.innerHTML = '<p class="empty">' + esc(t("none")) + '</p>'; return; }

    var now = new Date();

    var counts = { none:0, text:0, ready:0, sched:0, done:0, late:0, skip:0 };

    // 行 = チャンネル × 定期の時刻
    var rows = [];
    var seen = {};
    function addRow(c, time, platform, label) {
      var k = c.id + "|" + platform + "|" + time;

    channels.forEach(function (c) {

    rows.sort(function (a, b) {
      var ai = channels.indexOf(a.ch), bi = channels.indexOf(b.ch);

              '<span class="rt">' + esc(row.time) + '</span>' +
              (row.label ? '<span class="rl">' + esc(tl(row.label)) + '</span>' : "") + '</th>';
      days.forEach(function (d) {
        var isToday = ymd(d) === ymd(now);
        var isWknd = (d.getDay() === 0 || d.getDay() === 6);
        var sl = (schedule.slots || []).filter(function (x) {
          return x.date === ymd(d) && x.time === row.time &&
                 (x.platform || "X") === (row.platform || "X") &&
                 slotCh(x) === row.ch.id;
        })[0];
        if (!sl) {
          body += '<td class="' + (isToday ? "todayc " : "") + (isWknd ? "wknd" : "") +
                  '"><span class="none">·</span></td>';
          return;
        }

        var hh = row.time.split(":");
        var when = new Date(d.getFullYear(), d.getMonth(), d.getDate(), +hh[0], +hh[1]);
        var st = slotState(sl, when, now);
        counts[st]++;
        var label = sl.label || ((sl.text && (sl.text[lang] || sl.text.en || sl.text.ja)) || "").split(NLC)[0];
        var mm = matGet(sl);
        // 材料は小さな四角にする。文字のボタンだと1行に14個並んで画面が埋まった
        var mats = (sl.need || ["text"]).map(function (k) {
          var on = !!mm[k];
          return '<button class="mt" data-on="' + on + '"' +
                 ' data-date="' + esc(sl.date) + '" data-pf="' + esc(sl.platform || "X") +
                 '" data-time="' + esc(sl.time) + '" data-kind="' + k + '"' +
                 ' title="' + esc(t(k === "text" ? "matText" : "matImage")) + '">' +
                 (k === "text" ? "T" : "I") + '</button>';
        }).join("");
        var ck = isChecked(sl) ? '<i class="ok">✓</i>' : "";
        body += '<td class="' + (isToday ? "todayc " : "") + (isWknd ? "wknd" : "") + '">' +
                '<div class="cell">' +
                  '<div class="mk" data-s="' + st + '">' +
                    esc(t("st" + st.charAt(0).toUpperCase() + st.slice(1))) + ck + '</div>' +
                  '<div class="cellfoot">' +
                    '<span class="lb2">' + esc(tl(label) || "—") + '</span>' +
                    '<span class="cellmats">' + mats + '</span>' +
                  '</div>' +
                '</div></td>';
      });
      body += "</tr>";
    });

    var need = counts.late + counts.none + counts.text;
    var rp = remindPrefs();
    var opts = [15, 30, 60, 120].map(function (v) {
      return '<option value="' + v + '"' + (rp.min === v ? " selected" : "") + '>' + v + "m</option>";
    }).join("");
    var ws = weekStart();
    var wsOpts = [1, 0, 6].map(function (v) {
      return '<option value="' + v + '"' + (ws === v ? " selected" : "") + '>' +
             (DOW[lang] || DOW.en)[v] + "</option>";
    }).join("");

    var sum = '<div class="sum"><p class="big">' +
      (need === 0 ? esc(t("ok")) : esc(t("todo")) + " \u00b7 " + need) + '</p>' +
      '<p class="rng">' + (days[0].getMonth()+1) + "/" + days[0].getDate() + " \u2013 " +
      (days[6].getMonth()+1) + "/" + days[6].getDate() +
      '\u3000' + esc(t("stLate")) + " " + counts.late +
      '\u3000' + esc(t("stNone")) + " " + counts.none +
      '\u3000' + esc(t("stText")) + " " + counts.text +
      '\u3000' + esc(t("stReady")) + " " + counts.ready +
      '\u3000' + esc(t("stSched")) + " " + counts.sched +
      '\u3000' + esc(t("stDone")) + " " + counts.done + '</p></div>';

    var bar = '<div class="rem">' +
      '<label class="mat" data-on="' + rp.on + '"><input type="checkbox" id="remOn"' +
      (rp.on ? " checked" : "") + '>' + esc(t("remind")) + '</label>' +
      '<select id="remMin">' + opts + '</select>' +
      '<span>' + esc(t("weekStart")) + '</span><select id="wsPick">' + wsOpts + '</select></div>';

    // スマホでは7列の表は画面の倍の幅になり、字も9pxまで小さくなった。
    // 同じ中身を「日ごとの縦の並び」でも作り、幅に応じてどちらかを見せる
    var ag = '<div class="agenda">';
    days.forEach(function (d) {
      var ds = ymd(d);
      var list = (schedule.slots || []).filter(function (x) { return x.date === ds; })
        .sort(function (a, b) { return (a.time + (a.platform || "")) < (b.time + (b.platform || "")) ? -1 : 1; });
      var isToday = ds === ymd(now);
      var open = (ds in agOpen) ? agOpen[ds] : isToday;
      ag += '<div class="agday' + (isToday ? " today" : "") + (open ? "" : " shut") + '"><p class="aghead" data-d="' + ds + '">' +
        '<span>' + (DOW[lang] || DOW.en)[d.getDay()] + '</span> ' + (d.getMonth() + 1) + "/" + d.getDate() +
        '<span class="agn">' + list.length + '</span></p>';
      if (!open) { ag += '</div>'; return; }
      if (!list.length) ag += '<p class="agnone">\u00b7</p>';
      list.forEach(function (sl) {
        var ch = chanOfSlot(sl);
        var hh = sl.time.split(":");
        var when = new Date(d.getFullYear(), d.getMonth(), d.getDate(), +hh[0], +hh[1]);
        var st = slotState(sl, when, now);
        var mm = matGet(sl);
        var label = sl.label || ((sl.text && (sl.text[lang] || sl.text.en || sl.text.ja)) || "").split(NLC)[0];
        var mats = (sl.need || ["text"]).map(function (k) {
          return '<button class="mt" data-on="' + (!!mm[k]) + '" data-date="' + esc(sl.date) +
                 '" data-pf="' + esc(sl.platform || "X") + '" data-time="' + esc(sl.time) +
                 '" data-kind="' + k + '">' + (k === "text" ? "T" : "I") + '</button>';
        }).join("");
        ag += '<div class="agrow" style="--chc:' + esc(ch.color || "var(--wood)") + '">' +
          '<div class="phead agmain" data-k="' + esc(slotKey(sl)) + '">' +
            '<span class="agtime">' + esc(sl.time) + '</span>' +
            '<span class="agwho">' + esc(ch.name) + ' <i>' + pfIco(sl.platform) + esc(pfn(sl.platform)) + '</i></span>' +
            '<span class="mk" data-s="' + st + '">' + esc(t("st" + st.charAt(0).toUpperCase() + st.slice(1))) + '</span>' +
            (label ? '<span class="aglabel">' + esc(tl(label)) + '</span>' : "") +
          '</div><span class="agmats">' + mats + '</span></div>';
      });
      ag += '</div>';
    });
    ag += '</div>';

    view.innerHTML = sum + bar +
      '<div class="gridwrap"><table class="grid"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>' + ag;
    armReminders(days);
  }

  // ---- 企画表の取り込み ----
  // サイトはファイルを書けないので、読み取って(1)この端末に反映し
  // (2)schedule.json として保存できるようにする
  var NLC = String.fromCharCode(10), TABC = String.fromCharCode(9);
  var CRC = String.fromCharCode(13), BSN = "\\" + "n";
  function thisMonth() {
    var d = new Date();
    return d.getFullYear() + "-" + two(d.getMonth() + 1);
  }

  var imported = null;

  function parseTSV(txt) {
    var lines = txt.split(CRC).join("").split(NLC).filter(function (l) { return l.trim(); });
    if (lines.length < 2) return null;
    var sep = (lines[0].indexOf(TABC) >= 0) ? TABC : ",";
    var head = lines[0].split(sep).map(function (h) { return h.trim().toLowerCase().replace(/^"|"$/g, ""); });
    if ((head.indexOf("day") < 0 && head.indexOf("date") < 0) || head.indexOf("time") < 0) return null;
    function col(r, name) { var i = head.indexOf(name); return i < 0 ? "" : (r[i] || "").trim(); }
    function un(v) { return v.split(BSN).join(NLC); }
    var out = [];
    for (var i = 1; i < lines.length; i++) {
      var r = lines[i].split(sep).map(function (v) { return v.replace(/^"|"$/g, ""); });
      var dt = col(r, "date");
      var tm = col(r, "time");
      if (!dt) {
        var dnum = parseInt(col(r, "day"), 10);
        if (dnum) dt = thisMonth() + "-" + (dnum < 10 ? "0" + dnum : dnum);
      }
      if (!dt || !tm) continue;
      var type = col(r, "type") || "text";
      var asset = col(r, "asset");
      out.push({
        date: dt, time: tm, platform: (col(r, "platform") || "X").toUpperCase(),
        type: type, label: col(r, "label"),
        text: { ja: un(col(r, "ja")), en: un(col(r, "en")), ko: un(col(r, "ko")) },
        asset: asset, note: "",
        need: (type === "image" || type === "video" || asset) ? ["text", "image"] : ["text"],
        scheduled: false, posted: false, url: "",
        check: { done: false, at: "", match: null, note: "" }
      });
    }
    return out.length ? out : null;
  }

  function renderImport() {
    chansEl.hidden = true;
    view.innerHTML = '<div class="imp">' +
      '<textarea id="impText" spellcheck="false" placeholder="' + esc(t("impPaste")) + '"></textarea>' +
      '<div class="bar">' +
        '<input type="url" id="impUrl" placeholder="' + esc(t("impUrl")) + '">' +
        '<label class="filebtn">' + esc(t("impFile")) +
        '<input type="file" id="impFile" accept=".tsv,.csv,.txt,.json,text/plain,application/json"></label>' +
      '</div>' +
      '<p class="out" id="impOut"></p>' +
      '<div class="bar" id="impActions" hidden>' +
        '<button id="impApply">' + esc(t("impApply")) + '</button>' +
        '<button id="impDl">' + esc(t("impDownload")) + '</button>' +
      '</div>' +
      '<p class="cols">' + esc(t("impCols")) + '</p>' +
      '<div class="store"><p class="hint">' + esc(t("storeTitle")) + '</p>' +
        '<input type="url" id="stUrl" placeholder="' + esc(t("storeUrl")) + '" value="' + esc(storeGet().url || "") + '">' +
        '<input type="password" id="stTok" placeholder="' + esc(t("storeTok")) + '" value="' + esc(storeGet().token || "") + '">' +
        '<div class="bar"><button id="stSave">' + esc(t("storeSave")) + '</button>' +
        '<span class="tiny" id="stOut"></span></div>' +
        '<p class="tiny">towananika/remitech · Fine-grained token · Contents: Read and write</p>' +
        '<p class="tiny">' + esc(t("localOnly")) + '</p></div></div>';
  }

  // 貼った時点で読む。押す手間をなくす
  function importRead(txt) {
    var out = document.getElementById("impOut");
    if (!txt || !txt.trim()) { imported = null; out.textContent = ""; return; }
    if (txt.trim().charAt(0) === "{") {           // schedule.json をそのまま受ける
      try {
        var j = JSON.parse(txt);
        imported = (j.slots || []).filter(function (x) { return x.date && x.time; });
      } catch (err) { imported = null; }
    } else {
      imported = parseTSV(txt);
    }
    out.textContent = imported && imported.length
      ? (imported.length + " " + t("impResult"))
      : t("impBad");
    var acts = document.getElementById("impActions");
    if (acts) acts.hidden = !(imported && imported.length);
  }

  // リンクから読む。ブラウザは他所のページを読めないことが多いので、
  // 読めなかったときは Claude に渡すよう伝える
  function importUrl(u) {
    var out = document.getElementById("impOut");
    out.textContent = t("loading");
    fetch(u, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (txt) {
        var ta = document.getElementById("impText");
        if (ta) ta.value = txt;
        importRead(txt);
      })
      .catch(function () { out.textContent = t("impUrlNo"); });
  }

  function importClick(e) {
    if (e.target.id === "stSave") {
      var u = document.getElementById("stUrl").value.trim()
        .replace(/^https?:\/\/github\.com\//i, "")
        .replace(/\.git$/i, "")
        .replace(/^\/+|\/+$/g, "");
      var tk = document.getElementById("stTok").value.trim();
      var o = document.getElementById("stOut");
      o.textContent = "…";
      document.getElementById("stUrl").value = u;
      storeSet({ url: u, token: tk });
      fetch("https://api.github.com/repos/" + u, {
        headers: { "Authorization": "Bearer " + tk, "Accept": "application/vnd.github+json" },
      }).then(function (r) {
        if (r.ok) { o.textContent = t("storeOk"); return; }
        return r.json().then(function (j) {
          o.textContent = t("storeNo") + " · " + r.status + " " + ((j && j.message) || "");
        }, function () { o.textContent = t("storeNo") + " · " + r.status; });
      }).catch(function (err) {
        o.textContent = t("storeNo") + " · " + String(err && err.message ? err.message : err);
      });
      return;
    }
    var out = document.getElementById("impOut");
    if (!imported || !imported.length) { out.textContent = t("impBad"); return; }
    var keep = [];
    if (schedule && schedule.slots) {          // いまの内容は必ず残す
      keep = schedule.slots.filter(function (x) {
        return !imported.some(function (y) {
          return y.date === x.date && y.time === x.time &&
                 (y.platform || "X") === (x.platform || "X");
        });
      });
    }
    var all = keep.concat(imported).sort(function (a, b) {
      return (a.date + a.time) < (b.date + b.time) ? -1 : 1;
    });
    var months = [];
    all.forEach(function (x) { var m = x.date.slice(0, 7); if (months.indexOf(m) < 0) months.push(m); });
    var body = { channel: schedule ? schedule.channel : "hiyoko",
                 months: months.sort(), timezone: "Asia/Seoul", note: "", slots: all };
    if (e.target.id === "impApply") {
      schedule = body;
      try { localStorage.setItem("remitech-schedule", JSON.stringify(body)); } catch (err) {}
      tab = "dash"; renderNav(); syncWide(); route();
      return;
    }
    if (e.target.id === "impDl") {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(body, null, 2)], { type: "application/json" }));
      a.download = "schedule.json";
      document.body.appendChild(a); a.click(); a.remove();
    }
  }

  // ---- 準備ボード ----
  // 投稿に使うものを1枚にまとめる。文面はそのまま写せる
  // 枠は自分の持ち主を持つ。無ければ既定のチャンネル
  function slotCh(sl) { return (sl && sl.channel) || schedule.channel || "hiyoko"; }
  function chanOfSlot(sl) {
    var chId = slotCh(sl);
    return chanOf(chId) || { name: chId, color: "var(--wood)" };
  }

  // 「今日」「明日」は使わない。見た人が数えなくて済むよう、日付そのものを出す
  function whenLabel(dt) {
    var d = new Date(dt + "T00:00:00");
    return (d.getMonth() + 1) + "/" + d.getDate() + " " + (DOW[lang] || DOW.en)[d.getDay()];
  }

  // 文面の箱。コピーは箱の中の右上に置く（下に並べると場所を食う）
  var copyBank = {};

  // Nobo Check の文があれば、それを実投稿用の文にする。無ければ普段どおり
  function textBox(id, cur, en, mk, pid, nobo, reviewed) {
    var useNobo = !!(nobo && nobo.trim());

  // 画像・動画は端末の保管庫に置く。置いてあるファイルは書き換えられないので、
  // みんなで共有するには Claude に渡してリポジトリに入れる必要がある
  var mediaDB = null;
  function openDB() {
    return new Promise(function (res, rej) {
      if (mediaDB) return res(mediaDB);
      var rq = indexedDB.open("remitech-media", 1);
      rq.onupgradeneeded = function () { rq.result.createObjectStore("files"); };
      rq.onsuccess = function () { mediaDB = rq.result; res(mediaDB); };
      rq.onerror = function () { rej(rq.error); };
    });
  }
  function dbPut(k, v) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction("files", "readwrite");
        tx.objectStore("files").put(v, k);
        tx.oncomplete = res; tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function dbGet(k) {
    return openDB().then(function (db) {
      return new Promise(function (res) {
        var rq = db.transaction("files", "readonly").objectStore("files").get(k);
        rq.onsuccess = function () { res(rq.result || null); };
        rq.onerror = function () { res(null); };
      });
    });
  }
  function dbDel(k) {
    return openDB().then(function (db) {
      return new Promise(function (res) {
        var tx = db.transaction("files", "readwrite");
        tx.objectStore("files").delete(k);
        tx.oncomplete = res; tx.onerror = res;
      });
    });
  }
  // 連投は1つずつ時間を空けて出す。抜けることもあるので、箱ごとに印を持つ
  function partsKey(mk) { return "remitech-part-" + mk; }
  // 各投稿の「投稿した ✓」と「画像は要らない」も企画の中に持つ
  function slotsByMedia(mk) {
    return (schedule && schedule.slots || []).filter(function (x) { return mediaKey(x) === mk; });
  }
  function partsGet(mk) {
    var o = {};
    try { o = JSON.parse(localStorage.getItem(partsKey(mk)) || "{}") || {}; } catch (e) {}
    slotsByMedia(mk).forEach(function (x) { if (x.pdone) { for (var k in x.pdone) o[k] = x.pdone[k]; } });
    return o;
  }
  function partsSet(mk, id, on) {
    var list = slotsByMedia(mk);
    list.forEach(function (x) { x.pdone = x.pdone || {}; x.pdone[id] = on; });
    if (list.length) saveSoon(function () { return saveSchedule("schedule: part " + mk + " " + id); }, 700);
  }

  // 置き場（Cloudflare R2 + Worker）。住所と合言葉は端末にだけ残す
  function storeGet() {
    try { return JSON.parse(localStorage.getItem("remitech-store") || "{}") || {}; } catch (e) { return {}; }
  }
  function storeSet(o) { try { localStorage.setItem("remitech-store", JSON.stringify(o)); } catch (e) {} }
  function storeOn() { var c = storeGet(); return !!(c.url && c.token); }

  // 置き場は GitHub のリポジトリ。カードの登録が要らず、
  // 入れたものはそのまま公開の住所で読めるので、投稿にも使える
  function ghPath(key, type) {
    var ext = (type || "").indexOf("video") === 0
      ? ((type.indexOf("quicktime") > 0) ? "mov" : "mp4")
      : ((type || "").split("/")[1] || "png").replace(/[^a-z0-9]/gi, "");
    // 時刻の「:」などは、そのままだと置き場やWindowsで扱えない。安全な字だけにする
    return "media/" + key.replace(/[^A-Za-z0-9._-]/g, "-") + "." + ext;
  }
  function ghUrl(repo, path) {
    var o = repo.split("/");
    return "https://" + o[0] + ".github.io/" + o[1] + "/" + path;
  }
  function toB64(file) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () { res(String(fr.result).split(",")[1]); };
      fr.onerror = rej;
      fr.readAsDataURL(file);
    });
  }
  function ghApi(c, path, opt) {
    return fetch("https://api.github.com/repos/" + c.url + "/contents/" + path, Object.assign({
      headers: {
        "Authorization": "Bearer " + c.token,
        "Accept": "application/vnd.github+json",
      },
    }, opt || {}));
  }
  function upload(key, file) {
    var c = storeGet(), path = ghPath(key, file.type);
    return toB64(file).then(function (b64) {
      // 同じ場所に既にあるなら、その印（sha）を添えて差し替える
      return ghApi(c, path).then(function (r) { return r.ok ? r.json() : null; })
        .then(function (prev) {
          return ghApi(c, path, {
            method: "PUT",
            headers: {
              "Authorization": "Bearer " + c.token,
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              message: "media: " + key,
              content: b64,
              sha: prev ? prev.sha : undefined,
            }),
          });
        });
    }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return { url: ghUrl(c.url, path) };
    });
  }
  function removeRemote(key, type) {
    var c = storeGet();
    if (!storeOn()) return Promise.resolve();
    var path = ghPath(key, type || "image/png");
    return ghApi(c, path).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (prev) {
        if (!prev) return;
        return ghApi(c, path, {
          method: "DELETE",
          headers: {
            "Authorization": "Bearer " + c.token,
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ message: "media: remove " + key, sha: prev.sha }),
        });
      }).catch(function () {});
  }

  // 企画そのものを書き戻す。鍵が入っていれば元のファイルへ、無ければ端末へ
  // 保存は1つずつ順番に書く。同時に2つ書くと、GitHub側で版が食い違って失敗する
  var saveChain = Promise.resolve();
  function saveSchedule(note) {
    saveBusy++;
    setSaveStat("saving");
    var run = saveChain.then(function () { return saveScheduleRaw(note); });
    saveChain = run.catch(function () {});
    return run.then(function (r) {
      saveBusy--; setSaveStat(r.where === "repo" ? "saved" : "local"); return r;
    }, function (err) {
      saveBusy--; setSaveStat("fail"); throw err;
    });
  }

  function saveScheduleRaw(note) {
    var body = {
      channel: schedule.channel, months: schedule.months,
      timezone: schedule.timezone, note: schedule.note,
      slots: schedule.slots, trash: schedule.trash || [], media: schedule.media || {}, holidays: schedule.holidays || {}, assignees: schedule.assignees || {},
    };
    body.months = [];
    schedule.slots.forEach(function (x) {
      var m = x.date.slice(0, 7);
      if (body.months.indexOf(m) < 0) body.months.push(m);
    });
    body.months.sort();

    var text = JSON.stringify(body, null, 2) + "\n";
    try { localStorage.setItem("remitech-schedule", text ? JSON.stringify(body) : "{}"); } catch (e) {}

    if (!storeOn()) return Promise.resolve({ where: "local" });

    var c = storeGet();
    return ghApi(c, "schedule.json").then(function (r) { return r.ok ? r.json() : null; })
      .then(function (prev) {
        // この端末が読み込んだ後に、他の端末が足したものが置き場にあるかもしれない。
        // SHAだけ見て中身を捨てると、それを消してしまう。中身も見て、無いものは足す
        if (prev) {
          try {
            var bin0 = atob((prev.content || "").replace(/\n/g, ""));
            var bytes0 = new Uint8Array(bin0.length);
            for (var i0 = 0; i0 < bin0.length; i0++) bytes0[i0] = bin0.charCodeAt(i0);
            var remote = JSON.parse(new TextDecoder("utf-8").decode(bytes0));
            var haveKey = {};
            body.slots.forEach(function (x) { haveKey[slotKey(x)] = x; });
            (remote.slots || []).forEach(function (x) {
              var mine = haveKey[slotKey(x)];
              if (!mine) { body.slots.push(x); haveKey[slotKey(x)] = x; return; }
              // 同じ企画を別の人も触っていたら、印は1項目ずつ合わせる（こちらが押したものが優先）
              ["pdone", "mat"].forEach(function (f) {
                if (!x[f]) return;
                var merged = {};
                for (var a1 in x[f]) merged[a1] = x[f][a1];
                if (mine[f]) { for (var a2 in mine[f]) merged[a2] = mine[f][a2]; }
                mine[f] = merged;
              });
            });
            var rm = remote.media || {}, mm2 = {};
            for (var r1 in rm) mm2[r1] = rm[r1];
            for (var r2 in body.media) mm2[r2] = body.media[r2];
            body.media = mm2;
            var rh = remote.holidays || {}, hh2 = {};
            for (var h1 in rh) hh2[h1] = rh[h1];
            for (var h2 in body.holidays) hh2[h2] = body.holidays[h2];
            body.holidays = hh2;
            var ra = remote.assignees || {}, aa2 = {};
            for (var a1 in ra) aa2[a1] = ra[a1];
            for (var a2 in body.assignees) aa2[a2] = body.assignees[a2];
            body.assignees = aa2;
            var haveTrash = {};
            body.trash.forEach(function (x) { haveTrash[slotKey(x)] = 1; });
            (remote.trash || []).forEach(function (x) {
              if (!haveTrash[slotKey(x)]) { body.trash.push(x); haveTrash[slotKey(x)] = 1; }
            });
            body.trash = body.trash.slice(-30);
          } catch (e) {}
        }
        text = JSON.stringify(body, null, 2) + "\n";
        schedule.slots = body.slots;      // 今のセッションも、足したぶんを覚えておく
        schedule.trash = body.trash;
        schedule.media = body.media;
        schedule.holidays = body.holidays;
        schedule.assignees = body.assignees;
        try { localStorage.setItem("remitech-schedule", JSON.stringify(body)); } catch (e) {}

        // 日本語をそのまま base64 にするため、いったんバイト列にする
        var bytes = new TextEncoder().encode(text);
        var bin = "";
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return ghApi(c, "schedule.json", {
          method: "PUT",
          headers: {
            "Authorization": "Bearer " + c.token,
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            message: note || "schedule: update",
            content: btoa(bin),
            sha: prev ? prev.sha : undefined,
          }),
        });
      }).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return { where: "repo" };
      });
  }

  // ファイルを1つ受け取る。置き場があれば上げ、無ければ端末に置く
  function takeFile(mk2, f2) {
    if (!f2 || !/^(image|video)\//.test(f2.type)) return Promise.resolve();
    var up = storeOn()
      ? upload(mk2, f2).then(function (r) { mediaPut(mk2, r.url); }).catch(function () {})
      : Promise.resolve();
    return up.then(function () {
      return dbPut(mk2, { blob: f2, type: f2.type, name: f2.name });
    }).then(function () {
      var base = mk2.split("#")[0];
      var pp = base.split("|");
      var sl3 = (schedule.slots || []).filter(function (x) {
        return x.date === pp[0] && (x.platform || "X") === pp[1] && x.time === pp[2];
      })[0];
      if (sl3) matSet(sl3, "image", true);
      prepAgain();
    });
  }

  // 画像の鍵。HIYOKO は以前からの形のまま（保管済みの画像を読めるように）。ほかはチャンネルを頭に付け、
  // 同じ日・同じSNS・同じ時間の別チャンネル（例: HIYOKO と REEL の IG 17:00）が画像や✓を共有しないようにする
  function mediaKey(sl) { var c = slotCh(sl); return (c === "hiyoko" ? "" : c + "|") + sl.date + "|" + (sl.platform || "X") + "|" + sl.time; }

  // 貼り終わったあとに、保管庫にあるものを差し込む
  function fillMedia() {
    var shared = mediaMap();
    [].forEach.call(document.querySelectorAll(".mediabox"), function (box) {
      var k = box.getAttribute("data-mk");
      if (shared[k]) {                       // 置き場にあるものは、どの端末からも見える
        var u = shared[k];
        var isV = /\.(mp4|mov|webm)$/i.test(u) || box.getAttribute("data-v") === "1";
        box.innerHTML = '<a class="mopen" href="' + u + '" target="_blank" rel="noopener">' +
          (isV ? '<video src="' + u + '" muted playsinline preload="metadata"></video>'
               : '<img src="' + u + '" alt="">') + '</a>' +
          '<button class="mdel" data-mk="' + k + '">×</button>' +
          '<span class="mtag">' + esc(t("onServer")) + '</span>';
        return;
      }
      dbGet(k).then(function (rec) {
        if (!rec) return;
        var url = URL.createObjectURL(rec.blob);
        var el = /^video/.test(rec.type)

  // よくある「1 … 4 5 [6] 7 8 … 20」の並びを作る
  function pageNums(cur, total) {
    var out = [], span = 1;
    for (var n = 1; n <= total; n++) {
      if (n === 1 || n === total || Math.abs(n - cur) <= span) out.push(n);
      else if (out[out.length - 1] !== "…") out.push("…");
    }
    return out;
  }

  // ---- 準備（仮）: Googleカレンダーのように、週を時刻の升目で見る ----
  // 縦が時刻、横が日。投稿は色の箱。企画がまだ無い日も、定期の枠が点線で出る。
  // 左のチェックでプロジェクトごとに隠せる（見る人ごとに記憶）
  var calView = null;       // "3day" | "week" | "month"
  var calAnchor = null;     // 見ている日 "YYYY-MM-DD"
  var calMonth = null;      // 月表示の月
  var calDay = null;        // 月表示で選んだ日
  var calSel = null;        // 週表示で押した箱
  var calGroups = {};
  var recurring = null;     // recurring.json
  var recurDraft = null;    // 定期の設定を編集中の写し
  var calHide = {};
  try { calHide = JSON.parse(localStorage.getItem("remitech-calhide") || "{}") || {}; } catch (e) {}

  function calVisible(ch) { return !calHide[ch]; }

  function calSlots(date) {
    return (schedule.slots || []).filter(function (x) {
      return x.date === date && calVisible(slotCh(x));
    }).sort(function (a, b) { return a.time < b.time ? -1 : 1; });
  }

  // その日に当てはまる定期の枠のうち、まだ企画が無いもの
  function calRecur(date) {
    if (!recurring || !recurring.rules) return [];
    var wd = new Date(date + "T00:00:00").getDay();
    var have = {};
    (schedule.slots || []).forEach(function (x) {
      if (x.date === date) have[slotCh(x) + "|" + (x.platform || "X") + "|" + x.time] = 1;
    });
    return recurring.rules.filter(function (r) {
      return (r.days || []).indexOf(wd) >= 0 && calVisible(r.channel) &&
             !have[r.channel + "|" + r.platform + "|" + r.time];
    }).map(function (r) {
      return { recur: true, date: date, channel: r.channel, platform: r.platform, time: r.time, label: r.label || "" };
    });
  }

  function evCh(ev) { return ev.recur ? ev.channel : slotCh(ev); }

  // 同じチャンネルで15分以内に続く投稿は、1つの箱にまとめる（17:00のX/IG/FBなど）
  function calGroupsFor(date) {
    var evs = calSlots(date).concat(calRecur(date)).sort(function (a, b) {
      return toMin(a.time) - toMin(b.time) || (evCh(a) < evCh(b) ? -1 : 1);
    });
    var groups = [];
    evs.forEach(function (ev) {
      var g = null;
      for (var i = groups.length - 1; i >= 0; i--) {
        if (groups[i].ch === evCh(ev) && toMin(ev.time) - groups[i].start <= 15) { g = groups[i]; break; }
      }
      if (!g) { g = { ch: evCh(ev), start: toMin(ev.time), evs: [] }; groups.push(g); }
      g.evs.push(ev);
    });
    groups.forEach(function (g) {
      g.end = Math.max(toMin(g.evs[g.evs.length - 1].time) + 25, g.start + 30);
    });
    // 重なる箱は横に並べる
    groups.sort(function (a, b) { return a.start - b.start; });
    var cluster = [], clEnd = -1;
    function flush() {
      var lanes = [];
      cluster.forEach(function (g) {
        var li = 0;
        while (lanes[li] !== undefined && lanes[li] > g.start) li++;
        lanes[li] = g.end; g.lane = li;
      });
      cluster.forEach(function (g) { g.lanes = lanes.length; });
      cluster = []; clEnd = -1;
    }
    groups.forEach(function (g) {
      if (cluster.length && g.start >= clEnd) flush();
      cluster.push(g); clEnd = Math.max(clEnd, g.end);
    });
    if (cluster.length) flush();
    return groups;
  }

    }
    return weekRange(an);

  function calWeekHTML(days) {
    var now = new Date();
    calGroups = {};
    var rowsSet = {};
    var perDay = days.map(function (d) {
      var gs = calGroupsFor(ymd(d));
      gs.forEach(function (g) { rowsSet[two(Math.floor(g.start / 60)) + ":" + two(g.start % 60)] = 1; });
      return gs;
    });
    var rows = Object.keys(rowsSet).sort(function (x, y) { return toMin(x) - toMin(y); });
    var nm = now.getHours() * 60 + now.getMinutes();
    var nextRow = null;
    for (var q = 0; q < rows.length; q++) { if (toMin(rows[q]) > nm) { nextRow = rows[q]; break; } }

    var head = '<tr><th class="gtcorner"></th>' + days.map(function (d) {
      var isT = ymd(d) === ymd(now);
      return '<th class="ghday' + (isT ? " today" : "") + '"><span>' + (DOW[lang] || DOW.en)[d.getDay()] +
             '</span><b>' + d.getDate() + '</b></th>';
    }).join("") + '</tr>';

    var body = "";
    rows.forEach(function (rt) {
      body += '<tr><th class="gtime">' + esc(rt) + '</th>';
      days.forEach(function (d, di) {
        var ds = ymd(d);
        var isT = ds === ymd(now);
        var cell = "";
        perDay[di].forEach(function (g, gi) {
          if (two(Math.floor(g.start / 60)) + ":" + two(g.start % 60) !== rt) return;
          var key = ds + "#" + gi;
          calGroups[key] = g;
          var c = chanOf(g.ch) || { name: g.ch, color: "var(--wood)" };
          var onlyRecur = g.evs.every(function (e) { return e.recur; });
          var pfs = [];
          g.evs.forEach(function (e) { var v = PF_SHORT[e.platform] || e.platform; if (pfs.indexOf(v) < 0) pfs.push(v); });
          var st = "";
          if (!onlyRecur) {
            var sl0 = g.evs.filter(function (e) { return !e.recur; })[0];
            var hh = sl0.time.split(":");
            st = slotState(sl0, new Date(d.getFullYear(), d.getMonth(), d.getDate(), +hh[0], +hh[1]), now);
          }
          var tip = c.name + " " + g.evs.map(function (e) { return e.time + " " + pfn(e.platform) + (e.label ? " " + tl(e.label) : ""); }).join(" / ");
          cell += '<button class="gev' + (onlyRecur ? " recur" : "") + (calSel === key ? " sel" : "") +
            '" data-g="' + key + '" data-s="' + st + '" title="' + esc(tip) + '" style="--chc:' +
            esc(c.color || "var(--wood)") + '"><b>' + esc(chShort(g.ch)) + '</b> ' + esc(pfs.join(" ")) + '</button>';
        });
        body += '<td class="gcell' + (isT ? " today" : "") + (isT && rt === nextRow ? " gnowabove" : "") + '">' + cell + '</td>';
      });
      body += '</tr>';
    });
    if (!rows.length) body = '<tr><td colspan="' + (days.length + 1) + '"><p class="empty">' + esc(t("calNone")) + '</p></td></tr>';

    var html = '<div class="gwrap"><table class="gtab"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';

    // 押した箱の中身
    if (calSel && calGroups[calSel]) {
      var g2 = calGroups[calSel];
      html += '<div class="calday"><p class="plabel">' + esc(whenLabel(calSel.split("#")[0])) + '</p>';
      g2.evs.forEach(function (ev, i) {
        if (!ev.recur) { html += '<div class="pcard">' + prepHeadHTML(ev, i) + '</div>'; return; }
        var c = chanOf(ev.channel) || { name: ev.channel, color: "var(--wood)" };
        html += '<div class="pcard grecur" style="--chc:' + esc(c.color || "var(--wood)") + '">' +
          '<div class="phead snhead"><i class="pf">' + pfIco(ev.platform) + esc(pfn(ev.platform)) + '</i>' +
          '<span class="who">' + esc(c.name) + '</span><span class="when">' + esc(ev.time) +
          (ev.label ? " \u00b7 " + esc(tl(ev.label)) : "") + '</span>' +
          '<span class="ovtag">' + esc(t("gRecurTag")) + '</span>' +
          '<button class="donebtn gmake" data-date="' + esc(ev.date) + '" data-ch="' + esc(ev.channel) +
          '" data-pf="' + esc(ev.platform) + '" data-time="' + esc(ev.time) + '" data-label="' + esc(ev.label) + '">' +
          '\uff0b ' + esc(t("gMake")) + '</button></div></div>';
      });
      html += '</div>';
    }
    return html;
  }

  function calMonthHTML() {
    var now = new Date();
    if (!calMonth) calMonth = calAnchor.slice(0, 7);
    if (!calDay) calDay = calAnchor;
    var y = +calMonth.slice(0, 4), mo = +calMonth.slice(5, 7) - 1;
    var first = new Date(y, mo, 1);
    var back = (first.getDay() - weekStart() + 7) % 7;
    var start = new Date(first); start.setDate(1 - back);
    var html = '<div class="calgrid">';
    for (var w = 0; w < 7; w++) {
      var dw = (weekStart() + w) % 7;
      html += '<div class="calhd' + ((dw === 0 || dw === 6) ? " wknd" : "") + '">' + (DOW[lang] || DOW.en)[dw] + '</div>';
    }
    for (var i = 0; i < 42; i++) {
      var d = new Date(start); d.setDate(start.getDate() + i);
      var ds = ymd(d);
      var outside = d.getMonth() !== mo;
      if (outside && i >= 35) continue;
      var list = calSlots(ds), rec = calRecur(ds);
      var ready = 0;
      list.forEach(function (sl) {
        var hh2 = sl.time.split(":");
        var s2 = slotState(sl, new Date(d.getFullYear(), d.getMonth(), d.getDate(), +hh2[0], +hh2[1]), now);
        if (s2 === "ready" || s2 === "sched" || s2 === "done" || s2 === "skip") ready++;
      });
      var title = "";
      for (var q = 0; q < list.length; q++) {
        var lb = list[q].label || ((list[q].text && (list[q].text[lang] || list[q].text.en || list[q].text.ja)) || "").split(NLC)[0];
        if (lb) { title = lb; break; }
      }
      var chs = {};
      list.forEach(function (sl) { chs[slotCh(sl)] = chanOfSlot(sl).color || "var(--wood)"; });
      rec.forEach(function (r) { if (!chs[r.channel]) chs[r.channel] = (chanOf(r.channel) || {}).color || "var(--wood)"; });
      var bars = Object.keys(chs).map(function (k) { return '<i class="calbar1" style="background:' + esc(chs[k]) + '"></i>'; }).join("");
      var n = list.length + rec.length;
      html += '<div class="calcell' + (outside ? " out" : "") + (ds === ymd(now) ? " today" : "") +
        (ds === calDay ? " sel" : "") + '" data-d="' + ds + '"><span class="caltop"><span class="caldnum">' + d.getDate() + '</span>' +
        (n ? '<span class="calcount" data-full="' + (n > 0 && ready === n) + '">' + ready + "/" + n + '</span>' : "") +
        '</span>' + (bars ? '<span class="calbars">' + bars + '</span>' : "") +
        (title ? '<span class="caltitle">' + esc(title) + '</span>' : "") + '</div>';
    }
    html += '</div>';
    var picked = calSlots(calDay), pr = calRecur(calDay);
    html += '<div class="calday"><p class="plabel">' + esc(whenLabel(calDay)) + '</p>';
    if (!picked.length && !pr.length) html += '<p class="empty">' + esc(t("calNone")) + '</p>';
    picked.forEach(function (sl, i) { html += '<div class="pcard">' + prepHeadHTML(sl, i) + '</div>'; });
    pr.forEach(function (ev) {
      var c = chanOf(ev.channel) || { name: ev.channel, color: "var(--wood)" };
      html += '<div class="pcard grecur" style="--chc:' + esc(c.color || "var(--wood)") + '">' +
        '<div class="phead snhead"><i class="pf">' + pfIco(ev.platform) + esc(pfn(ev.platform)) + '</i><span class="who">' + esc(c.name) +
        '</span><span class="when">' + esc(ev.time) + (ev.label ? " \u00b7 " + esc(tl(ev.label)) : "") + '</span>' +
        '<span class="ovtag">' + esc(t("gRecurTag")) + '</span>' +
        '<button class="donebtn gmake" data-date="' + esc(ev.date) + '" data-ch="' + esc(ev.channel) +
        '" data-pf="' + esc(ev.platform) + '" data-time="' + esc(ev.time) + '" data-label="' + esc(ev.label) + '">' +
        '\uff0b ' + esc(t("gMake")) + '</button></div></div>';
    });
    return html + '</div>';
  }

  // 定期の設定。編集は写しに対して行い、「保存」で recurring.json へ書く

      }).join("");

    rules.forEach(function (r, i) {

        }).join("") + '</span>' +

        '<button class="gdel" aria-label="delete">\u00d7</button></div>';
    });
    html += '<div class="bar"><button class="donebtn" id="gRuleAdd">\uff0b ' + esc(t("gAddRule")) + '</button>' +
      '<button class="donebtn strong" id="gRuleSave">' + esc(t("save")) + '</button>' +
      '<button class="donebtn" id="gRuleClose">' + esc(t("gClose")) + '</button>' +
      '<span class="tiny" id="gRuleOut"></span></div></div>';
    return html;

  function ghSaveJson(path, obj, msg) {
    if (!storeOn()) return Promise.resolve({ where: "local" });
    var c = storeGet();
    return ghApi(c, path).then(function (r) { return r.ok ? r.json() : null; }).then(function (prev) {
      var bytes = new TextEncoder().encode(JSON.stringify(obj, null, 2) + "\n");
      var bin = "";
      for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return ghApi(c, path, {
        method: "PUT",
        headers: { "Authorization": "Bearer " + c.token, "Accept": "application/vnd.github+json", "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg, content: btoa(bin), sha: prev ? prev.sha : undefined }),
      });
    }).then(function (r) { if (!r.ok) throw new Error(r.status); return { where: "repo" }; });
  }

  function renderPrep2() {
    chansEl.hidden = true;
    if (!schedule) { view.innerHTML = '<p class="empty">' + esc(t("none")) + '</p>'; return; }
    if (!calView) calView = window.innerWidth < 640 ? "3day" : "week";
    if (!calAnchor) calAnchor = ymd(new Date());

    var main;
    if (recurDraft) {
      main = calToolbar(t("gRecurTitle")) + calRecurHTML();
    } else if (calView === "month") {
      calMonth = calMonth || calAnchor.slice(0, 7);
      main = calToolbar(calMonth.replace("-", " / ")) + calMonthHTML();
    } else {
      var days = calRange();
      main = calToolbar(calTitle(days)) + calWeekHTML(days);
    }
    view.innerHTML = '<div class="gcal">' + calSide() + '<section class="gmain">' + main + '</section></div>';
  }

  function renderPrep() {
    chansEl.hidden = false;
    if (!schedule) { view.innerHTML = '<p class="empty">' + esc(t("none")) + '</p>'; return; }

    var now = new Date();
    var from = ymd(now);
    var till = new Date(now); till.setDate(till.getDate() + 6);
    var to = ymd(till);

    var chId = schedule.channel || "hiyoko";
    var q = prepSearch.trim().toLowerCase();
    // 検索しているときは、今週に絞らず全部から探す。そうでなければ今週だけ
    var list = (schedule.slots || []).filter(function (x) {
      if (filter && slotCh(x) !== filter) return false;
      if (q) return true;
      // 終わったものも残す。あとから見返せるように
      return x.date >= from && x.date <= to;
    }).filter(function (x) {
      if (!q) return true;
      var hay = [
        x.date, x.time, x.label, x.comment, pfn(x.platform),
        (chanOfSlot(x) || {}).name,
        x.text && x.text.en, x.text && x.text.ja, x.text && x.text.ko,
        (x.parts || []).map(function (p) { return p.en + " " + p.ja + " " + (p.no || ""); }).join(" "),
      ].filter(Boolean).join(" ").toLowerCase();
      return hay.indexOf(q) >= 0;
    }).sort(function (a, b) {
      return (a.date + a.time) < (b.date + b.time) ? -1 : 1;
    });

    copyBank = {};

    if (editing) {
      view.innerHTML = editForm();
      return;
    }

    var html = '<div class="prep">' +
      '<div class="bar newbar">' +
      '<div class="searchbox">' +
        '<input type="search" id="prepSearch" placeholder="' + esc(t("searchPh")) + '" value="' + esc(prepSearch) + '">' +
        (prepSearch ? '<button id="prepSearchX" class="searchclr" aria-label="clear">×</button>' : "") +
      '</div>' +
      '<button id="newSlot" class="donebtn strong">' + esc(t("newSlot")) + '</button></div>';

    // チャンネルごとの定型文（押すと写せる）
    channels.forEach(function (c) {
      if (filter !== c.id) return;        // 全体では出さない。選んだときだけ
      (c.snippets || []).forEach(function (sn, si) {
        if (sn.hidden) return;   // 使わなくなった枠（データは残す）
        html += '<div class="snip" style="--chc:' + esc(c.color || "var(--wood)") + '">' +
          '<div class="phead snhead"><span class="who">' + esc(c.name) + '</span>' +
          '<span class="when">' + esc(tl(sn.title || "")) + '</span></div>' +
          (sn.url ? '<div class="snurl"><code>' + esc(sn.url) + '</code>' +
            '<button class="cpy" data-ck="sn' + si + 'u" data-lg="en">' + esc(t("copy")) + '</button></div>' : "") +
          ((sn.items && sn.items.length > 1)
            ? '<div class="snpick"><button class="cpy" data-ck="sn' + si + 'r" data-lg="en">' +
              esc(t("pickOne")) + ' ↻</button><span class="snpicked"></span></div>' : "") +
          '<div class="snlist">' + (sn.items || []).map(function (it, k) {
            copyBank["sn" + si + "_" + k] = { en: it, cur: it };
            var over = sn.max && it.length > sn.max;
            return '<button class="snitem' + (over ? ' over' : '') + '" data-ck="sn' + si + "_" + k + '" data-lg="en" data-n="' + it.length + '"' +
              (over ? ' title="' + esc(sn.max + t("snOver")) + '"' : '') + '>' + esc(it) + '</button>';
          }).join("") + '</div></div>';
        if (sn.url) copyBank["sn" + si + "u"] = { en: sn.url, cur: sn.url };
        // 「どれか1つ」は押すたびに選び直す。文字数の上限（max）を超える文は引かない（IGのリンクボタンは25字まで・2026-10-05）
        if (sn.items && sn.items.length) {
          var pool = sn.items.filter(function (it) { return !sn.max || it.length <= sn.max; });
          copyBank["sn" + si + "r"] = { pick: pool.length ? pool : sn.items.slice(), max: sn.max || 0 };
        }
      });
    });
    // 悠悠観音堂は社内の企画（投稿文・画像プロンプト）を、ログインした社内の人にだけ出す（2026-10-08）
    if (filter === "ret" && !q) { view.innerHTML = html + retInternalHTML() + "</div>"; return; }
    if (filter === "yuyu" && !q) { var yc = chanOf("yuyu"); if (yc) html += yuInternalHTML(yc); }
    if (!list.length) {
      view.innerHTML = html + '<p class="empty">' + esc(q ? t("noMatch") : t("prepEmpty")) + '</p></div>';
      return;
    }

    // ページ数で行き来できるようにする。多いと読みにくいので、1ページぶんだけ出す
    var totalPages = Math.max(1, Math.ceil(list.length / PREP_PAGE_SIZE));
    if (prepPage > totalPages) prepPage = totalPages;
    if (prepPage < 1) prepPage = 1;
    var pgFrom = (prepPage - 1) * PREP_PAGE_SIZE + 1;
    var pgTo = Math.min(list.length, prepPage * PREP_PAGE_SIZE);
    var pageList = list.slice((prepPage - 1) * PREP_PAGE_SIZE, prepPage * PREP_PAGE_SIZE);

    html += '<p class="resultcount">' + pgFrom + '–' + pgTo + ' / ' + list.length + '</p>';

    // 一覧では見出し行だけ。タップすると専用ページへ
    pageList.forEach(function (sl, i) {
      html += '<div class="pcard">' + prepHeadHTML(sl, i) + '</div>';
    });

    if (totalPages > 1) {
      html += '<div class="pager">' +
        '<button class="pgbtn pgnav" data-pg="' + (prepPage - 1) + '"' +
          (prepPage <= 1 ? ' disabled' : '') + '>‹ ' + esc(t("pgPrev")) + '</button>' +
        '<span class="pgnums">' + pageNums(prepPage, totalPages).map(function (n) {
          return n === "…"
            ? '<span class="pgdots">…</span>'
            : '<button class="pgbtn' + (n === prepPage ? ' pgcur' : '') + '" data-pg="' + n + '">' + n + '</button>';
        }).join("") + '</span>' +
        '<button class="pgbtn pgnav" data-pg="' + (prepPage + 1) + '"' +
          (prepPage >= totalPages ? ' disabled' : '') + '>' + esc(t("pgNext")) + ' ›</button>' +
      '</div>';
    }

    var tr = (schedule.trash || []).slice().reverse();
    html += '<div class="trash"><p class="plabel">' + esc(t("trash")) + '</p>' +
      (tr.length
        ? tr.map(function (x) {
            return '<div class="trow"><span class="tiny">' + esc(x.date) + " · " +
              pfIco(x.platform) + esc(pfn(x.platform)) + " · " + esc(x.time) +
              (x.label ? " · " + esc(tl(x.label)) : "") + '</span>' +
              '<button class="donebtn restore" data-k="' + esc(slotKey(x)) + '">' +
              esc(t("restore")) + '</button></div>';
          }).join("")
        : '<p class="tiny">' + esc(t("emptyTrash")) + '</p>') +
      '</div><div class="disk" id="diskBox" hidden></div>';

    view.innerHTML = html + '</div>';
    renderDisk();
    fillMedia();
  }

  // ---- 予約状況 ----
  // その日、全部のチャンネルが用意できているかを1目で見る。
  // 表にせず、日ごとの札にしてスマホでも縦に読めるようにする
  /* 予約タブ。行＝予約する中身（book_rows.json、元はスプレッドシート）、列＝月〜日。
     マスの状態は schedule.json の枠から出す。枠がない行は押せない（間違った枠を作らないため） */
  var bookRows = null, bkMon = null;
  // 予約タブの表示（2026-10-19 Hibiki指定）: "week" は週別、"recent" は左に昨日・右に今日からの2週（14日）
  var bkView = "week";
  try { if (localStorage.getItem("remitech-bk-view") === "recent") bkView = "recent"; } catch (e) {}
  // 予約タブの印（予約・返信・準備中・休日・担当者・作った枠）はサーバーにも置き、どの端末でも同じ画面にする。
  // schedule.json が土台で、サーバーの印を上に重ねる
  // 置き場の住所は、いいね作業と同じサーバーの /book。呼ぶときに決める（読み込み順に左右されないように）
  function bookApi() { return String(CHORE_API).replace(/\/chores$/, "/book"); }
  var bkOut = "";
  function bookPush(kind, key, value) {
    var code = teamCode();
    return fetch(bookApi(), { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ kind: kind, key: key, value: value, code: code }) })
      .then(function (r) {
        if (r.status === 429) bkOut = t("lkTooMany");
        else if (r.status === 403) { setTeamCode(""); editLocked = true; bkOut = t("lkCodeHint"); if (tab === "book") renderBook(); }
        else bkOut = r.ok ? t("bkShared") : t("bkOffline");
      }, function () { bkOut = t("bkOffline"); })
      .then(function () { var o = document.getElementById("bkOut"); if (o) o.textContent = bkOut; });
  }
  // 行に貼るリンク（投稿の確認・返信で、すぐそのページへ飛ぶ）。
  // 2026-09-17: 行見出しブロックのタップは廃止。通常の予約ボタンの長押し＋上ドラッグだけで扱う（bkGesture参照）
  function bkRowKey(g, r) {
    return r.check || (g.channel + "|" + (r.platforms || []).join("-") + "|" + String(r.time || "").replace(":", "") + "|" + (r.reply ? "r" : "p"));
  }
  function bkDateLinkKey(rk, k) { return k + "|" + rk; }
  // ===== 行の非表示（2026-09-23）。隠す行はサーバー(kind v の rows)に置き、どの端末でも同じ =====
  var bkRowsOpen = false;
  function bkHidden() { return (schedule && Array.isArray(schedule.bkHideRows)) ? schedule.bkHideRows : []; }
  function bkRowHidden(rk) { return bkHidden().indexOf(rk) >= 0; }
  function bkRowSetHidden(rk, hide) {
    var list = bkHidden().slice(), i = list.indexOf(rk);
    if (hide && i < 0) list.push(rk);
    else if (!hide && i >= 0) list.splice(i, 1);
    else return;
    schedule.bkHideRows = list;
    bkPending["v|rows"] = 1;
    bookPush("v", "rows", list).then(function () { delete bkPending["v|rows"]; });
  }
  // 画面で足した行（サーバー kind w の rows）。企画ファイル（book_rows.json）の行のあとに並べる
  var bkAddOpen = "", bkAddMsg = "";
  function bkAdded() { return (schedule && Array.isArray(schedule.bkAddRows)) ? schedule.bkAddRows : []; }
  var bkAddedCache = { src: null, rows: [] };
