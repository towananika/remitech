<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REMITECH HUB</title>
<meta name="description" content="Source of truth for everything we post.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500&family=Shippori+Mincho:wght@500&display=swap">
<style>
  :root{
    --bg:#f5f1e9; --surface:#fbf9f4; --line:#e2dac8;
    --ink:#231f1a; --muted:#645c4e; --wood:#93704b; --wood-soft:#ece1d0; --sage:#7d8c6a; --todaybg:#f3ebdd; --wkndbg:#f2efe7;
    --mincho:"Shippori Mincho","Hiragino Mincho ProN",serif;
    --gothic:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#1c1a16; --surface:#242119; --line:#38332a;
    --ink:#f2eee5; --muted:#b6ad99; --wood:#c99f74; --wood-soft:#382d20; --sage:#9aab84; --todaybg:#2b2318; --wkndbg:#221f19;
  }}
  :root[data-theme="dark"]{
    --bg:#1c1a16; --surface:#242119; --line:#38332a;
    --ink:#f2eee5; --muted:#b6ad99; --wood:#c99f74; --wood-soft:#382d20; --sage:#9aab84; --todaybg:#2b2318; --wkndbg:#221f19;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--gothic); font-weight:400; line-height:1.8;
    -webkit-font-smoothing:antialiased;
  }
  .page{ width:100%; max-width:660px; margin:0 auto; padding:40px 20px 72px; }
  /* 週表は横に長いので、広い画面では枠を広げる。読みものは狭いままにする */
  body[data-wide="true"] .page{ max-width:1180px; }
  body[data-wide="true"] .sum,
  body[data-wide="true"] .rem{ max-width:none; }
  .list, .post, .imp{ max-width:660px; }

  /* ---- header ---- */
  .top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .brand{ margin:0 0 2px; font-size:10px; letter-spacing:.34em; text-indent:.34em;
          color:var(--muted); }
  h1{ margin:0; font-family:var(--mincho); font-weight:500;
      font-size:22px; letter-spacing:.4em; text-indent:.4em; }
  .tagline{ margin:6px 0 0; font-size:13px; color:var(--muted); letter-spacing:.04em; }
  .lang{ display:flex; gap:4px; flex:0 0 auto; }
  .lang{ align-items:center; }
  .pill{
    background:var(--surface); border:1px solid var(--line); border-radius:999px;
    color:var(--ink); font:inherit; font-size:12px; letter-spacing:.06em;
    padding:5px 12px; cursor:pointer; min-width:52px;
  }
  .pill:hover{ border-color:var(--wood); }
  .theme{
    background:var(--surface); border:1px solid var(--line); border-radius:999px;
    color:var(--ink); font:inherit; font-size:13px; line-height:1;
    width:32px; height:28px; cursor:pointer; padding:0;
  }
  .theme:hover{ border-color:var(--wood); }

  /* 状態は色と形の両方で示す。英語が読めなくても区別がつくように */
  .dot{ width:6px; height:6px; border-radius:50%; flex:0 0 auto; }
  .dot[data-status="draft"]{ background:var(--wood); }
  .dot[data-status="live"]{ background:var(--sage, #7d8c6a); }

  /* 更新のお知らせ。作業中に邪魔しないよう、上に細く出すだけ */
  .toast{
    position:fixed; top:10px; right:12px;
    display:flex; align-items:center; gap:12px; z-index:50;
    background:var(--surface); border:1px solid var(--wood); border-radius:999px;
    padding:6px 6px 6px 14px; font-size:12px; color:var(--ink); opacity:.96;
    box-shadow:0 2px 12px rgba(0,0,0,.10); max-width:calc(100vw - 24px);
  }
  .toast[hidden]{ display:none; }
  .toast button{
    background:var(--wood); border:0; border-radius:999px; color:var(--surface);
    font:inherit; font-size:12px; padding:5px 12px; cursor:pointer;
  }
  .toast .x{ background:none; color:var(--muted); padding:5px 8px; }

  /* 上へ戻る。長い週表や準備ボードで下まで行くと出る */
  .totop{
    position:fixed; right:16px; bottom:16px; z-index:40;
    width:40px; height:40px; border-radius:50%;
    background:var(--surface); border:1px solid var(--line); color:var(--ink);
    font:inherit; font-size:16px; line-height:1; cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.10);
    opacity:0; transform:translateY(6px); transition:opacity .18s ease, transform .18s ease;
  }
  .totop[hidden]{ display:none; }
  .totop[data-in="true"]{ opacity:.95; transform:translateY(0); }
  .totop:hover{ border-color:var(--wood); color:var(--wood); }
  @media (prefers-reduced-motion:reduce){ .totop{ transition:none } }

  /* ---- nav ---- */
  .nav{ display:flex; gap:4px; margin:24px 0 4px; }
  .nav button{
    background:none; border:0; border-bottom:2px solid transparent;
    color:var(--muted); font:inherit; font-size:14px; padding:6px 2px; margin-right:16px;
    cursor:pointer;
  }
  .nav button[aria-pressed="true"]{ color:var(--ink); border-bottom-color:var(--wood); }

  /* ---- KPI ---- */
  .kpi{ max-width:640px; }
  .kcard{
    border:1px solid var(--line); border-left:3px solid var(--chc, var(--wood));
    border-radius:14px; background:var(--surface); padding:14px 16px; margin-bottom:10px;
  }
  .khead{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .khead .who{ font-weight:500; font-size:13.5px; color:var(--chc, var(--ink)); }
  .khead .kdate{ margin-left:auto; font-size:11px; color:var(--muted);
                 font-variant-numeric:tabular-nums; }
  .kbody{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; }
  .kmain{ flex:0 0 auto; }
  .kmain .lbl{ display:block; font-size:11.5px; color:var(--muted); letter-spacing:.04em; }
  .kmain .val{ font-size:26px; font-weight:500; font-variant-numeric:tabular-nums; line-height:1.2; }
  .kmain .dif{ font-size:12px; margin-left:7px; font-variant-numeric:tabular-nums; }
  .kmain .dif[data-up="true"]{ color:var(--sage); }
  .kmain .dif[data-up="false"]{ color:#b4553f; }
  .kchart{ flex:1 1 120px; max-width:180px; height:40px; }
  .spark{ width:100%; height:40px; display:block; overflow:visible; }
  .spark .sl{ fill:none; stroke:var(--chc, var(--wood)); stroke-width:1.5;
              stroke-linecap:round; stroke-linejoin:round; }
  .spark .sa{ fill:var(--chc, var(--wood)); opacity:.10; stroke:none; }
  .spark .sd{ fill:var(--chc, var(--wood)); }
  .ksub{ margin:10px 0 0; font-size:12px; color:var(--muted); }

  /* ---- booking board ---- */
  .book{ max-width:560px; }
  .bday{
    border:1px solid var(--line); border-radius:14px; background:var(--surface);
    padding:14px 16px; margin-bottom:10px;
  }
  .bday.today{ border-color:var(--wood); }
  .bday.past{ opacity:.62; }
  .bhead{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .bhead .d{ font-size:15px; font-weight:500; font-variant-numeric:tabular-nums; }
  .bhead .w{ font-size:12px; color:var(--muted); }
  .bhead .v{ font-size:12px; }
  .bhead .v[data-ok="true"]{ color:var(--sage); }
  .bhead .v[data-ok="false"]{ color:var(--wood); }
  .bhead .v[data-ok="late"]{ color:#b4553f; }
  .brow{ display:flex; align-items:center; gap:8px; margin-top:9px; }
  .brow .nm{ font-size:12.5px; color:var(--chc, var(--ink)); flex:0 0 84px;
             overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pips{ display:flex; gap:4px; flex-wrap:wrap; }
  .pip{
    display:inline-flex; align-items:center; gap:3px;
    font-size:10.5px; border:1px solid var(--line); border-radius:999px;
    padding:2px 7px; color:var(--muted); white-space:nowrap;
  }
  .pip b{ font-weight:500; font-variant-numeric:tabular-nums; }
  .pip[data-s="sched"]{ color:var(--ink); border-color:var(--ink); }
  .pip[data-s="done"]{ color:var(--surface); background:var(--sage); border-color:var(--sage); }
  .pip[data-s="late"]{ color:var(--surface); background:#b4553f; border-color:#b4553f; }
  .pip[data-s="ready"]{ color:var(--surface); background:var(--wood); border-color:var(--wood); }
  .pip[data-s="text"]{ color:var(--wood); border-color:var(--wood); }

  /* ---- prep board ---- */
  .prep{ max-width:760px; }
  .snip{
    border:1px solid var(--line); border-left:3px solid var(--chc, var(--wood));
    border-radius:14px; background:var(--surface); padding:14px 16px; margin-bottom:12px;
  }
  .snhead{ cursor:default; margin-bottom:10px; }
  .snurl{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .snurl code{
    flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-size:12.5px; color:var(--ink);
    background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 10px;
  }
  .newbar{ margin-bottom:14px; }
  .ptitle{ display:flex; align-items:center; gap:8px; margin:0 0 10px;
           border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .ptitle .tlab{ font-size:11px; color:var(--muted); letter-spacing:.06em; flex:0 0 auto; }
  .ptitle .tval{ flex:1 1 auto; min-width:0; font-size:13.5px; color:var(--ink); }
  .trash{ margin-top:26px; border-top:1px solid var(--line); padding-top:14px; }
  .trow{ display:flex; align-items:center; justify-content:space-between; gap:10px;
         padding:6px 0; border-bottom:1px solid var(--line); }
  .trow:last-child{ border-bottom:0; }
  .disk{ margin-top:18px; }
  .disk[data-warn="true"]{
    border:1px solid var(--wood); border-radius:12px; padding:12px 14px; background:var(--wood-soft);
  }
  .dtitle{ margin:0 0 6px; font-size:13px; font-weight:500; color:var(--wood); }
  .dlist{ margin:0 0 10px; padding-left:18px; font-size:12.5px; line-height:1.9; }
  .powner{ display:flex; align-items:center; gap:8px; }
  .powner select{
    font:inherit; font-size:12px; color:var(--ink);
    background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:4px 8px;
  }
  .powner select:focus{ outline:none; border-color:var(--wood); }
  .editbar{ margin-top:10px; }
  .donebtn.strong{ color:var(--surface); background:var(--wood); border-color:var(--wood); }
  .editor{
    border:1px solid var(--line); border-radius:14px; background:var(--surface);
    padding:16px 18px; max-width:760px;
  }
  .frow{ display:block; margin-bottom:12px; }
  .frow > span{ display:block; font-size:11.5px; color:var(--muted); margin-bottom:4px; letter-spacing:.04em; }
  .frow input, .frow select, .frow textarea{
    width:100%; font:inherit; font-size:13px; color:var(--ink);
    background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px;
  }
  .frow textarea{ min-height:96px; line-height:1.8; resize:vertical; }
  .frow input:focus, .frow select:focus, .frow textarea:focus{ outline:none; border-color:var(--wood); }
  .partrow{ border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px; }
  .partrow textarea{
    width:100%; font:inherit; font-size:13px; color:var(--ink); margin-top:6px;
    background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    min-height:70px; line-height:1.8; resize:vertical;
  }
  .partrow input{
    font:inherit; font-size:12px; color:var(--ink); width:auto;
    background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:4px 8px;
  }
  .partrow .pNo{ width:64px; }

  .snpick{ margin-bottom:8px; }
  .snpick .cpy{ font-size:12.5px; padding:5px 14px; }
  .snlist{ display:flex; flex-wrap:wrap; gap:6px; }
  .snitem{
    background:var(--bg); border:1px solid var(--line); border-radius:999px;
    color:var(--ink); font:inherit; font-size:12px; padding:5px 12px; cursor:pointer;
  }
  .snitem:hover{ border-color:var(--wood); }
  .snitem[data-done="true"]{ color:var(--surface); background:var(--sage); border-color:var(--sage); }
  .pcard{
    border:1px solid var(--line); border-left:3px solid var(--chc, var(--wood));
    border-radius:14px; background:var(--surface); padding:16px 18px; margin-bottom:12px;
  }
  .phead{ display:flex; align-items:center; flex-wrap:wrap; gap:8px; cursor:pointer; }
  .pcard[data-open="false"] .pbody{ display:none; }
  .pcard[data-open="true"] .phead{ margin-bottom:12px; }
  .chev{ margin-left:auto; color:var(--muted); font-size:16px; line-height:1;
         transition:transform .16s ease; }
  .pcard[data-open="true"] .chev{ transform:rotate(90deg); }
  .pmini{ display:flex; gap:4px; align-items:center; }
  .pdot{
    font-style:normal; font-size:9.5px; font-weight:500; line-height:14px;
    width:16px; height:16px; text-align:center; border-radius:5px;
    border:1px solid var(--line); color:var(--muted);
  }
  .pdot[data-on="true"]{ color:var(--surface); background:var(--sage); border-color:var(--sage); }
  /* チャンネル名。縮めないので、幅は文字なりに */
  .pf{
    font-style:normal; font-size:10.5px; letter-spacing:.04em; white-space:nowrap;
    color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:1px 5px;
  }
  .grid th.rowhead b{ flex-wrap:wrap; }
  .grid th.rowhead{ width:150px; }
  .pflag{ font-style:normal; font-size:11px; color:var(--ink); margin-left:2px; }
  @media (prefers-reduced-motion:reduce){ .chev{ transition:none } }
  .phead .who{ font-weight:500; font-size:14px; color:var(--chc, var(--ink)); }
  .phead .when{ font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .ptext{
    white-space:pre-wrap; font-size:13.5px; line-height:1.85;
    background:var(--bg); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; margin:0;
  }
  .ptext.empty2{ color:var(--muted); font-style:normal; }
  .plabel{ font-size:11.5px; color:var(--muted); margin:12px 0 5px; letter-spacing:.06em; }
  .pbar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .pwrap{ position:relative; }
  .cpys{ position:absolute; top:7px; right:8px; display:flex; gap:5px; align-items:center; z-index:1; }
  .cpy{
    background:var(--surface); border:1px solid var(--line); border-radius:7px;
    color:var(--muted); font:inherit; font-size:10.5px; font-weight:500;
    padding:2px 7px; cursor:pointer; line-height:1.5;
  }
  /* 投稿に使うのは英語なので、こちらを主役にする */
  .cpy[data-lg="en"]{
    font-size:12.5px; padding:5px 14px;
    color:var(--surface); background:var(--wood); border-color:var(--wood);
  }
  .cpy[data-lg="en"]:hover{ opacity:.88; color:var(--surface); }
  .cpy:hover{ border-color:var(--wood); color:var(--ink); }
  .cpy[data-done="true"]{ color:var(--surface); background:var(--sage); border-color:var(--sage); }
  .pwrap .ptext{ padding-right:96px; padding-bottom:26px; }
  .pchk{
    position:absolute; right:8px; bottom:7px;
    width:24px; height:24px; padding:0; line-height:22px;
    background:var(--surface); border:1px solid var(--line); border-radius:7px;
    color:var(--line); font:inherit; font-size:13px; cursor:pointer;
  }
  .pchk:hover{ border-color:var(--wood); color:var(--wood); }
  .pchk[data-on="true"]{ color:var(--surface); background:var(--sage); border-color:var(--sage); }
  .pcount{
    font-size:11px; font-variant-numeric:tabular-nums; color:var(--muted);
    border:1px solid var(--line); border-radius:999px; padding:1px 8px;
  }
  .pcount[data-full="true"]{ color:var(--surface); background:var(--sage); border-color:var(--sage); }
  .powner{ margin:0 0 12px; font-size:12px; color:var(--muted); letter-spacing:.04em; }
  .passet{ font-size:12.5px; color:var(--muted); margin:10px 0 0; }
  .done-bar{ border-top:1px solid var(--line); padding-top:12px; margin-top:14px; }
  .prow{ display:flex; gap:10px; align-items:flex-start; }
  .prow .pwrap{ flex:1 1 auto; min-width:0; }
  .mcol{ flex:0 0 96px; width:96px; }
  .madd{
    display:block; width:96px; height:34px; line-height:32px; text-align:center;
    border:1px dashed var(--line); border-radius:10px; color:var(--muted);
    font-size:16px; cursor:pointer; margin-top:6px;
  }
  .madd:hover{ border-color:var(--wood); color:var(--wood); }
  .mcol[data-drop="true"] .madd,
  .mcol[data-drop="true"] .mediabox img,
  .mcol[data-drop="true"] .mediabox video{
    border-color:var(--wood); background:var(--wood-soft);
  }
  .madd input{ display:none; }
  .noimg{
    display:block; width:100%; margin-top:6px; padding:4px 6px; cursor:pointer;
    background:none; border:1px solid var(--line); border-radius:8px;
    color:var(--muted); font:inherit; font-size:10px; line-height:1.4;
  }
  .noimg:hover{ border-color:var(--wood); color:var(--ink); }
  .noimg[data-on="true"]{ color:var(--ink); border-color:var(--ink); }
  .mediabox{ position:relative; width:96px; }
  .mediabox:empty{ display:none; }
  .mediabox img, .mediabox video{
    display:block; width:100%; max-height:150px; object-fit:cover;
    background:var(--bg); border:1px solid var(--line); border-radius:10px;
  }
  .mopen{ display:block; }
  .mopen:hover img, .mopen:hover video{ border-color:var(--wood); }
  @media (max-width:520px){ .mcol, .mediabox, .madd{ flex-basis:74px; width:74px; } }
  .mdel{
    position:absolute; top:4px; right:4px; width:22px; height:22px; line-height:20px;
    background:var(--surface); border:1px solid var(--line); border-radius:50%;
    color:var(--muted); font:inherit; font-size:14px; cursor:pointer; padding:0;
  }
  .mdel:hover{ color:#b4553f; border-color:#b4553f; }
  .mdel[data-ask]{
    width:auto; padding:0 8px; font-size:10.5px;
    color:var(--surface); background:#b4553f; border-color:#b4553f;
  }
  .mdel[data-ask="wait"]{ opacity:.6; }
  .filebtn.sm{ font-size:12px; padding:6px 14px; }
  .tiny{ font-size:11px; color:var(--muted); }
  #stOut{ word-break:break-word; }
  .mtag{
    position:absolute; left:4px; bottom:4px; font-size:9px; letter-spacing:.04em;
    background:var(--sage); color:var(--surface); border-radius:5px; padding:1px 5px;
  }
  .store{ margin-top:26px; border-top:1px solid var(--line); padding-top:16px; }
  .store input{
    display:block; width:100%; margin-top:8px; font:inherit; font-size:13px;
    background:var(--surface); color:var(--ink);
    border:1px solid var(--line); border-radius:999px; padding:8px 16px;
  }
  .store input:focus{ outline:none; border-color:var(--wood); }
  .linkrow{ display:flex; align-items:center; gap:8px; margin-top:8px; }
  .plink{
    flex:1 1 auto; min-width:0; font:inherit; font-size:12px;
    background:var(--bg); color:var(--ink);
    border:1px solid var(--line); border-radius:8px; padding:6px 10px;
  }
  .plink:focus{ outline:none; border-color:var(--wood); }
  .linkrow .goto{ flex:0 0 auto; margin-top:0; }
  .donebtn{
    background:none; border:1px solid var(--line); border-radius:999px;
    color:var(--muted); font:inherit; font-size:12px; padding:6px 14px; cursor:pointer;
  }
  .donebtn:hover{ border-color:var(--wood); color:var(--ink); }
  .donebtn[data-mark="posted"][data-on="true"]{
    color:var(--surface); background:var(--sage); border-color:var(--sage); }
  .donebtn[data-mark="checked"][data-on="true"]{
    color:var(--surface); background:var(--ink); border-color:var(--ink); }
  .donebtn[data-mark="scheduled"][data-on="true"]{
    color:var(--surface); background:var(--wood); border-color:var(--wood); }

  /* ---- week grid ---- */
  .gridwrap{ overflow-x:auto; border:1px solid var(--line); border-radius:14px;
             background:var(--surface); }
  .grid{ border-collapse:collapse; width:100%; min-width:660px; table-layout:fixed; }
  .grid th, .grid td{ padding:0; text-align:center; vertical-align:top; }
  .grid td{ border-left:1px solid var(--line); border-bottom:1px solid var(--line); }
  .grid tbody tr:last-child td{ border-bottom:0; }

  .grid thead th{
    padding:11px 6px 9px; font-weight:400;
    border-bottom:1px solid var(--line); border-left:1px solid var(--line);
  }
  .grid thead th:first-child{ border-left:0; }
  .grid thead th .dow{ display:block; font-size:11px; color:var(--muted); letter-spacing:.08em; }

                        font-size:15px; font-weight:500; font-variant-numeric:tabular-nums; }
  .grid thead th.today{ background:var(--wood-soft); }
  .grid thead th.today .dnum{ color:var(--wood); }
  .grid thead th.wknd .dnum{ color:var(--muted); }
  .grid td.todayc{ background:var(--todaybg); }
  .grid td.wknd{ background:var(--wkndbg); }
  .grid td.todayc.wknd{ background:var(--todaybg); }

  .grid th.rowhead{
    position:sticky; left:0; z-index:2; background:var(--surface);
    width:132px; text-align:left; padding:10px 10px 10px 11px;
    border-left:3px solid var(--chc, var(--wood));
    border-right:1px solid var(--line); border-bottom:1px solid var(--line);
  }
  .grid tbody tr:last-child th.rowhead{ border-bottom:0; }
  .grid tbody tr.chstart th.rowhead,
  .grid tbody tr.chstart td{ border-top:2px solid var(--line); }
  .grid th.rowhead b{ display:flex; align-items:center; gap:5px; font-weight:500; }
  .grid th.rowhead .chn{ font-size:12.5px; color:var(--chc, var(--ink)); }
  .grid th.rowhead .rt{ display:block; margin-top:3px; font-size:13px;
                        color:var(--ink); font-variant-numeric:tabular-nums; }
  .grid th.rowhead .rl{ display:block; font-size:11px; color:var(--muted); }

  .cell{ display:block; padding:8px 6px; }
  .mk{
    display:block; font-size:11px; font-weight:500; line-height:1.5;
    border-radius:7px; border:1px solid var(--line); padding:3px 4px; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .mk .ok{ font-style:normal; margin-left:4px; }
  .mk[data-s="text"]{ color:var(--wood); border-color:var(--wood); }
  .mk[data-s="ready"]{ color:var(--surface); background:var(--wood); border-color:var(--wood); }
  .mk[data-s="sched"]{ color:var(--ink); border-color:var(--ink); }
  .mk[data-s="done"]{ color:var(--surface); background:var(--sage); border-color:var(--sage); }
  .mk[data-s="late"]{ color:var(--surface); background:#b4553f; border-color:#b4553f; }

  .cellfoot{ display:flex; align-items:center; gap:5px; margin-top:5px; }
  .lb2{ flex:1 1 auto; min-width:0; font-size:10.5px; color:var(--muted); text-align:left;
        overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cellmats{ display:flex; gap:3px; flex:0 0 auto; }
  .mt{
    width:17px; height:17px; padding:0; line-height:15px; cursor:pointer;
    background:none; border:1px solid var(--line); border-radius:5px;
    color:var(--muted); font:inherit; font-size:9.5px; font-weight:500;
  }
  .mt:hover{ border-color:var(--wood); color:var(--ink); }
  .mt[data-on="true"]{ color:var(--surface); background:var(--sage); border-color:var(--sage); }
  .none{ display:block; padding:14px 0; color:var(--line); font-size:14px; }

  @media (min-width:820px){
    .grid{ min-width:0; }
    .gridwrap{ overflow-x:hidden; }
    .cell{ padding:9px 8px; }
    .mk{ font-size:11.5px; padding:4px 6px; }
    .lb2{ font-size:11px; }
    .grid thead th .dnum{ font-size:16px; }
  }

  /* ---- dashboard ---- */
  .sum{ background:var(--surface); border:1px solid var(--line); border-radius:14px;
        padding:16px 18px; margin:18px 0 14px; }
  .sum .big{ font-size:16px; font-weight:500; margin:0 0 4px; }
  .sum .rng{ font-size:12.5px; color:var(--muted); letter-spacing:.02em; line-height:2; }
  .day{ border:1px solid var(--line); border-radius:14px; background:var(--surface);
        padding:12px 14px; margin-bottom:8px; }
  .day.today{ border-color:var(--wood); }
  .dhead{ display:flex; justify-content:space-between; align-items:baseline;
          font-size:12.5px; color:var(--muted); letter-spacing:.04em; margin-bottom:6px; }
  .dhead .n{ color:var(--ink); font-size:15px; font-weight:500; }
  .row{ display:flex; align-items:center; gap:10px; padding:8px 0; font-size:13.5px; }
  .row + .row{ border-top:1px solid var(--line); }
  .row .t{ color:var(--ink); font-size:12.5px; font-variant-numeric:tabular-nums; flex:0 0 48px; }
  .row .lb{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .st{ flex:0 0 auto; font-size:11.5px; font-weight:500; border-radius:999px; padding:2px 9px; border:1px solid var(--line); }
  .st[data-s="none"]{ color:var(--muted); }
  .st[data-s="text"]{ color:var(--wood); border-color:var(--wood); }
  .st[data-s="sched"]{ color:var(--ink); border-color:var(--ink); }
  .st[data-s="done"]{ color:var(--surface); background:var(--sage); border-color:var(--sage); }
  .st[data-s="late"]{ color:var(--surface); background:#b4553f; border-color:#b4553f; }

  .mats{ display:flex; gap:10px; align-items:center; flex:0 0 auto; }
  .mat{ display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--muted);
        cursor:pointer; user-select:none; }
  .mat input{ accent-color:var(--wood); width:14px; height:14px; margin:0; }
  .mat[data-on="true"]{ color:var(--ink); }
  .st[data-s="ready"]{ color:var(--surface); background:var(--wood); border-color:var(--wood); }
  .rem{ display:flex; align-items:center; gap:10px; flex-wrap:wrap;
        font-size:12px; color:var(--muted); margin:0 0 14px; }
  .rem select{ font:inherit; font-size:12px; background:var(--surface); color:var(--ink);
               border:1px solid var(--line); border-radius:999px; padding:4px 10px; }
  .chk{ font-size:11px; color:var(--muted); }
  .chk[data-m="true"]{ color:var(--sage); }
  .chk[data-m="false"]{ color:#b4553f; }

  .imp textarea{
    width:100%; min-height:220px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12.5px; line-height:1.7; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:12px; padding:14px; resize:vertical;
  }
  .imp textarea:focus{ outline:none; border-color:var(--wood); }
  .imp textarea[data-drop="true"]{ border-color:var(--wood); background:var(--wood-soft); }
  .filebtn{
    display:inline-block; background:none; border:1px dashed var(--line); border-radius:999px;

  }
  .filebtn:hover{ border-color:var(--wood); color:var(--ink); }
  .filebtn input{ display:none; }
  .imp .out{ font-weight:500; }
  .imp .hint{ font-size:12.5px; color:var(--muted); margin:0 0 10px; }

  .imp input[type=url]{
    flex:1 1 240px; min-width:0; font:inherit; font-size:13px;
    background:var(--surface); color:var(--ink);
    border:1px solid var(--line); border-radius:999px; padding:8px 16px;

  .imp input[type=url]:focus{ outline:none; border-color:var(--wood); }
  .imp .cols{ margin-top:20px; opacity:.75; }
  .imp textarea{ min-height:260px; }
  .imp button{
    background:var(--surface); border:1px solid var(--line); border-radius:999px;
    color:var(--ink); font:inherit; font-size:13px; padding:8px 16px; cursor:pointer;
  }
  .imp button:hover{ border-color:var(--wood); }
  .imp .out{ margin-top:12px; font-size:13px; }

  /* ---- channels ---- */
  .chans{ display:flex; flex-wrap:wrap; gap:6px; margin:26px 0 22px; }
  .chans[hidden]{ display:none; }
  .chan{
    background:var(--surface); border:1px solid var(--line); border-radius:999px;
    color:var(--muted); font:inherit; font-size:12px; padding:5px 13px; cursor:pointer;
    transition:border-color .16s ease, color .16s ease;
  }
  .chan[aria-pressed="true"]{ color:var(--surface); background:var(--chc, var(--wood));
                              border-color:var(--chc, var(--wood)); }
  .chan:hover{ border-color:var(--chc, var(--wood)); }

  /* ---- list ---- */
  .list{ list-style:none; margin:0; padding:0; }
  .list li + li{ margin-top:12px; }
  .card{
    display:block; width:100%; text-align:left; cursor:pointer;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:18px 20px; color:inherit; font:inherit;
    transition:border-color .18s ease, transform .18s ease;

  .card:hover,.card:focus-visible{ border-color:var(--wood); transform:translateY(-1px); }
  .card:focus-visible{ outline:2px solid var(--wood); outline-offset:3px; }

         cursor:pointer; padding:6px 0; margin-bottom:10px; }
  .back:hover{ color:var(--ink); }
  .post h2{ margin:6px 0; font-size:20px; font-weight:500; line-height:1.6; }
  .post .lead{ margin:0 0 26px; font-size:14px; color:var(--muted); }

          padding:20px 22px; margin-bottom:12px; }

  .sheet p{ margin:0; font-size:14px; }
  .links{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .goto{
    display:inline-block; font-size:12px; color:var(--wood); text-decoration:none;
    border:1px solid var(--line); border-radius:999px; padding:5px 12px;
  }
  .goto:hover{ border-color:var(--wood); }
  .chanbox{
    background:var(--wood-soft); border-radius:14px; padding:16px 18px; margin-bottom:16px;
  }
  .chanbox b{ display:block; font-weight:500; font-size:15px; letter-spacing:.06em; }
  .chanbox p{ margin:4px 0 0; font-size:13px; color:var(--muted); }

  .empty{ text-align:center; color:var(--muted); font-size:13px; padding:44px 0; }
  .navtip{ margin:10px 0 0; font-size:12.5px; color:var(--muted); }
  footer{ margin-top:56px; padding-top:18px; border-top:1px solid var(--line);
          text-align:left; color:var(--muted); }
  .fnote{ margin:0; font-size:12px; line-height:1.8; }
  .fline{ margin:6px 0 0; display:flex; gap:14px; align-items:baseline;
          font-size:11.5px; font-variant-numeric:tabular-nums; }
  .fline a{ color:var(--muted); text-decoration:none; border-bottom:1px solid var(--line); }
  .fline a:hover{ color:var(--ink); border-color:var(--wood); }
  /* スマホ: 指で押せる大きさに。折り返して全部見せる */
  @media (max-width:520px){
    .page{ padding:24px 16px 56px; }
    .top{ flex-direction:column; align-items:stretch; gap:14px; }
    .lang{ justify-content:flex-end; }
    .pill{ font-size:13px; padding:8px 14px; }
    .theme{ width:38px; height:32px; }
    .chans{ gap:7px; margin:18px 0; }
    .chan{ padding:8px 15px; font-size:13px; }
    .card{ padding:16px 17px; }
    .card b{ font-size:15.5px; }
    .sheet{ padding:17px 18px; }
    .post h2{ font-size:18.5px; }
    .back{ padding:10px 0; font-size:14px; }
  }

  @media (prefers-reduced-motion:reduce){ .card{ transition:none } }
</style>

    ja: { tagline:"投稿するものを、書いて・確かめて・残す場所。",

          clearShared:"共有ずみのものを端末から消す", cleared:"消した", used:"使用",

          allBooked:"すべて予約ずみ", leftToDo:"残り", nothingToday:"予定なし",
          markSched:"予約完了", markPosted:"投稿完了", markVerified:"投稿確認完了", needUrl:"先にリンクを貼る", addFile:"画像・動画を入れる", localOnly:"この端末だけ", onServer:"共有ずみ",
          storeTitle:"画像の置き場（GitHub）", storeUrl:"owner/repo", storeTok:"アクセストークン", storeSave:"保存",
          storeOk:"つながった", storeNo:"つながらない", sure:"消す？", noImg:"画像は要らない", pickOne:"どれか1つ", linkPh:"投稿したリンクを貼る", open:"開く",
          copy:"写す", copied:"写した", copyEn:"EN", noText:"原稿なし", comment:"コメント",
          visual:"ビジュアル", today:"今日", tomorrow:"明日", prepEmpty:"先の予定がない。",
          stNone:"原稿なし", stText:"原稿あり", stSched:"予約ずみ", stDone:"投稿ずみ",
          stLate:"抜け", stReady:"投稿準備完了", weekOf:"の週", ok:"すべて整っている", todo:"手が要る",
          matText:"テキスト", matImage:"画像", remind:"投稿前にリマインド", remindOff:"切",
          notMatched:"未確認", matched:"企画どおり", mismatched:"企画と違う",
          navImport:"取り込み", impHelp:"表計算からコピーして貼る（タブ区切り・1行目は見出し）。",
          impCols:"列: date（または day）, time, platform, type, label, ja, en, ko, asset",
          impApply:"この端末に反映", impDownload:"schedule.json を保存",
          impMonth:"月", impMerge:"いまの内容を残す",
          impPaste:"企画の内容をここに貼る", impFile:"ファイルを選ぶ", impUrl:"リンクを貼る",
          impUrlNo:"この住所はブラウザからは読めない。Claudeに渡してください。",
          impRead:"読む", impResult:"件 読めた", impBad:"読めなかった。1行目の見出しを確かめて。",
          updated:"新しい内容", reload:"読み直す", close:"閉じる",
          weekStart:"週の始まり", noSlots:"定期の枠がまだない。" }
  };
  var LANGS = [["en","EN"], ["ko","한국어"], ["ja","日本語"]];

  // 明るさ。既定は端末に合わせる。押すたびに 端末 → 明るい → 暗い と回る
  var THEMES = [["auto","◐"], ["light","☀"], ["dark","☾"]];
  var theme = "auto";
  try { var tv = localStorage.getItem("remitech-theme"); if (tv) theme = tv; } catch (e) {}
  function applyTheme() {
    if (theme === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", theme);
    var b = document.getElementById("themeBtn");
    if (b) {
      var cur = THEMES.filter(function (x) { return x[0] === theme; })[0];
      b.textContent = cur[1];
      b.setAttribute("aria-label", "theme: " + theme);
      b.title = "theme: " + theme;
    }
  }

  var lang = "en";
  try { var sv = localStorage.getItem("remitech-lang"); if (T[sv]) lang = sv; } catch (e) {}

  var view = document.getElementById("view");
  var navEl = document.getElementById("nav");
  var schedule = null, tab = "dash";
  var chansEl = document.getElementById("chans");
  var langEl = document.getElementById("langPick");
  var posts = [], channels = [], filter = "";

  function t(k) { return T[lang][k]; }
  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
  function chanOf(id) { return channels.filter(function (c) { return c.id === id; })[0]; }
  function chanNames(ids) {
    return (ids || []).map(function (id) { var c = chanOf(id); return c ? c.name : id; }).join(" · ");
  }

  function renderLang() {
    var cur = LANGS.filter(function (l) { return l[0] === lang; })[0] || LANGS[0];
    langEl.innerHTML =
      '<button class="pill" id="langBtn" title="language">' + cur[1] + '</button>' +
      '<button class="theme" id="themeBtn"></button>';
    applyTheme();
    document.documentElement.lang = lang;
    document.getElementById("brand").textContent = t("brand");
    document.getElementById("tagline").textContent = t("tagline");
    document.getElementById("fnote").textContent = t("footNote");
    document.getElementById("frepo").textContent = t("footRepo") + " ↗";
    var n = new Date();
    document.getElementById("ftoday").textContent =
      n.getFullYear() + "-" + two(n.getMonth() + 1) + "-" + two(n.getDate());
  }

  function renderChans() {
    if (!channels.length) { chansEl.innerHTML = ""; return; }
    var html = '<button class="chan" data-chan="" aria-pressed="' + (filter === "") + '">' + esc(t("all")) + '</button>';
    channels.forEach(function (c) {
      html += '<button class="chan" data-chan="' + esc(c.id) + '" aria-pressed="' + (filter === c.id) +
              '" style="--chc:' + esc(c.color || "var(--wood)") + '">' + esc(c.name) + '</button>';
    });
    chansEl.innerHTML = html;
  }

  function visible() {
    return filter ? posts.filter(function (p) { return (p.channels || []).indexOf(filter) >= 0; }) : posts;
  }

  function chanCard(c) {
    var links = (c.links || []).map(function (l) {
      return '<a class="goto" href="' + esc(l.url) + '" target="_blank" rel="noopener">' +
             esc(l.kind) + ' ' + esc(l.handle) + ' ↗</a>';
    }).join("");
    return '<div class="chanbox"><b>' + esc(c.name) + '</b>' +
           (c.tagline ? '<p>' + esc(c.tagline) + '</p>' : "") +
           '<div class="links">' + links + '</div></div>';
  }

  function renderList() {
    chansEl.hidden = false;
    var head = filter ? chanCard(chanOf(filter) || {}) : "";
    var rows = visible();
    if (!rows.length) { view.innerHTML = head + '<p class="empty">' + esc(t("none")) + '</p>'; return; }
    view.innerHTML = head + '<ul class="list">' + rows.map(function (p) {
      return '<li><button class="card" data-id="' + esc(p.id) + '">' +
        '<span class="meta"><span>' + esc(p.date) + '</span>' +
        '<span class="dot" data-status="' + (p.status === "draft" ? "draft" : "live") + '"></span>' +
        '<span class="flag" data-status="' + esc(p.status) + '">' +
          esc(p.status === "draft" ? t("draft") : t("live")) + '</span>' +
        '<span>' + esc(chanNames(p.channels)) + '</span></span>' +
        '<b>' + esc(p.title) + '</b><p>' + esc(p.lead) + '</p>' +
        ((p.tags && p.tags.length) ? '<p class="tags">' + esc(p.tags.join(" · ")) + '</p>' : '') +
      '</button></li>';
    }).join("") + '</ul>';
  }

  // ---- ダッシュボード ----
  // 今日を含む月曜〜日曜。予約できているかを1枚で見る
  function two(n) { return n < 10 ? "0" + n : "" + n; }
  function ymd(d) { return d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate()); }

  function weekStart() {
    try { var v = localStorage.getItem("remitech-weekstart"); if (v !== null) return +v; } catch (e) {}
    return 1;                                   // 既定は月曜
  }
  function weekRange(now) {
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var back = (d.getDay() - weekStart() + 7) % 7;
    var mon = new Date(d); mon.setDate(d.getDate() - back);
    var days = [];
    for (var i = 0; i < 7; i++) { var x = new Date(mon); x.setDate(mon.getDate() + i); days.push(x); }
    return days;
  }

  // 材料の印は端末に残す。書き換えが頻繁で、記録として残すものではないため。
  // 「投稿ずみ」「一致確認」は schedule.json 側に残す（みんなで見る記録）
  // 投稿したか、確認したか。schedule.json に書ければ一番よいが、
  // 置いてあるファイルは書き換えられないので、まず端末に残す
  function stKey(sl) { return "remitech-st-" + sl.date + "-" + (sl.platform || "X") + "-" + sl.time; }
  function stGet(sl) {
    try { return JSON.parse(localStorage.getItem(stKey(sl)) || "{}") || {}; } catch (e) { return {}; }
  }
  function stSet(sl, k, v) {
    var o = stGet(sl); o[k] = v;
    try { localStorage.setItem(stKey(sl), JSON.stringify(o)); } catch (e) {}
  }
  function isPosted(sl) { return !!(sl.posted || stGet(sl).posted); }
  function isSched(sl) { return !!(sl.scheduled || stGet(sl).scheduled); }
  function isChecked(sl) { return !!((sl.check && sl.check.done) || stGet(sl).checked); }

  function matKey(sl) { return "remitech-mat-" + sl.date + "-" + (sl.platform || "X") + "-" + sl.time; }
  function matGet(sl) {
    var m = {};
    try { m = JSON.parse(localStorage.getItem(matKey(sl)) || "{}") || {}; } catch (e) {}
    // 原稿が入っていれば、テキストは用意できたものとして扱う。
    // 取り込んだ直後に押し直す手間をなくすため。外したいときは押せば消える
    if (m.text === undefined && sl.text && (sl.text.ja || sl.text.en || sl.text.ko)) m.text = true;
    return m;
  }
  function matSet(sl, kind, on) {
    var m = matGet(sl); m[kind] = on;
    try { localStorage.setItem(matKey(sl), JSON.stringify(m)); } catch (e) {}
  }
  function matReady(sl) {
    var m = matGet(sl), need = sl.need || ["text"];
    for (var i = 0; i < need.length; i++) { if (!m[need[i]]) return false; }
    return true;
  }

  function remindPrefs() {
    try { return JSON.parse(localStorage.getItem("remitech-remind") || "null") || { on:false, min:30 }; }
    catch (e) { return { on:false, min:30 }; }
  }
  function saveRemind(p) { try { localStorage.setItem("remitech-remind", JSON.stringify(p)); } catch (e) {} }

  var remindTimers = [];
  function armReminders(days) {
    remindTimers.forEach(clearTimeout); remindTimers = [];
    var p = remindPrefs();
    if (!p.on || !("Notification" in window) || Notification.permission !== "granted") return;
    var now = Date.now();
    days.forEach(function (d) {
      (schedule.slots || []).forEach(function (sl) {
        if (sl.date !== ymd(d) || sl.time.indexOf(":") < 0 || isPosted(sl)) return;
        var hh = sl.time.split(":");
        var at = new Date(d.getFullYear(), d.getMonth(), d.getDate(), +hh[0], +hh[1]).getTime()
                 - p.min * 60000;
        var wait = at - now;
        if (wait <= 0 || wait > 86400000) return;      // 24時間より先は張らない
        remindTimers.push(setTimeout(function () {
          try { new Notification("REMITECH", { body: sl.time + "  " + (sl.label || "") }); } catch (e) {}
        }, wait));
      });
    });
  }

  function slotState(sl, when, now) {
    if (isPosted(sl)) return "done";
    var hasText = sl.text && (sl.text.ja || sl.text.en || sl.text.ko);
    // 予約してあれば、時刻を過ぎても抜けではない（自動で出ているはず）。
    // 実際に出たかは照らしてから posted にする
    if (isSched(sl)) return "sched";
    if (when < now) return "late";              // 予約もされないまま時刻が過ぎた
    if (hasText && matReady(sl)) return "ready";  // 材料が揃った
    return hasText ? "text" : "none";
  }

  var DOW = { en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
              ko:["일","월","화","수","목","금","토"],
              ja:["日","月","火","水","木","金","土"] };

  function renderDash() {
    chansEl.hidden = true;
    if (!schedule) { view.innerHTML = '<p class="empty">' + esc(t("none")) + '</p>'; return; }

    var now = new Date();
    var days = weekRange(now);
    var counts = { none:0, text:0, ready:0, sched:0, done:0, late:0 };

    // 行 = チャンネル × 定期の時刻
    var rows = [];
    channels.forEach(function (c) {
      (c.postTimes || []).forEach(function (pt) {
        rows.push({ ch:c, time: pt.time || pt, platform: pt.platform || "", label: pt.label || "" });
      });
    });
    if (!rows.length) { view.innerHTML = '<p class="empty">' + esc(t("noSlots")) + '</p>'; return; }

    var head = '<tr><th class="rowhead"></th>';
    days.forEach(function (d) {
      var isToday = d.toDateString() === now.toDateString();
      var wk = (d.getDay() === 0 || d.getDay() === 6) ? " wknd" : "";
      head += '<th class="' + (isToday ? "today" : "") + wk + '">' +
        '<span class="dow">' + (DOW[lang] || DOW.en)[d.getDay()] + '</span>' +
        '<span class="dnum">' + (d.getMonth() + 1) + "/" + d.getDate() + '</span></th>';
    });
    head += "</tr>";

    var body = "";
    rows.forEach(function (row, ri) {
      var pf = row.platform ? '<i class="pf" data-p="' + esc(row.platform) + '">' + esc(pfn(row.platform)) + '</i>' : "";
      var first = (ri === 0) || (rows[ri - 1].ch.id !== row.ch.id);
      var col = row.ch.color || "var(--wood)";
      body += '<tr class="' + (first ? "chstart" : "") + '" data-ch="' + esc(row.ch.id) +
              '" style="--chc:' + esc(col) + '"><th class="rowhead">' +
              '<b>' + pf + '<span class="chn">' + esc(row.ch.name) + '</span></b>' +
              '<span class="rt">' + esc(row.time) + '</span>' +
              (row.label ? '<span class="rl">' + esc(row.label) + '</span>' : "") + '</th>';
      days.forEach(function (d) {
        var isToday = ymd(d) === ymd(now);
        var isWknd = (d.getDay() === 0 || d.getDay() === 6);
        var mine = row.ch.id === (schedule.channel || "hiyoko");
        var sl = mine ? (schedule.slots || []).filter(function (x) {
          return x.date === ymd(d) && x.time === row.time &&
                 (x.platform || "X") === (row.platform || "X");
        })[0] : null;
        if (!sl) {
          body += '<td class="' + (isToday ? "todayc " : "") + (isWknd ? "wknd" : "") +
                  '"><span class="none">·</span></td>';
          return;
        }

        var hh = row.time.split(":");
        var when = new Date(d.getFullYear(), d.getMonth(), d.getDate(), +hh[0], +hh[1]);
        var st = slotState(sl, when, now);
        counts[st]++;
        var label = sl.label || ((sl.text && (sl.text[lang] || sl.text.en || sl.text.ja)) || "").split(NLC)[0];
        var mm = matGet(sl);
        // 材料は小さな四角にする。文字のボタンだと1行に14個並んで画面が埋まった
        var mats = (sl.need || ["text"]).map(function (k) {
          var on = !!mm[k];
          return '<button class="mt" data-on="' + on + '"' +
                 ' data-date="' + esc(sl.date) + '" data-pf="' + esc(sl.platform || "X") +
                 '" data-time="' + esc(sl.time) + '" data-kind="' + k + '"' +
                 ' title="' + esc(t(k === "text" ? "matText" : "matImage")) + '">' +
                 (k === "text" ? "T" : "I") + '</button>';
        }).join("");
        var ck = isChecked(sl) ? '<i class="ok">✓</i>' : "";
        body += '<td class="' + (isToday ? "todayc " : "") + (isWknd ? "wknd" : "") + '">' +
                '<div class="cell">' +
                  '<div class="mk" data-s="' + st + '">' +
                    esc(t("st" + st.charAt(0).toUpperCase() + st.slice(1))) + ck + '</div>' +
                  '<div class="cellfoot">' +
                    '<span class="lb2">' + esc(label || "—") + '</span>' +
                    '<span class="cellmats">' + mats + '</span>' +
                  '</div>' +
                '</div></td>';
      });
      body += "</tr>";
    });

    var need = counts.late + counts.none + counts.text;
    var rp = remindPrefs();
    var opts = [15, 30, 60, 120].map(function (v) {
      return '<option value="' + v + '"' + (rp.min === v ? " selected" : "") + '>' + v + "m</option>";
    }).join("");
    var ws = weekStart();
    var wsOpts = [1, 0, 6].map(function (v) {
      return '<option value="' + v + '"' + (ws === v ? " selected" : "") + '>' +
             (DOW[lang] || DOW.en)[v] + "</option>";
    }).join("");

    var sum = '<div class="sum"><p class="big">' +
      (need === 0 ? esc(t("ok")) : esc(t("todo")) + " \u00b7 " + need) + '</p>' +
      '<p class="rng">' + (days[0].getMonth()+1) + "/" + days[0].getDate() + " \u2013 " +
      (days[6].getMonth()+1) + "/" + days[6].getDate() +
      '\u3000' + esc(t("stLate")) + " " + counts.late +
      '\u3000' + esc(t("stNone")) + " " + counts.none +
      '\u3000' + esc(t("stText")) + " " + counts.text +
      '\u3000' + esc(t("stReady")) + " " + counts.ready +
      '\u3000' + esc(t("stSched")) + " " + counts.sched +
      '\u3000' + esc(t("stDone")) + " " + counts.done + '</p></div>';

    var bar = '<div class="rem">' +
      '<label class="mat" data-on="' + rp.on + '"><input type="checkbox" id="remOn"' +
      (rp.on ? " checked" : "") + '>' + esc(t("remind")) + '</label>' +
      '<select id="remMin">' + opts + '</select>' +
      '<span>' + esc(t("weekStart")) + '</span><select id="wsPick">' + wsOpts + '</select></div>';

    view.innerHTML = sum + bar +
      '<div class="gridwrap"><table class="grid"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
    armReminders(days);
  }

  // ---- 企画表の取り込み ----
  // サイトはファイルを書けないので、読み取って(1)この端末に反映し
  // (2)schedule.json として保存できるようにする
  var NLC = String.fromCharCode(10), TABC = String.fromCharCode(9);
  var CRC = String.fromCharCode(13), BSN = "\\" + "n";
  function thisMonth() {
    var d = new Date();
    return d.getFullYear() + "-" + two(d.getMonth() + 1);
  }

  var imported = null;

  function parseTSV(txt) {
    var lines = txt.split(CRC).join("").split(NLC).filter(function (l) { return l.trim(); });
    if (lines.length < 2) return null;
    var sep = (lines[0].indexOf(TABC) >= 0) ? TABC : ",";
    var head = lines[0].split(sep).map(function (h) { return h.trim().toLowerCase().replace(/^"|"$/g, ""); });
    if ((head.indexOf("day") < 0 && head.indexOf("date") < 0) || head.indexOf("time") < 0) return null;
    function col(r, name) { var i = head.indexOf(name); return i < 0 ? "" : (r[i] || "").trim(); }
    function un(v) { return v.split(BSN).join(NLC); }
    var out = [];
    for (var i = 1; i < lines.length; i++) {
      var r = lines[i].split(sep).map(function (v) { return v.replace(/^"|"$/g, ""); });
      var dt = col(r, "date");
      var tm = col(r, "time");
      if (!dt) {
        var dnum = parseInt(col(r, "day"), 10);
        if (dnum) dt = thisMonth() + "-" + (dnum < 10 ? "0" + dnum : dnum);
      }
      if (!dt || !tm) continue;
      var type = col(r, "type") || "text";
      var asset = col(r, "asset");
      out.push({
        date: dt, time: tm, platform: (col(r, "platform") || "X").toUpperCase(),
        type: type, label: col(r, "label"),
        text: { ja: un(col(r, "ja")), en: un(col(r, "en")), ko: un(col(r, "ko")) },
        asset: asset, note: "",
        need: (type === "image" || type === "video" || asset) ? ["text", "image"] : ["text"],
        scheduled: false, posted: false, url: "",
        check: { done: false, at: "", match: null, note: "" }
      });
    }
    return out.length ? out : null;
  }

  function renderImport() {
    chansEl.hidden = true;
    view.innerHTML = '<div class="imp">' +
      '<textarea id="impText" spellcheck="false" placeholder="' + esc(t("impPaste")) + '"></textarea>' +
      '<div class="bar">' +
        '<input type="url" id="impUrl" placeholder="' + esc(t("impUrl")) + '">' +
        '<label class="filebtn">' + esc(t("impFile")) +
        '<input type="file" id="impFile" accept=".tsv,.csv,.txt,.json,text/plain,application/json"></label>' +
      '</div>' +
      '<p class="out" id="impOut"></p>' +
      '<div class="bar" id="impActions" hidden>' +
        '<button id="impApply">' + esc(t("impApply")) + '</button>' +

  // 画像・動画は端末の保管庫に置く。置いてあるファイルは書き換えられないので、
  // みんなで共有するには Claude に渡してリポジトリに入れる必要がある
  var mediaDB = null;
  function openDB() {
    return new Promise(function (res, rej) {
      if (mediaDB) return res(mediaDB);
      var rq = indexedDB.open("remitech-media", 1);
      rq.onupgradeneeded = function () { rq.result.createObjectStore("files"); };
      rq.onsuccess = function () { mediaDB = rq.result; res(mediaDB); };
      rq.onerror = function () { rej(rq.error); };
    });
  }
  function dbPut(k, v) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction("files", "readwrite");
        tx.objectStore("files").put(v, k);
        tx.oncomplete = res; tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function dbGet(k) {
    return openDB().then(function (db) {
      return new Promise(function (res) {
        var rq = db.transaction("files", "readonly").objectStore("files").get(k);
        rq.onsuccess = function () { res(rq.result || null); };
        rq.onerror = function () { res(null); };
      });
    });
  }
  function dbDel(k) {
    return openDB().then(function (db) {
      return new Promise(function (res) {
        var tx = db.transaction("files", "readwrite");
        tx.objectStore("files").delete(k);
        tx.oncomplete = res; tx.onerror = res;
      });
    });
  }
  // 連投は1つずつ時間を空けて出す。抜けることもあるので、箱ごとに印を持つ
  function partsKey(mk) { return "remitech-part-" + mk; }
  function partsGet(mk) {
    try { return JSON.parse(localStorage.getItem(partsKey(mk)) || "{}") || {}; } catch (e) { return {}; }
  }
  function partsSet(mk, id, on) {
    var o = partsGet(mk); o[id] = on;
    try { localStorage.setItem(partsKey(mk), JSON.stringify(o)); } catch (e) {}
  }

  // 置き場（Cloudflare R2 + Worker）。住所と合言葉は端末にだけ残す
  function storeGet() {
    try { return JSON.parse(localStorage.getItem("remitech-store") || "{}") || {}; } catch (e) { return {}; }
  }
  function storeSet(o) { try { localStorage.setItem("remitech-store", JSON.stringify(o)); } catch (e) {} }
  function storeOn() { var c = storeGet(); return !!(c.url && c.token); }

  // 置き場は GitHub のリポジトリ。カードの登録が要らず、
  // 入れたものはそのまま公開の住所で読めるので、投稿にも使える
  function ghPath(key, type) {
    var ext = (type || "").indexOf("video") === 0
      ? ((type.indexOf("quicktime") > 0) ? "mov" : "mp4")
      : ((type || "").split("/")[1] || "png").replace(/[^a-z0-9]/gi, "");
    return "media/" + key.replace(/[|#]/g, "-") + "." + ext;
  }
  function ghUrl(repo, path) {
    var o = repo.split("/");
    return "https://" + o[0] + ".github.io/" + o[1] + "/" + path;
  }
  function toB64(file) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () { res(String(fr.result).split(",")[1]); };
      fr.onerror = rej;
      fr.readAsDataURL(file);
    });
  }
  function ghApi(c, path, opt) {
    return fetch("https://api.github.com/repos/" + c.url + "/contents/" + path, Object.assign({
      headers: {
        "Authorization": "Bearer " + c.token,
        "Accept": "application/vnd.github+json",
      },
    }, opt || {}));
  }
  function upload(key, file) {
    var c = storeGet(), path = ghPath(key, file.type);
    return toB64(file).then(function (b64) {
      // 同じ場所に既にあるなら、その印（sha）を添えて差し替える
      return ghApi(c, path).then(function (r) { return r.ok ? r.json() : null; })
        .then(function (prev) {
          return ghApi(c, path, {
            method: "PUT",
            headers: {
              "Authorization": "Bearer " + c.token,
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              message: "media: " + key,
              content: b64,
              sha: prev ? prev.sha : undefined,
            }),
          });
        });
    }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return { url: ghUrl(c.url, path) };
    });
  }
  function removeRemote(key, type) {
    var c = storeGet();
    if (!storeOn()) return Promise.resolve();
    var path = ghPath(key, type || "image/png");
    return ghApi(c, path).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (prev) {
        if (!prev) return;
        return ghApi(c, path, {
          method: "DELETE",
          headers: {
            "Authorization": "Bearer " + c.token,
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ message: "media: remove " + key, sha: prev.sha }),
        });
      }).catch(function () {});
  }

  // 企画そのものを書き戻す。鍵が入っていれば元のファイルへ、無ければ端末へ
  function saveSchedule(note) {
    var body = {
      channel: schedule.channel, months: schedule.months,
      timezone: schedule.timezone, note: schedule.note,
      slots: schedule.slots, trash: schedule.trash || [],
    };
    body.months = [];
    schedule.slots.forEach(function (x) {
      var m = x.date.slice(0, 7);
      if (body.months.indexOf(m) < 0) body.months.push(m);
    });
    body.months.sort();

    var text = JSON.stringify(body, null, 2) + "\n";
    try { localStorage.setItem("remitech-schedule", text ? JSON.stringify(body) : "{}"); } catch (e) {}

    if (!storeOn()) return Promise.resolve({ where: "local" });

    var c = storeGet();
    return ghApi(c, "schedule.json").then(function (r) { return r.ok ? r.json() : null; })
      .then(function (prev) {
        // 日本語をそのまま base64 にするため、いったんバイト列にする
        var bytes = new TextEncoder().encode(text);
        var bin = "";
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return ghApi(c, "schedule.json", {
          method: "PUT",
          headers: {
            "Authorization": "Bearer " + c.token,
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            message: note || "schedule: update",
            content: btoa(bin),
            sha: prev ? prev.sha : undefined,
          }),
        });
      }).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return { where: "repo" };
      });
  }

  function mediaKey(sl) { return sl.date + "|" + (sl.platform || "X") + "|" + sl.time; }

  // 貼り終わったあとに、保管庫にあるものを差し込む

  function renderPrep() {
    chansEl.hidden = false;
    if (!schedule) { view.innerHTML = '<p class="empty">' + esc(t("none")) + '</p>'; return; }

    var now = new Date();
    var from = ymd(now);
    var till = new Date(now); till.setDate(till.getDate() + 6);
    var to = ymd(till);

    var chId = schedule.channel || "hiyoko";
    var list = (filter && filter !== chId) ? [] : (schedule.slots || []).filter(function (x) {
      // 終わったものも残す。あとから見返せるように
      return x.date >= from && x.date <= to;
    }).sort(function (a, b) {

    copyBank = {};

        html += '<div class="snip" style="--chc:' + esc(c.color || "var(--wood)") + '">' +

    if (!list.length) {

    list.forEach(function (sl, i) {

          '<span class="who">' + esc(ch.name) + '</span>' +
          '<span class="when">' + esc(whenLabel(sl.date)) + " \u00b7 " + esc(sl.time) + '</span>' +
          (sl.label ? '<span class="when">· ' + esc(sl.label) + '</span>' : "") +

            return '<span class="pcount" data-full="' + (done === parts.length) + '">' +

            return '<i class="pdot" data-on="' + (!!mm[kk]) + '">' + (kk === "text" ? "T" : "I") + '</i>';
          }).join("")) + (st.scheduled ? '<i class="pflag">✓</i>' : "") + '</span>' +
          '<span class="chev">›</span>' +
        '</div>' +
        '<div class="pbody">' +
        // YouTubeは題が要る。写せるようにしておく
        ((sl.platform === "YT")

              return '<div class="ptitle"><span class="tlab">' + esc(t("fLabel")) + '</span>' +

                (sl.label ? '<button class="cpy" data-ck="ti' + i + '" data-lg="en">' +
                  esc(t("copy")) + '</button>' : "") + '</div>';

          OWNERS.map(function (v) {
            return '<option value="' + esc(v) + '"' + (v === (sl.owner || "") ? " selected" : "") + '>' +
                   esc(v || t("noOwner")) + '</option>';
          }).join("") + '</select></p>' +
        '<div class="ptexts">' +
        (parts
          ? parts.map(function (pt, k) {
              return '<p class="plabel">' + esc(pt.no || "") + " · " + esc(pt.time) + '</p>' +
                     textBox("pp" + i + "_" + k, pt[lang] || "", pt.en || "", mk, "p" + k);

          : (body

      html += '</div>';

      var link = st.url || sl.url || "";
      html += '<div class="pbar done-bar">' +
        '<button class="donebtn" data-mark="scheduled" data-on="' + (!!st.scheduled) + '"' +
        ' data-date="' + esc(sl.date) + '" data-pf="' + esc(sl.platform || "X") +
        '" data-time="' + esc(sl.time) + '">' +
        (st.scheduled ? "✓ " : "") + esc(t("markSched")) + '</button>' +
        '<button class="donebtn" data-mark="posted" data-on="' + (!!st.posted) + '"' +
        ' data-date="' + esc(sl.date) + '" data-pf="' + esc(sl.platform || "X") +
        '" data-time="' + esc(sl.time) + '">' +
        (st.posted ? "✓ " : "") + esc(t("markPosted")) + '</button>' +
        '<button class="donebtn" data-mark="checked" data-on="' + isChecked(sl) + '"' +
        ' data-date="' + esc(sl.date) + '" data-pf="' + esc(sl.platform || "X") +
        '" data-time="' + esc(sl.time) + '">' +
        (isChecked(sl) ? "✓ " : "") + esc(t("markVerified")) + '</button>' +
        '</div>' +
        '<div class="pbar">' +
          '<label class="filebtn sm">' + esc(t("addFile")) +
          '<input type="file" class="mfile" accept="image/*,video/*" data-mk="' + esc(mk) + '">' +
          '</label>' +
          '<span class="tiny">' + esc(t("localOnly")) + '</span>' +
        '</div>' +
        '<div class="bar editbar">' +
        '<button class="donebtn eEdit" data-k="' + esc(slotKey(sl)) + '">' + esc(t("edit")) + '</button>' +
        '<button class="donebtn eDel" data-k="' + esc(slotKey(sl)) + '">' + esc(t("del")) + '</button>' +
        '</div>' +
        '<div class="linkrow">' +
          '<input type="url" class="plink" value="' + esc(link) + '"' +
          ' placeholder="' + esc(t("linkPh")) + '"' +
          ' data-date="' + esc(sl.date) + '" data-pf="' + esc(sl.platform || "X") +
          '" data-time="' + esc(sl.time) + '">' +
          (link ? '<a class="goto" href="' + esc(link) + '" target="_blank" rel="noopener">' +
                  esc(t("open")) + ' ↗</a>' : "") +
        '</div>';
      html += '</div></div>';
    });
    var tr = (schedule.trash || []).slice().reverse();
    html += '<div class="trash"><p class="plabel">' + esc(t("trash")) + '</p>' +
      (tr.length
        ? tr.map(function (x) {
            return '<div class="trow"><span class="tiny">' + esc(x.date) + " · " +
              esc(pfn(x.platform)) + " · " + esc(x.time) +
              (x.label ? " · " + esc(x.label) : "") + '</span>' +
              '<button class="donebtn restore" data-k="' + esc(slotKey(x)) + '">' +
              esc(t("restore")) + '</button></div>';
          }).join("")
        : '<p class="tiny">' + esc(t("emptyTrash")) + '</p>') +
      '</div><div class="disk" id="diskBox" hidden></div>';

    view.innerHTML = html + '</div>';
    renderDisk();
    fillMedia();
