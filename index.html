  function ghSaveJson(path, obj, msg) {
    if (!storeOn()) return Promise.resolve({ where: "local" });
    var c = storeGet();
    return ghApi(c, path).then(function (r) { return r.ok ? r.json() : null; }).then(function (prev) {
      var bytes = new TextEncoder().encode(JSON.stringify(obj, null, 2) + "\n");
      var bin = "";
      for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return ghApi(c, path, {
        method: "PUT",
        headers: { "Authorization": "Bearer " + c.token, "Accept": "application/vnd.github+json", "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg, content: btoa(bin), sha: prev ? prev.sha : undefined }),
      });
    }).then(function (r) { if (!r.ok) throw new Error(r.status); return { where: "repo" }; });
  }

  function renderPrep2() {
    chansEl.hidden = true;
    if (!schedule) { view.innerHTML = '<p class="empty">' + esc(t("none")) + '</p>'; return; }
    if (!calView) calView = window.innerWidth < 640 ? "3day" : "week";

      main = calToolbar(calMonth.replace("-", " / ")) + calMonthHTML();
    } else {

      main = calToolbar(calTitle(days)) + calWeekHTML(days);

    view.innerHTML = '<div class="gcal">' + calSide() + '<section class="gmain">' + main + '</section></div>';

  function renderPrep() {
    chansEl.hidden = false;
    if (!schedule) { view.innerHTML = '<p class="empty">' + esc(t("none")) + '</p>'; return; }

    var now = new Date();
    var from = ymd(now);
    var till = new Date(now); till.setDate(till.getDate() + 6);
    var to = ymd(till);

    var chId = schedule.channel || "hiyoko";
    var q = prepSearch.trim().toLowerCase();
    // 検索しているときは、今週に絞らず全部から探す。そうでなければ今週だけ
    var list = (schedule.slots || []).filter(function (x) {
      if (filter && slotCh(x) !== filter) return false;
      if (q) return true;
      // 終わったものも残す。あとから見返せるように
      return x.date >= from && x.date <= to;
    }).filter(function (x) {
      if (!q) return true;
      var hay = [
        x.date, x.time, x.label, x.comment, pfn(x.platform),
        (chanOfSlot(x) || {}).name,
        x.text && x.text.en, x.text && x.text.ja, x.text && x.text.ko,
        (x.parts || []).map(function (p) { return p.en + " " + p.ja + " " + (p.no || ""); }).join(" "),
      ].filter(Boolean).join(" ").toLowerCase();
      return hay.indexOf(q) >= 0;
    }).sort(function (a, b) {
      return (a.date + a.time) < (b.date + b.time) ? -1 : 1;
    });

    copyBank = {};

    if (editing) {
      view.innerHTML = editForm();
      return;
    }

    var html = '<div class="prep">' +
      '<div class="bar newbar">' +
      '<div class="searchbox">' +
        '<input type="search" id="prepSearch" placeholder="' + esc(t("searchPh")) + '" value="' + esc(prepSearch) + '">' +
        (prepSearch ? '<button id="prepSearchX" class="searchclr" aria-label="clear">×</button>' : "") +
      '</div>' +
      '<button id="newSlot" class="donebtn strong">' + esc(t("newSlot")) + '</button></div>';

    // チャンネルごとの定型文（押すと写せる）
    channels.forEach(function (c) {
      if (filter !== c.id) return;        // 全体では出さない。選んだときだけ
      (c.snippets || []).forEach(function (sn, si) {
        html += '<div class="snip" style="--chc:' + esc(c.color || "var(--wood)") + '">' +
          '<div class="phead snhead"><span class="who">' + esc(c.name) + '</span>' +
          '<span class="when">' + esc(sn.title || "") + '</span></div>' +
          (sn.url ? '<div class="snurl"><code>' + esc(sn.url) + '</code>' +
            '<button class="cpy" data-ck="sn' + si + 'u" data-lg="en">' + esc(t("copy")) + '</button></div>' : "") +
          ((sn.items && sn.items.length > 1)
            ? '<div class="snpick"><button class="cpy" data-ck="sn' + si + 'r" data-lg="en">' +
              esc(t("pickOne")) + ' ↻</button><span class="snpicked"></span></div>' : "") +
          '<div class="snlist">' + (sn.items || []).map(function (it, k) {
            copyBank["sn" + si + "_" + k] = { en: it, cur: it };
            return '<button class="snitem" data-ck="sn' + si + "_" + k + '" data-lg="en">' + esc(it) + '</button>';
          }).join("") + '</div></div>';
        if (sn.url) copyBank["sn" + si + "u"] = { en: sn.url, cur: sn.url };
        // 「どれか1つ」は押すたびに選び直す
        if (sn.items && sn.items.length) {
          copyBank["sn" + si + "r"] = { pick: sn.items.slice() };
        }
      });
    });
    if (!list.length) {
      view.innerHTML = html + '<p class="empty">' + esc(q ? t("noMatch") : t("prepEmpty")) + '</p></div>';
      return;
    }

    // ページ数で行き来できるようにする。多いと読みにくいので、1ページぶんだけ出す
    var totalPages = Math.max(1, Math.ceil(list.length / PREP_PAGE_SIZE));
    if (prepPage > totalPages) prepPage = totalPages;
    if (prepPage < 1) prepPage = 1;
    var pgFrom = (prepPage - 1) * PREP_PAGE_SIZE + 1;
    var pgTo = Math.min(list.length, prepPage * PREP_PAGE_SIZE);
    var pageList = list.slice((prepPage - 1) * PREP_PAGE_SIZE, prepPage * PREP_PAGE_SIZE);

    html += '<p class="resultcount">' + pgFrom + '–' + pgTo + ' / ' + list.length + '</p>';

    // 一覧では見出し行だけ。タップすると専用ページへ
    pageList.forEach(function (sl, i) {
      html += '<div class="pcard">' + prepHeadHTML(sl, i) + '</div>';
    });

    if (totalPages > 1) {
      html += '<div class="pager">' +
        '<button class="pgbtn pgnav" data-pg="' + (prepPage - 1) + '"' +
          (prepPage <= 1 ? ' disabled' : '') + '>‹ ' + esc(t("pgPrev")) + '</button>' +
        '<span class="pgnums">' + pageNums(prepPage, totalPages).map(function (n) {
          return n === "…"
            ? '<span class="pgdots">…</span>'
            : '<button class="pgbtn' + (n === prepPage ? ' pgcur' : '') + '" data-pg="' + n + '">' + n + '</button>';
        }).join("") + '</span>' +
        '<button class="pgbtn pgnav" data-pg="' + (prepPage + 1) + '"' +
          (prepPage >= totalPages ? ' disabled' : '') + '>' + esc(t("pgNext")) + ' ›</button>' +
      '</div>';
    }

    var tr = (schedule.trash || []).slice().reverse();
    html += '<div class="trash"><p class="plabel">' + esc(t("trash")) + '</p>' +
      (tr.length
        ? tr.map(function (x) {
            return '<div class="trow"><span class="tiny">' + esc(x.date) + " · " +
              esc(pfn(x.platform)) + " · " + esc(x.time) +
              (x.label ? " · " + esc(x.label) : "") + '</span>' +
              '<button class="donebtn restore" data-k="' + esc(slotKey(x)) + '">' +
              esc(t("restore")) + '</button></div>';
          }).join("")
        : '<p class="tiny">' + esc(t("emptyTrash")) + '</p>') +
      '</div><div class="disk" id="diskBox" hidden></div>';

    view.innerHTML = html + '</div>';
    renderDisk();
    fillMedia();
  }

  // ---- 予約状況 ----
  // その日、全部のチャンネルが用意できているかを1目で見る。
  // 表にせず、日ごとの札にしてスマホでも縦に読めるようにする
  function renderBook() {
    chansEl.hidden = true;
    if (!schedule) { view.innerHTML = '<p class="empty">' + esc(t("none")) + '</p>'; return; }

    var now = new Date();
    var days = weekRange(now);
    var chId = schedule.channel || "hiyoko";

    var html = '<div class="book">';
    days.forEach(function (d) {
      var dt = ymd(d);
      var isToday = dt === ymd(now);
      var isPast = dt < ymd(now);
      var byCh = {};

      channels.forEach(function (c) {
        (c.postTimes || []).forEach(function (pt) {
          if (c.id !== chId) return;
          var sl = (schedule.slots || []).filter(function (x) {
            return x.date === dt && x.time === pt.time &&
                   (x.platform || "X") === (pt.platform || "X");
          })[0];
          if (!sl) return;
          var hh = pt.time.split(":");
          var when = new Date(d.getFullYear(), d.getMonth(), d.getDate(), +hh[0], +hh[1]);
          var st = slotState(sl, when, now);
          (byCh[c.id] = byCh[c.id] || { ch: c, items: [] }).items.push({
            pt: pt, st: st
          });
        });
      });

      var all = [], late = 0;
      Object.keys(byCh).forEach(function (k) {
        byCh[k].items.forEach(function (it) {
          all.push(it.st);
          if (it.st === "late") late++;
        });
      });
      var todo = all.filter(function (x) { return x !== "sched" && x !== "done"; }).length;
      var verdict = !all.length ? esc(t("nothingToday"))
        : (todo === 0 ? esc(t("allBooked")) : esc(t("leftToDo")) + " " + todo);
      var ok = !all.length ? "" : (late ? "late" : (todo === 0 ? "true" : "false"));

      html += '<div class="bday' + (isToday ? " today" : "") + (isPast ? " past" : "") + '">' +
        '<div class="bhead"><span class="d">' + (d.getMonth() + 1) + "/" + d.getDate() +
        ' <span class="w">' + (DOW[lang] || DOW.en)[d.getDay()] + '</span></span>' +
        '<span class="v" data-ok="' + ok + '">' + verdict + '</span></div>';

      Object.keys(byCh).forEach(function (k) {
        var g = byCh[k];
        html += '<div class="brow" style="--chc:' + esc(g.ch.color || "var(--wood)") + '">' +
          '<span class="nm">' + esc(g.ch.name) + '</span><span class="pips">' +
          g.items.map(function (it) {
            return '<span class="pip" data-s="' + it.st + '">' +
                   esc(pfn(it.pt.platform)) + ' <b>' + esc(it.pt.time) + '</b></span>';
          }).join("") + '</span></div>';
      });
      html += '</div>';
    });
    view.innerHTML = html + '</div>';
  }

  // ---- KPI ----
  // 各チャンネルのフォロワーとフォロー。前回計測との差を出す
  var kpi = null;
  var chores = null;      // いいね作業のチェック（chores.json）
  var choreDate = null;
  var agOpen = {};        // 今週（スマホ）で開いた日。既定は今日だけ開く
  var chOpen = {};        // 既定の開閉を、見出しで反転させたもの

  // 折れ線。点が1つしかない間は横線と点だけを出す
  function spark(vals, w, h) {
    if (!vals.length) return "";
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var pad = 4, span = (max - min) || 1;
    function x(k) { return vals.length < 2 ? w / 2 : pad + k * (w - pad * 2) / (vals.length - 1); }
    function y(v) { return h - pad - (v - min) / span * (h - pad * 2); }
    var pts = vals.map(function (v, k) { return x(k).toFixed(1) + "," + y(v).toFixed(1); });
    var line = vals.length < 2
      ? '<line x1="' + pad + '" y1="' + y(vals[0]).toFixed(1) + '" x2="' + (w - pad) +
        '" y2="' + y(vals[0]).toFixed(1) + '" class="sl"></line>'
      : '<polyline points="' + pts.join(" ") + '" class="sl"></polyline>' +
        '<polygon points="' + pts.join(" ") + " " + x(vals.length - 1).toFixed(1) + "," + (h - pad) +
        " " + x(0).toFixed(1) + "," + (h - pad) + '" class="sa"></polygon>';
    var last = vals[vals.length - 1];
    return '<svg class="spark" viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none">' +
      line + '<circle cx="' + x(vals.length - 1).toFixed(1) + '" cy="' + y(last).toFixed(1) +
      '" r="2.6" class="sd"></circle></svg>';
  }

  // ---- いいね作業のチェックリスト ----
  // 表計算で毎日 TRUE/FALSE を付けていたものを、ここで押せるようにする。
  // 誰が押しても全員に見えるよう、置き場（chores.json）へ書き戻す
  // 作業は時刻ごとに回す（9:30になったら全アカウントのいいね）ので、時刻を主にする。
  // アカウントごとに縦に積むと46行・2,000pxになり、目的の行を探すのに時間がかかった
  function toMin(tm) { var m = /^(\d{1,2}):(\d{2})/.exec(tm || ""); return m ? (+m[1]) * 60 + (+m[2]) : 9999; }

  // 作業が「いいね」と「インプレッション確認」だけになったので、
  // アカウント×時間帯の小さな表にする。表計算で見慣れた並びでもある
  function choreShort(task) {
    if (/インプレッション/.test(task)) return "インプレ";
    if (/3M|csv/i.test(task)) return "3M / CSV";
    return task.replace(/\s+/g, "").toUpperCase();
  }

  function choresHTML() {
    if (!chores || !chores.lists) return "";
    if (!choreDate) choreDate = ymd(new Date());
    var dayDone = (chores.done && chores.done[choreDate]) || {};

    var tset = {}, total = 0, doneN = 0;
    var lists = chores.lists.filter(function (li) { return !filter || filter === li.channel; });
    lists.forEach(function (li) {
      li.tasks.forEach(function (tk) { tset[tk.time] = 1; total++; if (dayDone[tk.id]) doneN++; });
    });
    var times = Object.keys(tset).sort(function (x, y) { return toMin(x) - toMin(y); });

    // 今の時間帯（今日だけ）: 始まっているうち一番遅いもの
    var now = new Date(), cur = null;
    if (choreDate === ymd(now)) {
      var nm = now.getHours() * 60 + now.getMinutes();
      times.forEach(function (tm) { if (toMin(tm) <= nm) cur = tm; });
    }

    var pct = total ? Math.round(doneN / total * 100) : 0;
    var html = '<div class="chores"><div class="chhead"><p class="kgtitle">' + esc(t("chTitle")) + '</p>' +
      '<input type="date" id="choreDate" value="' + esc(choreDate) + '">' +
      '<span class="calcount" data-full="' + (doneN === total) + '">' + doneN + "/" + total + '</span>' +
      '<span class="tiny" id="choreOut"></span></div>' +
      '<div class="chprog"><i style="width:' + pct + '%"></i></div>' +
      '<div class="chwrap"><table class="chtab"><thead><tr><th></th>' +
      times.map(function (tm) {
        return '<th class="' + (tm === cur ? "now" : "") + '">' + esc(tm) + '</th>';
      }).join("") + '</tr></thead><tbody>';

    lists.forEach(function (li) {
      var c = chanOf(li.channel) || { name: li.channel, color: "var(--wood)" };
      html += '<tr style="--chc:' + esc(c.color || "var(--wood)") + '"><th class="chacc2">' +
        '<b>' + esc(c.name) + '</b><i>' + esc(pfn(li.platform)) + '</i></th>';
      times.forEach(function (tm) {
        var tks = li.tasks.filter(function (tk) { return tk.time === tm; });
        html += '<td class="' + (tm === cur ? "now" : "") + '">' + tks.map(function (tk) {
          var on = !!dayDone[tk.id];
          return '<button class="chchip" data-id="' + esc(tk.id) + '" data-on="' + on + '" title="' +
            esc(tk.task) + '">' + (on ? "\u2713 " : "") + esc(choreShort(tk.task)) + '</button>';
        }).join("") + '</td>';
      });
      html += '</tr>';
    });
    return html + '</tbody></table></div></div>';
  }

  // 押した1件だけを、置き場の最新に重ねて書く（他の人の印を消さない）
  function saveChore(date, id, on) {
    chores.done = chores.done || {};
    chores.done[date] = chores.done[date] || {};
    if (on) chores.done[date][id] = true; else delete chores.done[date][id];
    if (!storeOn()) return Promise.resolve({ where: "local" });
    var c = storeGet();
    return ghApi(c, "chores.json").then(function (r) { return r.ok ? r.json() : null; })
      .then(function (prev) {
        var body = chores;
        if (prev) {
          try {
            var bin0 = atob((prev.content || "").replace(/\n/g, ""));
            var b0 = new Uint8Array(bin0.length);
            for (var i0 = 0; i0 < bin0.length; i0++) b0[i0] = bin0.charCodeAt(i0);
            body = JSON.parse(new TextDecoder("utf-8").decode(b0));
            body.done = body.done || {};
            body.done[date] = body.done[date] || {};
            if (on) body.done[date][id] = true; else delete body.done[date][id];
            chores = body;
          } catch (e) {}
        }
        var bytes = new TextEncoder().encode(JSON.stringify(body, null, 2) + "\n");
        var bin = "";
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return ghApi(c, "chores.json", {
          method: "PUT",
          headers: { "Authorization": "Bearer " + c.token, "Accept": "application/vnd.github+json",
                     "Content-Type": "application/json" },
          body: JSON.stringify({ message: "chores: " + date + " " + id + (on ? " on" : " off"),
                                 content: btoa(bin), sha: prev ? prev.sha : undefined }),
        });
      }).then(function (r) {
        if (r && !r.ok) throw new Error(r.status);
        return { where: "repo" };
      });
  }

      var chHtml = "", chHas = false;
      ["X", "IG", "FB", "TT", "YT"].forEach(function (pf) {
        var arr = byKey[c.id + "|" + pf];

        shown++; chHas = true;
        var cur = arr[arr.length - 1], prev = arr.length > 1 ? arr[arr.length - 2] : null;
        var fs = arr.map(function (r) { return r.followers; }).filter(function (v) { return typeof v === "number"; });
        var dif = prev && typeof prev.followers === "number" ? cur.followers - prev.followers : null;
        var difHtml = (dif === null || dif === 0) ? "" :
          '<span class="dif" data-up="' + (dif > 0) + '">' + (dif > 0 ? "+" : "") + dif + '</span>';

        chHtml += '<div class="kcard" style="--chc:' + esc(c.color || "var(--wood)") + '">' +
          '<div class="khead">' +
            '<i class="pf" data-p="' + pf + '">' + pf + '</i>' +
            '<span class="who">' + esc(c.name) + '</span>' +
            '<span class="kdate">' + esc(cur.date) + '</span>' +
          '</div>' +
          '<div class="kbody">' +
            '<div class="kmain">' +
              '<span class="lbl">' + esc(t("followers")) + '</span>' +
              '<span class="val">' + (cur.followers || 0).toLocaleString() + '</span>' + difHtml +
            '</div>' +
            '<div class="kchart">' + spark(fs, 120, 40) + '</div>' +
          '</div>' +
          (typeof cur.following === "number"
            ? '<p class="ksub">' + esc(t("following")) + " " + cur.following.toLocaleString() + '</p>'
            : "") +
        '</div>';
      });
      if (chHas) {
        html += '<div class="kgroup" style="--chc:' + esc(c.color || "var(--wood)") + '">' +
          '<p class="kgtitle">' + esc(c.name) + '</p>' + chHtml + '</div>';
      }
    });
    view.innerHTML = (shown ? html + '</div>' : '<p class="empty">' + esc(t("noKpi")) + '</p>') + choresHTML();
  }

      if (gone) schedule.trash = (schedule.trash || []).concat([gone]).slice(-30);
      schedule.slots = (schedule.slots || []).filter(function (x) { return slotKey(x) !== kk; });
      location.hash = "";     // 消した枠のページには留まれない
      saveSchedule("schedule: remove " + kk).then(function () { renderPrep(); },
                   function () { renderPrep(); });
      return;
    }
    if (e.target.id === "eSave") {
      var o = readForm();
      var out = document.getElementById("eOut");
      if (!o.date || !o.time) { out.textContent = t("saveFail"); return; }
      out.textContent = t("saving");
      var was = editing && editing.date ? slotKey(editing) : null;

      // HIYOKOの新規動画は、同じ映像を3か所（IGリール・YouTubeショート・TikTok）へ出す。
      // 出し先ごとに投稿は別なので、枠も確認チェックも別々に作る
      var toAdd = [o];
      if (!was && o.channel === "hiyoko" && o.type === "video") {
        var VIDEO_OUT = [
          { platform: "IG", tag: "Reel" },
          { platform: "YT", tag: "Shorts" },
          { platform: "TT", tag: "TikTok" },
        ];
        toAdd = VIDEO_OUT.map(function (v) {
          var c = JSON.parse(JSON.stringify(o));
          c.platform = v.platform;
          c.label = (o.label ? o.label + " · " : "") + v.tag;
          c.scheduled = false; c.posted = false; c.url = "";
          c.check = { done: false, at: "", match: null, note: "" };
          return c;
        });
      }

      var keepKeys = {};
      toAdd.forEach(function (x) { keepKeys[slotKey(x)] = 1; });
      schedule.slots = (schedule.slots || []).filter(function (x) {
        if (was && slotKey(x) === was) return false;
        return !keepKeys[slotKey(x)];
      });
      toAdd.forEach(function (x) { schedule.slots.push(x); });
      schedule.slots.sort(function (a, b) {
        return (a.date + a.time + (a.platform || "")) < (b.date + b.time + (b.platform || "")) ? -1 : 1;
      });
      saveSchedule("schedule: " + o.date + " " + o.time + " " +
        (toAdd.length > 1 ? "video x3" : o.platform)).then(function (r) {
        out.textContent = (r.where === "repo" ? t("savedTo") : t("savedHere")) +
          (toAdd.length > 1 ? " · IG/YT/TT" : "");
        setTimeout(function () { editing = null; renderPrep(); }, 900);
      }, function () { out.textContent = t("saveFail"); });
      return;
    }

    var ni = e.target.closest(".noimg");
    if (ni) {
      partsSet(ni.getAttribute("data-mk"), "ni_" + ni.getAttribute("data-pid"),
               ni.getAttribute("data-on") !== "true");
      prepAgain();
      return;
    }
    var pc = e.target.closest(".pchk");
    if (pc) {
      partsSet(pc.getAttribute("data-mk"), pc.getAttribute("data-pid"),
               pc.getAttribute("data-on") !== "true");
      prepAgain();
      return;
    }
    var md = e.target.closest(".mdel");
    if (md) {
      e.stopPropagation();
      // 1回目は聞き返すだけ。連打で消えないよう、少し待ってから受け付ける
      if (md.getAttribute("data-ask") !== "yes") {
        md.setAttribute("data-ask", "wait");
        md.textContent = t("sure");
        setTimeout(function () {
          if (md.getAttribute("data-ask") === "wait") md.setAttribute("data-ask", "yes");
        }, 400);
        clearTimeout(md.__t);
        md.__t = setTimeout(function () {
          md.removeAttribute("data-ask");
          md.textContent = "×";
        }, 4000);
        return;
      }
      var dk = md.getAttribute("data-mk");
      var rm = storeOn() ? removeRemote(dk) : Promise.resolve();
      rm.then(function () {
        try {
          var m2 = JSON.parse(localStorage.getItem("remitech-media-url") || "{}");
          delete m2[dk];
          localStorage.setItem("remitech-media-url", JSON.stringify(m2));
        } catch (e) {}
        return dbDel(dk);
      }).then(function () { prepAgain(); });
      return;
    }
    var ph = e.target.closest(".phead");
    if (ph && !ph.classList.contains("snhead")) {
      var k2 = ph.getAttribute("data-k");
      if (k2) location.hash = "/prep/" + encodeURIComponent(k2);
      return;
    }
    var cp = e.target.closest(".cpy, .snitem");
    if (cp) {
      var bank = copyBank[cp.getAttribute("data-ck")];
      var txt = "";
      if (bank && bank.pick) {
        var tries = 0;
        do { txt = bank.pick[Math.floor(Math.random() * bank.pick.length)]; }
        while (bank.pick.length > 1 && txt === bank.last && ++tries < 10);
        bank.last = txt;
        var shown = cp.parentNode.querySelector(".snpicked");
        if (shown) shown.textContent = txt + "\u3000(" + txt.length + ")";
      } else if (bank) {
        txt = cp.getAttribute("data-lg") === "en" ? bank.en : bank.cur;
      }
      var was = cp.textContent;
      if (txt && navigator.clipboard) {
        navigator.clipboard.writeText(txt).then(function () {
          cp.setAttribute("data-done", "true");
          cp.textContent = "✓";
          setTimeout(function () {
            cp.removeAttribute("data-done");
            cp.textContent = was;
          }, 1600);
        });
      }
      return;
    }
    var db = e.target.closest(".donebtn");
    if (db) {
      var dd = db.getAttribute("data-date"), dt2 = db.getAttribute("data-time");
      var dp = db.getAttribute("data-pf") || "X";
      var slx = (schedule.slots || []).filter(function (x) {
        return x.date === dd && x.time === dt2 && (x.platform || "X") === dp;
      })[0];
      if (!slx) return;
      var mark = db.getAttribute("data-mark");
      var turnOn = db.getAttribute("data-on") !== "true";
      if (mark === "checked" && turnOn && !(stGet(slx).url || slx.url)) {
        db.textContent = t("needUrl");
        setTimeout(function () { prepAgain(); }, 1600);
        return;
      }
      markSave(slx, mark, turnOn);
      prepAgain();
      return;
    }
    var mb = e.target.closest(".matbtn, .mt");
    if (!mb) return;
    var dt = mb.getAttribute("data-date"), tm = mb.getAttribute("data-time");
    var pf = mb.getAttribute("data-pf") || "X";
    var sl = (schedule.slots || []).filter(function (x) {
      return x.date === dt && x.time === tm && (x.platform || "X") === pf;
    })[0];
    if (!sl) return;
    matSet(sl, mb.getAttribute("data-kind"), mb.getAttribute("data-on") !== "true");
    if (tab === "dash" && !/^#\/prep\//.test(location.hash)) { renderDash(); } else { prepAgain(); }
  });

  view.addEventListener("change", function (e) {
    if (e.target.classList && e.target.classList.contains("ownerSel")) {
      var ok = e.target.getAttribute("data-k");
      var sl4 = (schedule.slots || []).filter(function (x) { return slotKey(x) === ok; })[0];
      if (sl4) { sl4.owner = e.target.value; saveSchedule("schedule: owner " + ok); }
      return;
    }
    if (e.target.classList && e.target.classList.contains("pmemo-in")) {
      flushSave();          // 入力欄を離れたら、待たずに書く
      return;
    }
    if (e.target.classList && e.target.classList.contains("gpchk")) {
      var gch = e.target.getAttribute("data-ch");
      if (e.target.checked) delete calHide[gch]; else calHide[gch] = true;
      try { localStorage.setItem("remitech-calhide", JSON.stringify(calHide)); } catch (e4) {}
      calSel = null; renderPrep2(); return;
    }
    if (e.target.classList && e.target.classList.contains("grf")) {
      var gri = +e.target.closest(".grule").getAttribute("data-i");
      recurDraft.rules[gri][e.target.getAttribute("data-f")] = e.target.value;
      if (e.target.getAttribute("data-f") === "channel") renderPrep2();
      return;
    }
    if (e.target.id === "choreDate") { choreDate = e.target.value; chOpen = {}; renderKpi(); return; }
    if (e.target.classList && e.target.classList.contains("mfile")) {
      takeFile(e.target.getAttribute("data-mk"), e.target.files && e.target.files[0]);
      return;
    }
    if (e.target.id === "impFile") {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        var ta = document.getElementById("impText");
        if (ta) ta.value = fr.result;
        importRead(fr.result);
      };
      fr.readAsText(f);
      return;
    }
    var cb = e.target.closest("input[type=checkbox]");
    if (!cb) return;
    if (cb.id === "remOn") {
      var p = remindPrefs(); p.on = cb.checked; saveRemind(p);
      if (p.on && "Notification" in window && Notification.permission === "default") {
        Notification.requestPermission().then(function () { renderDash(); });
        return;
      }
      renderDash(); return;
    }
  });

  view.addEventListener("input", function (e) {
    if (e.target.classList && e.target.classList.contains("plink")) {
      var sl2 = (schedule.slots || []).filter(function (x) {
        return x.date === e.target.getAttribute("data-date") &&
               x.time === e.target.getAttribute("data-time") &&
               (x.platform || "X") === (e.target.getAttribute("data-pf") || "X");
      })[0];
      if (sl2) {
        var v = e.target.value.trim();
        markSave(sl2, "url", v);
        // リンクが入った時点で「投稿完了」とみなす。貼る＝出したということなので
        if (v && !isPosted(sl2)) { markSave(sl2, "posted", true); prepAgain(); }
      }
      return;
    }
    if (e.target.classList && e.target.classList.contains("pmemo-in")) {
      var mkk = e.target.getAttribute("data-k");
      var msl = (schedule.slots || []).filter(function (x) { return slotKey(x) === mkk; })[0];
      if (!msl) return;
      msl.memo = e.target.value.trim();
      saveSoon(function () { return saveSchedule("schedule: memo " + mkk); }, 800);
      return;
    }
    if (e.target.id === "tgDate") { tgDate = e.target.value; renderTelegram(); return; }
    if (e.target.id === "prepSearch") {
      prepSearch = e.target.value; prepPage = 1;
      var sel = e.target.selectionStart;
      renderPrep();
      var el = document.getElementById("prepSearch");
      if (el) { el.focus(); el.setSelectionRange(sel, sel); }
      return;
    }
    if (e.target.id === "impText") { importRead(e.target.value); return; }
    if (e.target.id === "impUrl") { return; }
    if (e.target.id === "remMin") {
      var p = remindPrefs(); p.min = +e.target.value; saveRemind(p);
      renderDash(); return;
    }
    if (e.target.id === "wsPick") {
      try { localStorage.setItem("remitech-weekstart", e.target.value); } catch (err) {}
      renderDash();
    }
  });

  view.addEventListener("click", function (e) {
    if (tab === "import" && e.target.tagName === "BUTTON") { importClick(e); return; }
    var card = e.target.closest(".card");
    if (card) { location.hash = "/" + card.getAttribute("data-id"); return; }
    if (e.target.closest("#backBtn")) { flushSave(); location.hash = ""; }
  });
  // 貼り付け欄にファイルを置いても読む
  view.addEventListener("dragover", function (e) {
    if (tab !== "import") return;
    e.preventDefault();
    var ta = document.getElementById("impText");
    if (ta) ta.setAttribute("data-drop", "true");
  });
  view.addEventListener("dragleave", function () {
    var ta = document.getElementById("impText");
    if (ta) ta.removeAttribute("data-drop");
  });
  // 画像の置き入れ（ブロックごと）
  view.addEventListener("dragover", function (e) {
    var col = e.target.closest && e.target.closest(".mcol");
    if (!col) return;
    e.preventDefault();
    col.setAttribute("data-drop", "true");
  });
  ["dragleave", "drop"].forEach(function (ev) {
    view.addEventListener(ev, function (e) {
      var col = e.target.closest && e.target.closest(".mcol");
      if (col) col.removeAttribute("data-drop");
    });
  });
  view.addEventListener("drop", function (e) {
    var col = e.target.closest && e.target.closest(".mcol");
    if (col) {
      e.preventDefault();
      var holder = col.querySelector(".mediabox[data-mk], .mfile[data-mk]");
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (holder && f) takeFile(holder.getAttribute("data-mk"), f);
      return;
    }
    if (tab !== "import") return;
    e.preventDefault();
    var ta = document.getElementById("impText");
    if (ta) ta.removeAttribute("data-drop");
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function () { if (ta) ta.value = fr.result; importRead(fr.result); };
    fr.readAsText(f);
  });

  view.addEventListener("keydown", function (e) {
    if (e.target.id === "impUrl" && e.key === "Enter") {
      e.preventDefault();
      if (e.target.value.trim()) importUrl(e.target.value.trim());
    }
  });
  view.addEventListener("paste", function (e) {
    if (e.target.id !== "impUrl") return;
    setTimeout(function () {
      var v = document.getElementById("impUrl");
      if (v && v.value.trim()) importUrl(v.value.trim());
    }, 0);
  });

  // 上へ戻る。scroll だけに頼ると取りこぼすので、短い間隔でも見る
  (function () {
    var btn = document.getElementById("toTop");
    var on = null;
    function top() {
      return window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0;
    }
    function sync() {
      var v = top() > 320;
      if (v === on) return;
      on = v;
      if (v) { btn.hidden = false; btn.setAttribute("data-in", "true"); }
      else { btn.setAttribute("data-in", "false"); setTimeout(function () {
        if (btn.getAttribute("data-in") !== "true") btn.hidden = true;
      }, 220); }
    }
    window.addEventListener("scroll", sync, { passive: true });
    document.addEventListener("scroll", sync, { passive: true });
    setInterval(sync, 250);
    btn.addEventListener("click", function () {
      var smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
      window.scrollTo({ top: 0, behavior: smooth ? "smooth" : "auto" });
      document.documentElement.scrollTop = 0;
    });
    sync();
  })();

  window.addEventListener("hashchange", route);

  // 置かれているファイルが差し替わったかを、たまに見に行く。
  // 作業中に画面を作り直すと入力が消えるので、帯を出すだけにする
  var seen = {};
  function stamp(res) {
    return (res.headers.get("etag") || "") + "|" + (res.headers.get("last-modified") || "");
  }
  function watchUpdates() {
    ["./posts.json", "./schedule.json", "./kpi.json"].forEach(function (u) {
      fetch(u, { method: "HEAD", cache: "no-store" }).then(function (r) {
        if (!r.ok) return;
        var st = stamp(r);
        if (!st) return;
        if (seen[u] === undefined) { seen[u] = st; return; }
        if (seen[u] !== st) {
          seen[u] = st;
          var el = document.getElementById("toast");
          document.getElementById("toastText").textContent = t("updated");
          document.getElementById("toastGo").textContent = t("reload");
          el.hidden = false;
          clearTimeout(window.__toastT);
          window.__toastT = setTimeout(function () { el.hidden = true; }, 20000);  // 放っておけば消える
        }
      }).catch(function () {});
    });
  }
  document.getElementById("toastGo").addEventListener("click", function () { location.reload(); });
  document.getElementById("toastX").addEventListener("click", function () {
    document.getElementById("toast").hidden = true;
  });
  watchUpdates();
  setInterval(watchUpdates, 300000);        // 5分ごと

  // いいね作業の印は、何人かが同時に押す。他の人の印も、開いたまま見えるようにする。
  // 鍵のある端末: GitHubから直接10秒ごと（公開ページの反映待ち1〜2分を飛ばせる）。
  //   変わっていなければ 304 が返り、GitHubの回数制限にも数えられない
  // 鍵のない端末: 公開ページを60秒ごと
  var choreEtag = null, choreBusy = false;
  function applyChores(c) {
    if (!c || !chores) return;
    if (JSON.stringify(c.done || {}) === JSON.stringify(chores.done || {}) &&
        JSON.stringify(c.lists || []) === JSON.stringify(chores.lists || [])) return;
    chores = c;
    var y2 = window.scrollY; renderKpi(); window.scrollTo(0, y2);
  }
  function pullChores() {
    if (tab !== "kpi" || document.hidden || choreBusy || /^#\/prep\//.test(location.hash)) return Promise.resolve();
    if (storeOn()) {
      var c = storeGet();
      var h = { "Authorization": "Bearer " + c.token, "Accept": "application/vnd.github+json" };
      if (choreEtag) h["If-None-Match"] = choreEtag;
      return fetch("https://api.github.com/repos/" + c.url + "/contents/chores.json", { headers: h, cache: "no-store" })
        .then(function (r) {
          if (r.status === 304 || !r.ok) return null;
          choreEtag = r.headers.get("ETag");
          return r.json();
        })
        .then(function (j) {
          if (!j) return;
          var bin = atob((j.content || "").replace(/\n/g, ""));
          var b0 = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) b0[i] = bin.charCodeAt(i);
          applyChores(JSON.parse(new TextDecoder("utf-8").decode(b0)));
        }).catch(function () {});
    }
    return fetch("./chores.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(applyChores).catch(function () {});
  }
  (function loop() {
    pullChores().then(function () { setTimeout(loop, storeOn() ? 10000 : 60000); });
  })();
  // 画面に戻ってきたら、すぐ読む
  document.addEventListener("visibilitychange", function () { if (!document.hidden) pullChores(); });

  // 週表のときだけ枠を広げる
  function syncWide() {
    document.body.setAttribute("data-wide", (tab === "dash" || tab === "kpi" || tab === "prep2") ? "true" : "false");
  }

  renderLang();
  renderNav();
  syncWide();
  document.getElementById("loading").textContent = t("loading");

  // 開発・更新・メンテナンス中は、通常の画面の前にこれだけを出す
  function renderMaintenance(mnt) {
    navEl.hidden = true;
    chansEl.hidden = true;
    var note = mnt.note || "";
    var until = mnt.until || "";
    view.innerHTML = '<div class="mnt">' +
      '<p class="mnttitle">' + esc(t("mntTitle")) + '</p>' +
      (note ? '<p class="mntnote">' + esc(note) + '</p>' : "") +
      (until ? '<p class="mntuntil">' + esc(t("mntUntil")) + " " + esc(until) + '</p>' : "") +
      '</div>';
  }

  function bootApp() {
    fetch("./posts.json", { cache: "no-cache" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) {
        channels = j.channels || [];
        posts = j.posts || [];
        fetch("./recurring.json", { cache: "no-cache" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (rc) {
            var loc = null;
            try { loc = JSON.parse(localStorage.getItem("remitech-recurring") || "null"); } catch (e) {}
            recurring = loc || rc || { rules: [] };
            if (tab === "prep2") renderPrep2();
          }).catch(function () {});
        fetch("./chores.json", { cache: "no-cache" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (c) { chores = c; if (tab === "kpi") renderKpi(); })
          .catch(function () {});
        fetch("./kpi.json", { cache: "no-cache" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (k) { kpi = k; if (tab === "kpi") renderKpi(); })
          .catch(function () {});
        return fetch("./schedule.json", { cache: "no-cache" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; })
          .then(function (sc) {
            schedule = sc;
            try {
              var mine = JSON.parse(localStorage.getItem("remitech-schedule") || "null");
              if (mine && mine.slots && mine.slots.length) {
                if (!schedule || !schedule.slots || !schedule.slots.length) {
                  schedule = mine;   // 置き場が読めないときだけ、端末のものを使う
                } else {
                  // 置き場のほうを正とする。端末にしかない枠（まだ同期できていない分）だけ足す
                  var haveKey = {};
                  schedule.slots.forEach(function (x) { haveKey[slotKey(x)] = 1; });
                  mine.slots.forEach(function (x) {
                    if (!haveKey[slotKey(x)]) { schedule.slots.push(x); haveKey[slotKey(x)] = 1; }
                  });
                  try { localStorage.setItem("remitech-schedule", JSON.stringify(schedule)); } catch (e2) {}
                }
              }
            } catch (e) {}
            renderChans(); route();
          });
      })
      .catch(function () { view.innerHTML = '<p class="empty">' + esc(t("fail")) + '</p>'; });
  }

  fetch("./maintenance.json", { cache: "no-cache" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .catch(function () { return null; })
    .then(function (mnt) {
      if (mnt && mnt.on) { renderMaintenance(mnt); return; }
      bootApp();
    });
})();
</script>
</body>
</html>
